name: Classifier v6 focused production acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DEFAULT_SCANNER_API_URL: https://seo-autopilot-4545-919035207432.europe-west1.run.app
  EXPECTED_CLASSIFIER: archetype_classifier_v6_saas_business_identity
  EXPECTED_FINGERPRINT: fa1bfae405d970fa
  EXPECTED_SCANNER: python_scanner_v3_bounded_request
  EXPECTED_SCANNER_BUILD: hard_page_cap_response_v1
  EXPECTED_REVIEW: python_review_v2_structural_marketplace
  EXPECTED_CALIBRATION: review_evidence_calibration_v5_utility_redirect

jobs:
  focused-acceptance:
    name: Scan nine focused production controls
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCANNER_API_KEY: ${{ secrets.SCANNER_API_KEY }}
      CONFIGURED_SCANNER_API_URL: ${{ secrets.SCANNER_API_URL }}

    steps:
      - name: Verify release and run focused scans
        shell: python
        run: |
          import gzip
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          base = (os.environ.get("CONFIGURED_SCANNER_API_URL") or os.environ["DEFAULT_SCANNER_API_URL"]).rstrip("/")
          key = os.environ.get("SCANNER_API_KEY", "")
          if not key:
              raise SystemExit("SCANNER_API_KEY is unavailable; no production scans were started.")

          expected = {
              "classifier": os.environ["EXPECTED_CLASSIFIER"],
              "fingerprint": os.environ["EXPECTED_FINGERPRINT"],
              "scanner": os.environ["EXPECTED_SCANNER"],
              "scanner_build": os.environ["EXPECTED_SCANNER_BUILD"],
              "review": os.environ["EXPECTED_REVIEW"],
              "calibration": os.environ["EXPECTED_CALIBRATION"],
          }
          sites = [
              ("Signal", "https://signal.org/", "saas_app_membership"),
              ("Buffer", "https://buffer.com/", "saas_app_membership"),
              ("Webflow", "https://webflow.com/", "saas_app_membership"),
              ("Nomadic Matt", "https://www.nomadicmatt.com/", "content_blog"),
              ("WPBeginner", "https://www.wpbeginner.com/", "content_blog"),
              ("Basecamp", "https://basecamp.com/", "saas_app_membership"),
              ("Linear", "https://linear.app/", "saas_app_membership"),
              ("Intercom", "https://www.intercom.com/", "saas_app_membership"),
              ("Shopify", "https://www.shopify.com/", "saas_app_membership"),
          ]
          asset_extensions = {
              ".avif", ".bmp", ".css", ".csv", ".doc", ".docx", ".eot", ".gif",
              ".ico", ".jpeg", ".jpg", ".js", ".json", ".map", ".mp3", ".mp4",
              ".pdf", ".png", ".ppt", ".pptx", ".svg", ".tif", ".tiff", ".ttf",
              ".txt", ".wav", ".webm", ".webp", ".woff", ".woff2", ".xls", ".xlsx",
              ".xml", ".zip",
          }

          def request_json(path, payload=None, timeout=210, attempts=3):
              url = base + path
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              headers = {"Accept": "application/json", "User-Agent": "SEO-Pilot-Acceptance/1.0"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
                  headers["x-scanner-key"] = key
              for attempt in range(1, attempts + 1):
                  try:
                      request = urllib.request.Request(url, data=data, headers=headers, method="GET" if data is None else "POST")
                      with urllib.request.urlopen(request, timeout=timeout) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", errors="replace")
                      if exc.code in {429, 500, 502, 503, 504} and attempt < attempts:
                          time.sleep(10 * attempt)
                          continue
                      raise RuntimeError(f"{path} HTTP {exc.code}: {body[:500]}") from exc
                  except (urllib.error.URLError, TimeoutError) as exc:
                      if attempt < attempts:
                          time.sleep(10 * attempt)
                          continue
                      raise RuntimeError(f"{path} request failed: {exc}") from exc

          def is_asset(value):
              if not value:
                  return False
              path = urllib.parse.urlparse(str(value)).path.lower()
              return any(path.endswith(extension) for extension in asset_extensions)

          health = request_json("/health", timeout=45)
          release_failures = []
          health_expectations = {
              "archetype_classifier_version": expected["classifier"],
              "beta_revision_fingerprint": expected["fingerprint"],
              "version": expected["scanner"],
              "scanner_build_revision": expected["scanner_build"],
              "review_version": expected["review"],
              "review_evidence_calibration_version": expected["calibration"],
          }
          for field, value in health_expectations.items():
              if health.get(field) != value:
                  release_failures.append(f"health.{field}: expected {value!r}, got {health.get(field)!r}")
          if release_failures:
              raise SystemExit("Production marker gate failed before scans:\n" + "\n".join(release_failures))

          raw_records = []
          summaries = []
          failures = []

          for index, (name, url, expected_archetype) in enumerate(sites, start=1):
              print(f"[{index}/9] Scanning {name}: {url}", flush=True)
              started = time.time()
              try:
                  scan = request_json("/scan", {
                      "website_url": url,
                      "scan_mode": "advanced",
                  })
                  if scan.get("success") is False:
                      raise RuntimeError(f"scanner returned failure envelope: {scan.get('error') or scan.get('detail')}")
                  review = request_json("/review", {"scan": scan}, timeout=180)
                  if review.get("success") is False:
                      raise RuntimeError(f"review returned failure envelope: {review.get('error') or review.get('detail')}")

                  fingerprint = review.get("site_fingerprint") or scan.get("site_fingerprint") or {}
                  classification = fingerprint.get("classification") or review.get("classification") or {}
                  primary = fingerprint.get("primary_archetype") or review.get("primary_archetype") or ""
                  classifier = review.get("archetype_classifier_version") or classification.get("classifier_version") or ""
                  pages_crawled = int(scan.get("pages_crawled") or 0)
                  fixes = review.get("recommendations") or review.get("fixes") or review.get("findings") or []
                  asset_urls = []
                  for fix in fixes:
                      if not isinstance(fix, dict):
                          continue
                      for field in ("page_url", "representative_page_url"):
                          value = fix.get(field)
                          if is_asset(value):
                              asset_urls.append(str(value))
                      for field in ("affected_pages",):
                          for value in fix.get(field) or []:
                              if is_asset(value):
                                  asset_urls.append(str(value))

                  site_failures = []
                  checks = {
                      "classification": (primary, expected_archetype),
                      "classification_state": (classification.get("state"), "classified"),
                      "evidence_sufficiency": (classification.get("evidence_sufficiency"), "sufficient"),
                      "scanner_version": (scan.get("scanner_version") or scan.get("version"), expected["scanner"]),
                      "scanner_build_revision": (scan.get("scanner_build_revision"), expected["scanner_build"]),
                      "scan_fingerprint": (scan.get("beta_revision_fingerprint"), expected["fingerprint"]),
                      "classifier_version": (classifier, expected["classifier"]),
                      "review_version": (review.get("review_version") or review.get("ai_review_version"), expected["review"]),
                      "calibration_version": (review.get("review_evidence_calibration_version"), expected["calibration"]),
                      "review_fingerprint": (review.get("beta_revision_fingerprint"), expected["fingerprint"]),
                      "scan_status": (review.get("scan_status"), "complete"),
                      "score_is_provisional": (review.get("score_is_provisional"), False),
                      "release_gate_eligible": (review.get("release_gate_eligible"), True),
                  }
                  for label, (actual, wanted) in checks.items():
                      if actual != wanted:
                          site_failures.append(f"{label}: expected {wanted!r}, got {actual!r}")
                  if not (1 <= pages_crawled <= 150):
                      site_failures.append(f"pages_crawled: expected 1..150, got {pages_crawled}")
                  if scan.get("deno_fallback_used") is True or review.get("python_review_fallback_used") is True:
                      site_failures.append("fallback flag was true")
                  if asset_urls:
                      site_failures.append(f"asset URLs appeared in FixItems: {asset_urls[:10]}")

                  elapsed = round(time.time() - started, 1)
                  summary = {
                      "name": name,
                      "url": url,
                      "expected_archetype": expected_archetype,
                      "actual_archetype": primary,
                      "classification_state": classification.get("state"),
                      "evidence_sufficiency": classification.get("evidence_sufficiency"),
                      "pages_found": scan.get("pages_found"),
                      "pages_crawled": pages_crawled,
                      "scan_status": review.get("scan_status"),
                      "score_is_provisional": review.get("score_is_provisional"),
                      "release_gate_eligible": review.get("release_gate_eligible"),
                      "fix_count": len(fixes),
                      "asset_url_count": len(asset_urls),
                      "classifier_version": classifier,
                      "fingerprint": review.get("beta_revision_fingerprint"),
                      "elapsed_seconds": elapsed,
                      "pass": not site_failures,
                      "failures": site_failures,
                      "winning_reason": classification.get("winning_reason"),
                      "structural_signals": classification.get("structural_signals"),
                  }
                  summaries.append(summary)
                  raw_records.append({"name": name, "url": url, "scan": scan, "review": review})
                  if site_failures:
                      failures.extend(f"{name}: {failure}" for failure in site_failures)
                      print(f"{name}: FAIL — {'; '.join(site_failures)}", flush=True)
                  else:
                      print(f"{name}: PASS — {primary}, {pages_crawled} pages, {len(fixes)} fixes", flush=True)
              except Exception as exc:
                  elapsed = round(time.time() - started, 1)
                  message = str(exc)
                  failures.append(f"{name}: {message}")
                  summaries.append({
                      "name": name,
                      "url": url,
                      "expected_archetype": expected_archetype,
                      "pass": False,
                      "elapsed_seconds": elapsed,
                      "failures": [message],
                  })
                  print(f"{name}: ERROR — {message}", flush=True)

          Path("focused-acceptance-summary.json").write_text(json.dumps({
              "release": expected,
              "health": health,
              "sites": summaries,
              "passed": sum(1 for item in summaries if item.get("pass")),
              "total": len(sites),
              "failures": failures,
          }, indent=2, sort_keys=True), encoding="utf-8")
          with gzip.open("focused-acceptance-raw.json.gz", "wt", encoding="utf-8") as handle:
              json.dump(raw_records, handle, separators=(",", ":"))

          lines = [
              "# Classifier v6 focused production acceptance",
              "",
              f"Passed: {sum(1 for item in summaries if item.get('pass'))}/{len(sites)}",
              "",
              "| Site | Expected | Actual | Pages | Status | Gate | Result |",
              "|---|---|---:|---:|---|---|---|",
          ]
          for item in summaries:
              lines.append(
                  f"| {item['name']} | {item['expected_archetype']} | {item.get('actual_archetype', 'error')} | "
                  f"{item.get('pages_crawled', '-')} | {item.get('scan_status', '-')} | "
                  f"{item.get('release_gate_eligible', '-')} | {'PASS' if item.get('pass') else 'FAIL'} |"
              )
          if failures:
              lines.extend(["", "## Failures", ""] + [f"- {failure}" for failure in failures])
          Path("focused-acceptance-report.md").write_text("\n".join(lines) + "\n", encoding="utf-8")

          if failures:
              raise SystemExit(f"Focused acceptance failed with {len(failures)} issue(s).")

      - name: Upload focused acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classifier-v6-focused-production-acceptance
          path: |
            focused-acceptance-summary.json
            focused-acceptance-report.md
            focused-acceptance-raw.json.gz
          if-no-files-found: error
