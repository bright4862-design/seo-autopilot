steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/seo-autopilot/seo-autopilot-4545:$COMMIT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/seo-autopilot/seo-autopilot-4545:$COMMIT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - seo-autopilot-4545
      - --image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/seo-autopilot/seo-autopilot-4545:$COMMIT_SHA
      - --region=europe-west1
      - --platform=managed
      - --memory=1Gi
      - --concurrency=1
      - --min-instances=0
      - --max-instances=20
      - --timeout=300
images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/seo-autopilot/seo-autopilot-4545:$COMMIT_SHA
options:
  logging: CLOUD_LOGGING_ONLY
