name: FixList CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck, contract tests, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend contract tests
        id: frontend-contracts
        shell: bash
        run: |
          set +e
          npm run test:frontend 2>&1 | tee frontend-test-output.log
          status=${PIPESTATUS[0]}
          if ! grep -n -B 25 -A 55 -E '^(not ok|# Subtest:.*not ok)|AssertionError|ERR_ASSERTION|failureType:' frontend-test-output.log > frontend-test-tail.txt; then
            tail -n 240 frontend-test-output.log > frontend-test-tail.txt
          fi
          exit "$status"

      - name: Upload frontend contract diagnostic
        if: failure() && steps.frontend-contracts.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-contract-failure
          path: frontend-test-tail.txt
          if-no-files-found: error
          retention-days: 1

      - name: Build
        run: npm run build

  scanner-regressions:
    name: Scanner regression fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt

      - name: Run root scanner regression tests
        run: pytest tests/

      - name: Run Python scanner-api tests
        working-directory: scanner-api
        run: pytest tests/

      - name: Verify frozen beta revision matches code
        working-directory: scanner-api
        run: python scripts/freeze_beta_revision.py --check

      - name: Build production scanner image
        run: docker build --tag fixlist-scanner:ci .
