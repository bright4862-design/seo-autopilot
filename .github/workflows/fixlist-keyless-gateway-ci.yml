name: FixList Keyless Gateway CI

on:
  pull_request:
    paths:
      - 'dispatch-gateway/**'
      - 'scripts/package_dispatch_gateway.sh'
      - 'scanner-api/requirements.txt'
      - 'scanner-api/app/__init__.py'
      - 'scanner-api/app/authority_seal.py'
      - 'scanner-api/app/repair_coverage.py'
      - 'scanner-api/app/repair_identity.py'
      - 'scanner-api/app/scan_comparison.py'
      - 'scanner-api/app/scan_comparison_integrity.py'
      - 'scanner-api/app/scan_comparison_authority.py'
      - 'base44/functions/startStandardScanJob/cloudTasks.js'
      - 'tests/frontend/dispatchGatewayContract.test.mjs'
      - 'scripts/deploy_dispatch_gateway.sh'
      - 'scripts/verify_gateway_deployment.py'
      - 'scripts/bootstrap-fixlist-dispatch-gateway.sh'
      - 'tests/test_gateway_deployment_verifier.py'
      - '.github/workflows/fixlist-cloud-operator.yml'
      - '.github/workflows/fixlist-keyless-gateway-ci.yml'
  push:
    branches:
      - agent/fixlist-keyless-gateway-main
    paths:
      - 'dispatch-gateway/**'
      - 'scripts/package_dispatch_gateway.sh'
      - 'scanner-api/requirements.txt'
      - 'scanner-api/app/__init__.py'
      - 'scanner-api/app/authority_seal.py'
      - 'scanner-api/app/repair_coverage.py'
      - 'scanner-api/app/repair_identity.py'
      - 'scanner-api/app/scan_comparison.py'
      - 'scanner-api/app/scan_comparison_integrity.py'
      - 'scanner-api/app/scan_comparison_authority.py'
      - 'base44/functions/startStandardScanJob/cloudTasks.js'
      - 'tests/frontend/dispatchGatewayContract.test.mjs'
      - 'scripts/deploy_dispatch_gateway.sh'
      - 'scripts/verify_gateway_deployment.py'
      - 'scripts/bootstrap-fixlist-dispatch-gateway.sh'
      - 'tests/test_gateway_deployment_verifier.py'
      - '.github/workflows/fixlist-cloud-operator.yml'
      - '.github/workflows/fixlist-keyless-gateway-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify immutable source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate shell and Base44 syntax
        run: |
          set -euo pipefail
          bash -n scripts/deploy_dispatch_gateway.sh
          bash -n scripts/package_dispatch_gateway.sh
          bash -n scripts/bootstrap-fixlist-dispatch-gateway.sh
          node --check base44/functions/startStandardScanJob/cloudTasks.js

      - name: Refuse project-wide Run Admin in gateway bootstrap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('scripts/bootstrap-fixlist-dispatch-gateway.sh').read_text(encoding='utf-8')
          project_run_admin_grant = re.search(
              r'gcloud\s+projects\s+add-iam-policy-binding[\s\S]{0,500}?--role(?:=|\s+)["\']?roles/run\.admin',
              source,
          )
          if project_run_admin_grant:
              raise SystemExit('Gateway bootstrap must not grant project-wide roles/run.admin.')
          if 'roles/run.developer' not in source:
              raise SystemExit('Gateway bootstrap must grant service-scoped roles/run.developer after creation.')
          if 'gcloud run services add-iam-policy-binding "$GATEWAY"' not in source:
              raise SystemExit('Gateway bootstrap lost its service-scoped operator binding.')
          if 'bindings.role=roles/run.admin' not in source:
              raise SystemExit('Gateway bootstrap must verify project-wide Run Admin is absent.')
          print('No project-wide Cloud Run Admin grant is present.')
          PY

      - name: Install canonical gateway dependencies
        run: |
          set -euo pipefail
          python -m pip install -r dispatch-gateway/requirements.txt pytest

      - name: Prove the deployment gate rejects a deployment that did not ship
        run: python -m pytest -q tests/test_gateway_deployment_verifier.py

      - name: Run canonical gateway Python tests
        run: python -m pytest -q dispatch-gateway/test_gateway.py

      - name: Run Base44 to gateway contract tests
        run: node --test tests/frontend/dispatchGatewayContract.test.mjs

      - name: Compile canonical gateway source
        run: |
          set -euo pipefail
          python -m py_compile dispatch-gateway/main.py dispatch-gateway/test_gateway.py
          python -m py_compile scripts/verify_gateway_deployment.py

      - name: Build exact packaged gateway container
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/fixlist-gateway-context"
          bash scripts/package_dispatch_gateway.sh "$EXPECTED_SOURCE_SHA" "$context"
          test "$(cat "$context/.fixlist-source-sha")" = "$EXPECTED_SOURCE_SHA"
          docker build -t "fixlist-dispatch-gateway:$EXPECTED_SOURCE_SHA" "$context"

      - name: Exercise real comparison with only packaged gateway dependencies
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python \
            -v "$PWD/dispatch-gateway/test_gateway.py:/app/test_gateway.py:ro" \
            "fixlist-dispatch-gateway:$EXPECTED_SOURCE_SHA" \
            -m unittest -v test_gateway.ComparisonEndpointTests
