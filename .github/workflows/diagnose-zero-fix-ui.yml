name: Diagnose zero-fix UI build sites

on:
  push:
    paths:
      - .github/workflows/diagnose-zero-fix-ui.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Find zero-fix UI copy and score fallbacks
        run: |
          python - <<'PY'
          from pathlib import Path

          needles = [
              "Your scan has recommendations ready",
              "Review the highest-impact items first",
              "Website health",
              "scoreLabel(",
              "getScoreBand(",
              "health_grade",
              "next_best_step",
              "no_high_confidence_findings",
          ]
          output = []
          for path in sorted(Path("src").rglob("*")):
              if path.suffix not in {".js", ".jsx", ".ts", ".tsx"}:
                  continue
              text = path.read_text(encoding="utf-8")
              lines = text.splitlines()
              hits = [i for i, line in enumerate(lines) if any(needle in line for needle in needles)]
              if not hits:
                  continue
              output.append(f"===== {path} =====")
              shown = set()
              for i in hits:
                  start = max(0, i - 5)
                  end = min(len(lines), i + 6)
                  key = (start, end)
                  if key in shown:
                      continue
                  shown.add(key)
                  for n in range(start, end):
                      output.append(f"{n + 1:04d}: {lines[n]}")
                  output.append("")
          Path("diagnostics").mkdir(exist_ok=True)
          Path("diagnostics/ui-zero-fix.txt").write_text("\n".join(output), encoding="utf-8")
          PY
      - name: Commit diagnostics and remove workflow
        run: |
          rm .github/workflows/diagnose-zero-fix-ui.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/ui-zero-fix.txt .github/workflows/diagnose-zero-fix-ui.yml
          git commit -m "Capture zero-fix UI build sites"
          git push origin HEAD:main
