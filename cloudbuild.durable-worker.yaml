# Cloud Build artifact for the PRIVATE durable Standard 150 worker.
# The caller must submit a clean git archive of the exact release commit and
# include .fixlist-source-sha containing that same 40-character SHA.

substitutions:
  _RELEASE_SHA: ""
  _WORKER_SERVICE: ""
  _REGION: ""
  _IMAGE: ""
  _RUNTIME_SA: ""
  _INVOKER_SA: ""
  _BASE44_APP_ID: ""
  _BASE44_API_URL: ""
  _SIGNING_KEY_SECRET: ""
  _SIGNING_KEY_VERSION: ""

steps:
  - id: require-substitutions
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        missing=0
        for pair in \
          "_RELEASE_SHA=${_RELEASE_SHA}" \
          "_WORKER_SERVICE=${_WORKER_SERVICE}" \
          "_REGION=${_REGION}" \
          "_IMAGE=${_IMAGE}" \
          "_RUNTIME_SA=${_RUNTIME_SA}" \
          "_INVOKER_SA=${_INVOKER_SA}" \
          "_BASE44_APP_ID=${_BASE44_APP_ID}" \
          "_BASE44_API_URL=${_BASE44_API_URL}" \
          "_SIGNING_KEY_SECRET=${_SIGNING_KEY_SECRET}" \
          "_SIGNING_KEY_VERSION=${_SIGNING_KEY_VERSION}"; do
          name="${pair%%=*}"; value="${pair#*=}"
          if [ -z "$value" ]; then echo "MISSING required substitution: $name"; missing=1; fi
        done
        if [ "$missing" -ne 0 ]; then
          echo "Refusing to build: supply every deployment parameter explicitly."
          exit 1
        fi
        if ! printf '%s' "${_RELEASE_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
          echo "Invalid _RELEASE_SHA: expected exactly 40 lowercase hexadecimal characters."
          exit 1
        fi
        if ! printf '%s' "${_SIGNING_KEY_VERSION}" | grep -Eq '^[0-9]+$'; then
          echo "Invalid _SIGNING_KEY_VERSION: expected a numeric pinned version."
          exit 1
        fi
        echo "All required substitutions supplied."
        echo "Release identity pinned to ${_RELEASE_SHA}."

  # The GitHub-side operator has already verified HEAD == current origin/main,
  # CONFIRM == SOURCE_SHA, and a clean checkout, then submitted `git archive`
  # output from that exact commit. Verify the archive stamp here and copy only
  # the Dockerfile inputs into an isolated build context. This avoids requiring
  # a GitHub credential inside Cloud Build while preserving exact-source build
  # provenance and rejecting mismatched release labels.
  - id: verify-release-source
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        readonly stamp=/workspace/.fixlist-source-sha
        readonly verified_context=/workspace/.verified-context
        test -f "$stamp" || { echo "Missing exact-source stamp." >&2; exit 1; }
        actual_sha="$(tr -d '[:space:]' < "$stamp")"
        if [ "$actual_sha" != "${_RELEASE_SHA}" ]; then
          echo "Release source mismatch: archive stamp $actual_sha, expected ${_RELEASE_SHA}." >&2
          exit 1
        fi
        for path in Dockerfile scanner-api/requirements.txt scanner-api/app/main.py; do
          test -e "/workspace/$path" || { echo "Missing worker build input: $path" >&2; exit 1; }
        done
        rm -rf "$verified_context"
        mkdir -p "$verified_context/scanner-api"
        cp /workspace/Dockerfile "$verified_context/Dockerfile"
        cp /workspace/scanner-api/requirements.txt "$verified_context/scanner-api/requirements.txt"
        cp -a /workspace/scanner-api/app "$verified_context/scanner-api/app"
        main_sha="$(sha256sum "$verified_context/scanner-api/app/main.py" | cut -d ' ' -f 1)"
        echo "Verified archived worker context for ${_RELEASE_SHA}."
        echo "Verified scanner-api/app/main.py sha256=$main_sha"

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "--tag", "${_IMAGE}:${_RELEASE_SHA}", "/workspace/.verified-context"]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}:${_RELEASE_SHA}"]

  - id: deploy-private-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WORKER_SERVICE}
      - --image=${_IMAGE}:${_RELEASE_SHA}
      - --region=${_REGION}
      - --no-allow-unauthenticated
      - --service-account=${_RUNTIME_SA}
      - --timeout=480
      - --concurrency=1
      - --min-instances=0
      - --max-instances=20
      - --no-traffic
      - --set-env-vars=TASKS_INVOKER_SERVICE_ACCOUNT=${_INVOKER_SA},BASE44_APP_ID=${_BASE44_APP_ID},BASE44_API_URL=${_BASE44_API_URL},GROK_PROXY_ENABLED=false,FIXLIST_WORKER_SOURCE_SHA=${_RELEASE_SHA}
      - --set-secrets=SCAN_EVIDENCE_SIGNING_KEY=${_SIGNING_KEY_SECRET}:${_SIGNING_KEY_VERSION}

images:
  - ${_IMAGE}:${_RELEASE_SHA}

options:
  logging: CLOUD_LOGGING_ONLY
