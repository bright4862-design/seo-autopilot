name: Sync FixList AI to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "hf-space/**"
      - ".github/workflows/sync-fixlist-space.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixlist-hugging-face-sync
  cancel-in-progress: true

env:
  HF_REPO_ID: milo2455555/fixlist-ai

jobs:
  sync-and-verify:
    name: Upload and verify Space revision
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate current Space bundle
        run: |
          set -euo pipefail
          test -f hf-space/Dockerfile
          test -f hf-space/app.py
          test -f hf-space/app_redesign.py
          test -f hf-space/requirements.txt
          grep -Fq 'CMD ["python", "app_redesign.py"]' hf-space/Dockerfile
          grep -Fq 'run_scan_from_ui as run_scan_pipeline_ui' hf-space/app_redesign.py
          grep -Fq 'current_scan = gr.State({})' hf-space/app_redesign.py
          grep -Fq 'interactive=SETTINGS.live_scan_enabled' hf-space/app_redesign.py
          grep -Fq 'api_name="run_scan"' hf-space/app_redesign.py
          grep -Fq 'Debug JSON' hf-space/app_redesign.py
          grep -Fq 'Ready for a new scan' hf-space/app_redesign.py
          if grep -Fq 'gr.State(DEMO_SCAN)' hf-space/app_redesign.py; then
            echo "::error title=Demo state detected::The deployed redesign must start with an empty scan state."
            exit 1
          fi

      - name: Confirm HF_TOKEN secret exists
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error title=Missing HF_TOKEN::Add a GitHub Actions secret named HF_TOKEN with write access to milo2455555/fixlist-ai."
            exit 1
          fi
          echo "HF_TOKEN is configured (${#HF_TOKEN} characters)."

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade "huggingface_hub>=0.30"

      - name: Verify Hugging Face identity and Space access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python <<'PY'
          import os
          from huggingface_hub import HfApi

          repo_id = os.environ["HF_REPO_ID"]
          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)

          identity = api.whoami(token=token)
          info = api.space_info(repo_id=repo_id, token=token)

          print(f"Authenticated Hugging Face account: {identity.get('name', 'unknown')}")
          print(f"Accessible Space: {repo_id}")
          print(f"Current Space main SHA: {info.sha}")
          PY

      - name: Upload redesigned Space root
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > hf-space/GITHUB_DEPLOYMENT_SHA

          python <<'PY'
          import os
          from huggingface_hub import HfApi

          repo_id = os.environ["HF_REPO_ID"]
          token = os.environ["HF_TOKEN"]
          github_sha = os.environ["GITHUB_SHA"]
          api = HfApi(token=token)

          commit = api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="hf-space",
              revision="main",
              delete_patterns="*",
              commit_message=f"Sync FixList AI from GitHub {github_sha}",
              token=token,
          )

          print(f"Uploaded Hugging Face commit: {commit.oid}")
          print(f"Hub commit URL: {commit.commit_url}")
          with open("/tmp/hf_uploaded_commit", "w", encoding="utf-8") as handle:
              handle.write(commit.oid)
          PY

      - name: Verify exact uploaded files and branch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python <<'PY'
          import os
          import time
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download

          repo_id = os.environ["HF_REPO_ID"]
          token = os.environ["HF_TOKEN"]
          github_sha = os.environ["GITHUB_SHA"]
          uploaded_commit = Path("/tmp/hf_uploaded_commit").read_text(encoding="utf-8").strip()
          api = HfApi(token=token)

          required_files = {
              "Dockerfile",
              "app.py",
              "app_redesign.py",
              "requirements.txt",
              "GITHUB_DEPLOYMENT_SHA",
          }
          remote_files = set(
              api.list_repo_files(
                  repo_id=repo_id,
                  repo_type="space",
                  revision=uploaded_commit,
                  token=token,
              )
          )
          missing = required_files - remote_files
          if missing:
              raise RuntimeError(f"Uploaded Space commit is missing files: {sorted(missing)}")

          downloaded = {}
          for filename in ("Dockerfile", "app_redesign.py", "GITHUB_DEPLOYMENT_SHA"):
              path = hf_hub_download(
                  repo_id=repo_id,
                  repo_type="space",
                  revision=uploaded_commit,
                  filename=filename,
                  token=token,
                  force_download=True,
              )
              downloaded[filename] = Path(path).read_text(encoding="utf-8")

          redesigned_app = downloaded["app_redesign.py"]
          checks = {
              "Docker launches app_redesign.py": 'CMD ["python", "app_redesign.py"]' in downloaded["Dockerfile"],
              "Remote UI calls scanner pipeline": "run_scan_from_ui as run_scan_pipeline_ui" in redesigned_app,
              "Remote UI starts without demo data": "current_scan = gr.State({})" in redesigned_app and "gr.State(DEMO_SCAN)" not in redesigned_app,
              "Remote scan button follows live configuration": "interactive=SETTINGS.live_scan_enabled" in redesigned_app,
              "Remote run_scan API is registered": 'api_name="run_scan"' in redesigned_app,
              "Remote debug evidence panel exists": "Debug JSON" in redesigned_app,
              "Remote manifest matches GitHub": downloaded["GITHUB_DEPLOYMENT_SHA"].strip() == github_sha,
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise RuntimeError("Remote file verification failed: " + "; ".join(failed))

          branch_sha = None
          for _ in range(12):
              branch_sha = api.space_info(repo_id=repo_id, token=token).sha
              if branch_sha == uploaded_commit:
                  break
              time.sleep(5)
          if branch_sha != uploaded_commit:
              raise RuntimeError(
                  f"Space main did not advance to uploaded commit. Expected {uploaded_commit}, got {branch_sha}."
              )

          print(f"GitHub source SHA: {github_sha}")
          print(f"Verified Hugging Face main SHA: {branch_sha}")
          for name in checks:
              print(f"VERIFIED: {name}")
          PY