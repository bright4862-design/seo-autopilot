name: FixList CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Lint, typecheck, contract tests, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply guarded product patch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-release-authority-classifier-v5'
        run: python .github/scripts/apply_release_classifier_patch.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend contract tests
        run: npm run test:frontend

      - name: Build
        run: npm run build

  scanner-regressions:
    name: Scanner regression fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply guarded product patch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-release-authority-classifier-v5'
        run: python .github/scripts/apply_release_classifier_patch.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt

      - name: Run root scanner regression tests
        run: pytest tests/

      - name: Run Python scanner-api tests
        working-directory: scanner-api
        run: pytest tests/

      - name: Verify frozen beta revision matches code
        working-directory: scanner-api
        run: python scripts/freeze_beta_revision.py --check

  publish-tested-patch:
    name: Publish tested product patch
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-release-authority-classifier-v5'
    needs: [build, scanner-regressions]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply patch to branch tree
        run: python .github/scripts/apply_release_classifier_patch.py

      - name: Remove patch harness and restore standard CI
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm .github/scripts/apply_release_classifier_patch.py
          rm .github/scripts/patch_payload_*.txt

      - name: Commit tested product changes
        run: |
          git config user.name "seo-pilot-ci"
          git config user.email "seo-pilot-ci@users.noreply.github.com"
          git add -A
          git commit -m "Prioritize business-relevant FixList evidence"
          git push origin HEAD:${{ github.head_ref }}
