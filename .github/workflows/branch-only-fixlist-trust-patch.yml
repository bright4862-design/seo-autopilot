name: Branch-only FixList trust patch

on:
  push:
    branches:
      - agent/repair-priority-integration-current-main
    paths:
      - .github/workflows/branch-only-fixlist-trust-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-priority-integration-current-main
          fetch-depth: 0

      - name: Apply exact presentation-only substitutions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/FixList.jsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'import RepairSectionList from "@/components/fixlist/RepairSectionList";\n',
                  'import RepairSectionList from "@/components/fixlist/RepairSectionList";\nimport ExplicitPassedChecks from "@/components/fixlist/ExplicitPassedChecks";\n',
              ),
              (
                  '// Checks the scanner actually runs; a check "passes" when no finding in the\n// scanned sample carries its category. Copy is deliberately sample-scoped —\n// the contract forbids claiming the whole site is perfect.\nconst PASSED_CHECK_DEFINITIONS = [\n  { categories: ["404_error", "broken_page"], label: "No broken pages found in the pages we checked" },\n  { categories: ["meta_title"], label: "Search titles look good on the pages we checked" },\n  { categories: ["meta_description"], label: "Search descriptions look good on the pages we checked" },\n  { categories: ["canonical"], label: "Canonical settings look right on the pages we checked" },\n  { categories: ["image_alt_text", "alt_text"], label: "Images have text descriptions on the pages we checked" },\n  { categories: ["schema"], label: "No missing trust signals on the pages we checked" },\n  { categories: ["duplicate_content"], label: "No duplicate search text found in the pages we checked" },\n  { categories: ["internal_link"], label: "No internal link problems found in the pages we checked" },\n  { categories: ["indexability"], label: "Google can index the pages we checked" },\n];\n\n',
                  '',
              ),
              (
                  '  const passedChecks = hasUsefulScan && !scoreUnavailable ? buildPassedChecks(recommendations) : [];\n',
                  '',
              ),
              (
                  '              {passedChecks.length > 0 ? ` · ${passedChecks.length} checks passed` : ""}\n',
                  '',
              ),
              (
                  '            {passedChecks.length > 0 ? <PassedChecks checks={passedChecks} /> : null}\n',
                  '            <ExplicitPassedChecks scan={scanRecord} />\n',
              ),
              (
                  'function PassedChecks({ checks }) {\n  const [open, setOpen] = useState(false);\n  return (\n    <>\n      <SectionEyebrow label="Already good" />\n      <button\n        type="button"\n        onClick={() => setOpen((value) => !value)}\n        className="py-3.5 text-[13.5px] text-ink-muted transition-colors hover:text-ink focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink"\n      >\n        {checks.length} checks passed — {open ? "hide them" : "show them"}\n      </button>\n      {open ? (\n        <div>\n          {checks.map((check) => (\n            <div key={check} className="flex gap-3.5 py-2.5 text-[14px] text-ink-muted">\n              <span className="mt-px text-[13px] text-good">✓</span>\n              {check}\n            </div>\n          ))}\n        </div>\n      ) : null}\n    </>\n  );\n}\n\n',
                  '',
              ),
              (
                  'function buildPassedChecks(recommendations) {\n  const present = new Set(recommendations.map((item) => String(item.category || "").toLowerCase()));\n  return PASSED_CHECK_DEFINITIONS\n    .filter((check) => check.categories.every((category) => !present.has(category)))\n    .map((check) => check.label);\n}\n\n',
                  '',
              ),
          ]

          for old, new in replacements:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'Expected one exact match, got {text.count(old)} for: {old[:80]!r}')
                  text = text.replace(old, new, 1)
              elif new and new in text:
                  pass
              elif not new:
                  # Deletion is already complete only when its distinctive opening no longer exists.
                  continue
              else:
                  raise SystemExit(f'Neither old nor new text found for: {old[:80]!r}')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- src/pages/FixList.jsx

      - name: Commit exact page patch
        shell: bash
        run: |
          if git diff --quiet -- src/pages/FixList.jsx; then
            echo "No page change required."
            exit 0
          fi
          git config user.name "FixList integration bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/FixList.jsx
          git commit -m "Use explicit evidence for passed checks"
          git push origin HEAD:agent/repair-priority-integration-current-main
