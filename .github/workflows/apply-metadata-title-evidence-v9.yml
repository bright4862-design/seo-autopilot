name: Validate metadata and title evidence v9

on:
  push:
    branches:
      - agent/metadata-title-evidence-v9
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/metadata-title-evidence-v9
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt

      - name: Apply v9 contract alignment
        run: python .github/scripts/fix_v9_contracts.py

      - name: Run focused metadata and title regressions
        working-directory: scanner-api
        run: pytest tests/test_metadata_title_evidence_v9.py -q

      - name: Run complete scanner API suite
        id: scanner_suite
        continue-on-error: true
        working-directory: scanner-api
        run: pytest tests/ -q --tb=short 2>&1 | tee /tmp/scanner-tests.log

      - name: Run frontend contracts
        id: frontend_contracts
        continue-on-error: true
        run: npm run test:frontend 2>&1 | tee /tmp/frontend-contracts.log

      - name: Verify candidate release fingerprint
        id: fingerprint
        continue-on-error: true
        working-directory: scanner-api
        run: python scripts/freeze_beta_revision.py --check 2>&1 | tee /tmp/fingerprint.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-title-v9-diagnostics-${{ github.run_id }}
          path: |
            /tmp/scanner-tests.log
            /tmp/frontend-contracts.log
            /tmp/fingerprint.log
          retention-days: 7

      - name: Fail when a validation gate failed
        if: steps.scanner_suite.outcome == 'failure' || steps.frontend_contracts.outcome == 'failure' || steps.fingerprint.outcome == 'failure'
        run: exit 1

      - name: Commit direct contract changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/fix_v9_contracts.py
          git add \
            src/lib/scanRunModel.js \
            tests/frontend/releaseAuthorityGate.test.mjs \
            tests/frontend/scanRunPersistence.test.mjs \
            scanner-api/tests/test_observability.py \
            scanner-api/app/review.py \
            .github/scripts/fix_v9_contracts.py
          git diff --cached --stat
          git commit -m "Align v9 release contracts"
          git push origin HEAD:agent/metadata-title-evidence-v9
