name: FixList Cloud Readonly Diagnostic
# diagnostic refresh: 2026-08-17T19:43Z

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fixlist-cloud-readonly-diagnostic.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: seo-autopilot-501517
  GCP_REGION: europe-west1
  GCP_WIF_PROVIDER: projects/919035207432/locations/global/workloadIdentityPools/github/providers/github-actions
  GCP_OPERATOR_SERVICE_ACCOUNT: fixlist-github-operator@seo-autopilot-501517.iam.gserviceaccount.com
  GCP_ADMISSION_OPERATOR_SERVICE_ACCOUNT: fixlist-admission-operator@seo-autopilot-501517.iam.gserviceaccount.com
  ADMISSION_OPERATOR_SIGNING_SECRET: fixlist-admission-operator-signing-key
  WORKER: fixlist-standard150-worker
  GATEWAY: fixlist-dispatch-gateway
  QUEUE: fixlist-standard150
  RELEASE_OPERATOR_SA: fixlist-release-operator@seo-autopilot-501517.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate keylessly to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_OPERATOR_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Read-only release diagnostic
        shell: bash
        run: |
          set +e
          echo '=== AUTH ==='
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          echo
          echo '=== RELEASE OPERATOR SERVICE ACCOUNT ==='
          gcloud iam service-accounts describe "$RELEASE_OPERATOR_SA" --project="$GCP_PROJECT" --format='yaml(email,disabled,uniqueId)'
          echo "release_operator_describe_exit=$?"
          echo
          echo '=== WORKER ==='
          gcloud run services describe "$WORKER" --project="$GCP_PROJECT" --region="$GCP_REGION" --format='yaml(metadata.name,status.url,status.latestReadyRevisionName,status.latestCreatedRevisionName,status.traffic,spec.template.spec.serviceAccountName,spec.template.spec.timeoutSeconds)'
          echo "worker_describe_exit=$?"
          echo
          echo '=== GATEWAY ==='
          gcloud run services describe "$GATEWAY" --project="$GCP_PROJECT" --region="$GCP_REGION" --format='yaml(metadata.name,status.url,status.latestReadyRevisionName,status.latestCreatedRevisionName,status.traffic,spec.template.spec.serviceAccountName)'
          echo "gateway_describe_exit=$?"
          echo
          echo '=== QUEUE ==='
          gcloud tasks queues describe "$QUEUE" --project="$GCP_PROJECT" --location="$GCP_REGION" --format='yaml(name,state,rateLimits,retryConfig)'
          echo "queue_describe_exit=$?"
          echo
          echo '=== RECENT STANDARD150 TASKS ==='
          gcloud tasks list --queue="$QUEUE" --project="$GCP_PROJECT" --location="$GCP_REGION" --limit=20 --format='table(name.basename(),scheduleTime,dispatchCount,responseCount,lastAttempt.responseStatus.code)'
          echo "tasks_list_exit=$?"
          echo
          echo '=== AGENT ENGINE INVENTORY ==='
          gcloud ai reasoning-engines list --project="$GCP_PROJECT" --region="$GCP_REGION" --format='table(name.basename(),displayName,createTime)' 2>&1
          echo "agent_inventory_exit=$?"

  admission-identity:
    name: Verify admission identity and metadata-only secret access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Authenticate isolated admission operator
        id: admission-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_ADMISSION_OPERATOR_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false

      - name: Resolve enabled signing-secret version without payload access
        shell: bash
        env:
          FIXLIST_ADMISSION_ACCESS_TOKEN: ${{ steps.admission-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/resolve_admission_operator_signing_version.py \
            "$GCP_PROJECT" "$ADMISSION_OPERATOR_SIGNING_SECRET")"
          [[ "$version" =~ ^[0-9]+$ ]]
          printf 'ADMISSION_IDENTITY_METADATA_PROBE=passed\n'
          printf 'ADMISSION_OPERATOR_SIGNING_VERSION=%s\n' "$version"
