name: Inspect Hartzler live canonical

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'agent/hartzler-live-canonical-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live page with scanner user agent
        shell: bash
        run: |
          set -euo pipefail
          : > hartzler-live-canonical.txt
          for requested in \
            'https://hartzlerdairy.com/chocolate-milk' \
            'https://hartzlerdairy.com/chocolate-milk/' \
            'https://www.hartzlerdairy.com/chocolate-milk' \
            'https://www.hartzlerdairy.com/chocolate-milk/'
          do
            body=$(mktemp)
            headers=$(mktemp)
            meta=$(curl -sS -L --max-redirs 10 \
              -A 'FixListPythonScanner' \
              -D "$headers" \
              -o "$body" \
              -w 'status=%{http_code}\nfinal_url=%{url_effective}\ncontent_type=%{content_type}\nredirects=%{num_redirects}\n' \
              "$requested")
            {
              echo '=== REQUEST ==='
              echo "requested_url=$requested"
              printf '%s' "$meta"
              echo
              echo '--- RESPONSE CHAIN ---'
              grep -E '^(HTTP/|[Ll]ocation:)' "$headers" || true
              echo '--- RAW CANONICAL TAGS ---'
              python3 - "$body" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          full = re.findall(r'<link\b[^>]*\brel\s*=\s*(?:["\'])?canonical(?:["\'])?[^>]*>', text, flags=re.I)
          if not full:
              print('NONE')
          for tag in full:
              print(tag)
              href = re.search(r'\bhref\s*=\s*(["\'])(.*?)\1|\bhref\s*=\s*([^\s>]+)', tag, flags=re.I|re.S)
              if href:
                  print('raw_href=' + (href.group(2) if href.group(1) else href.group(3)))
          PY
              echo
            } >> hartzler-live-canonical.txt
            rm -f "$body" "$headers"
          done
          cat hartzler-live-canonical.txt

      - name: Upload exact live evidence
        uses: actions/upload-artifact@v4
        with:
          name: hartzler-live-canonical-evidence
          path: hartzler-live-canonical.txt
          if-no-files-found: error
