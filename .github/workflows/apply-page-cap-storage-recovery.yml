          new_save = '''function saveScanForDashboard(scanRecord, scanId) {
  const normalizedRecord = slimScanRecord(normalizeScanRecordForStorage({ ...scanRecord, id: scanId || scanRecord?.id, local_cache_complete: true }));
  const stableScanId = normalizedRecord.scan_id || normalizedRecord.scan_run_id || normalizedRecord.id;
  const historyEntry = buildScanHistoryEntry(normalizedRecord);

  const writeRecord = (record) => {
    const serialized = JSON.stringify(record);
    if (stableScanId) window.localStorage.setItem(`${SCAN_RECORD_PREFIX}${stableScanId}`, serialized);
    window.localStorage.setItem(DASHBOARD_LAST_SCAN_KEY, JSON.stringify(historyEntry));
    const existingRaw = window.localStorage.getItem(DASHBOARD_HISTORY_KEY);
    const existing = existingRaw ? JSON.parse(existingRaw) : [];
    const history = Array.isArray(existing) ? existing.map(buildScanHistoryEntry) : [];
    const nextHistory = [historyEntry, ...history.filter((item) => (item?.scan_id || item?.scan_run_id || item?.id) !== stableScanId)].slice(0, 20);
    window.localStorage.setItem(DASHBOARD_HISTORY_KEY, JSON.stringify(nextHistory));
    window.localStorage.removeItem(LEGACY_LAST_SCAN_KEY);
    window.localStorage.removeItem(LEGACY_HISTORY_KEY);
    window.localStorage.removeItem(ACTIVE_SCAN_URL_KEY);
    window.localStorage.removeItem(ACTIVE_SCAN_STARTED_AT_KEY);
    window.dispatchEvent(new Event("seo-autopilot-scan-saved"));
  };

  try {
    writeRecord(normalizedRecord);
    return true;
  } catch (storageError) {
    console.warn("Browser scan cache was full; pruning old scan records.", storageError);
    pruneScanCache(stableScanId);
    try {
      writeRecord(normalizedRecord);
      return true;
    } catch (retryError) {
      console.warn("Full browser scan cache is unavailable; durable scan history remains authoritative.", retryError);
      try {
        writeRecord(buildEmergencyBrowserRecord(normalizedRecord));
      } catch (summaryError) {
        console.warn("Could not write even the emergency scan summary.", summaryError);
      }
      return false;
    }
  }
}

function buildScanHistoryEntry(record = {}) {
  const stableScanId = record.scan_id || record.scan_run_id || record.id || "";
  return {
    id: stableScanId,
    scan_id: stableScanId,
    scan_run_id: record.scan_run_id || stableScanId,
    storage_key: stableScanId ? `${SCAN_RECORD_PREFIX}${stableScanId}` : "",
    created_at: record.created_at || "",
    website_url: record.website_url || "",
    business_name: record.business_name || "",
    scan_mode: record.scan_mode || "",
    health_score: Number(record.health_score || record.seo_score || 0),
    health_grade: record.health_grade || "",
    pages_crawled: Number(record.pages_crawled || 0),
    pages_found: Number(record.pages_found || 0),
    scan_status: record.scan_status || "",
    release_gate_eligible: record.release_gate_eligible === true,
  };
}

function buildEmergencyBrowserRecord(record = {}) {
  return {
    ...buildScanHistoryEntry(record),
    local_cache_complete: false,
    customer_summary: clampText(record.customer_summary || record.simple_summary || "", 800),
    next_best_step: clampText(record.next_best_step || "", 300),
    scanner_version: record.scanner_version || "",
    scanner_build_revision: record.scanner_build_revision || "",
    advanced_scan_backend: record.advanced_scan_backend || "",
    deno_fallback_used: Boolean(record.deno_fallback_used),
    review_version: record.review_version || "",
    review_evidence_calibration_version: record.review_evidence_calibration_version || "",
    ai_review_backend: record.ai_review_backend || "",
    python_review_fallback_used: Boolean(record.python_review_fallback_used),
    recommendations: getRecommendations(record).slice(0, 12).map(slimFix),
    pages: getPages(record).slice(0, 12).map(slimPage),
  };
}

function pruneScanCache(keepScanId = "") {
  if (typeof window === "undefined") return;
  const keepKey = keepScanId ? `${SCAN_RECORD_PREFIX}${keepScanId}` : "";
  for (let index = window.localStorage.length - 1; index >= 0; index -= 1) {
    const key = window.localStorage.key(index) || "";
    if (key.startsWith(SCAN_RECORD_PREFIX) && key !== keepKey) window.localStorage.removeItem(key);
  }
  [DASHBOARD_LAST_SCAN_KEY, DASHBOARD_HISTORY_KEY, LEGACY_LAST_SCAN_KEY, LEGACY_HISTORY_KEY, SCAN_DEBUG_KEY].forEach((key) => window.localStorage.removeItem(key));
}'''
