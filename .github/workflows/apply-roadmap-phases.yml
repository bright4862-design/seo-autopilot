name: Apply roadmap phases 1-4 patch

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/apply-roadmap-phases-1-4

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/apply-roadmap-phases-1-4
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Reconstruct and apply cumulative patch series
        shell: bash
        run: |
          set +e
          : > /tmp/patch-diagnostic.log
          for part in .github/patches/roadmap-phases-1-4.part*.b64; do
            echo "$(basename "$part") bytes=$(wc -c < "$part") sha256=$(sha256sum "$part" | cut -d' ' -f1)" | tee -a /tmp/patch-diagnostic.log
          done
          cat .github/patches/roadmap-phases-1-4.part*.b64 > /tmp/roadmap-phases-1-4.b64
          archive_bytes=$(wc -c < /tmp/roadmap-phases-1-4.b64)
          archive_sha=$(sha256sum /tmp/roadmap-phases-1-4.b64 | cut -d' ' -f1)
          echo "archive_bytes=$archive_bytes" | tee -a /tmp/patch-diagnostic.log
          echo "archive_sha256=$archive_sha" | tee -a /tmp/patch-diagnostic.log
          if [ "$archive_bytes" != '38028' ] || [ "$archive_sha" != '2734e6ae95a53cf98bcd2ce5f276379cc44786f0239cdc1fcc0ba1f055f3dd32' ]; then
            echo 'Staged archive checksum mismatch' | tee -a /tmp/patch-diagnostic.log
            exit 1
          fi
          base64 --decode /tmp/roadmap-phases-1-4.b64 | gzip --decompress > /tmp/roadmap-phases-1-4.patch 2>/tmp/reconstruct-error.log
          reconstruct_status=$?
          if [ "$reconstruct_status" -ne 0 ]; then
            echo "Patch reconstruction failed with status $reconstruct_status" | tee -a /tmp/patch-diagnostic.log
            cat /tmp/reconstruct-error.log | tee -a /tmp/patch-diagnostic.log
            exit "$reconstruct_status"
          fi
          patch_bytes=$(wc -c < /tmp/roadmap-phases-1-4.patch)
          patch_sha=$(sha256sum /tmp/roadmap-phases-1-4.patch | cut -d' ' -f1)
          echo "patch_bytes=$patch_bytes" | tee -a /tmp/patch-diagnostic.log
          echo "patch_sha256=$patch_sha" | tee -a /tmp/patch-diagnostic.log
          grep '^Subject:' /tmp/roadmap-phases-1-4.patch | tee -a /tmp/patch-diagnostic.log
          if [ "$patch_bytes" != '112208' ] || [ "$patch_sha" != '86d84b79a36ae473998f7da1e992c5242c3ef3a755cc6fc5cc9f7bf1c7ba58dc' ]; then
            echo 'Reconstructed patch checksum mismatch' | tee -a /tmp/patch-diagnostic.log
            exit 1
          fi
          git am --3way /tmp/roadmap-phases-1-4.patch > /tmp/git-am.log 2>&1
          apply_status=$?
          cat /tmp/git-am.log | tee -a /tmp/patch-diagnostic.log
          if [ "$apply_status" -ne 0 ]; then
            git status --short | tee -a /tmp/patch-diagnostic.log
            git diff --name-only --diff-filter=U | tee -a /tmp/patch-diagnostic.log
            exit "$apply_status"
          fi

      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-patch-diagnostic
          path: /tmp/patch-diagnostic.log
          if-no-files-found: warn

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio
          python -m pip install -r scanner-api/requirements.txt

      - name: Run Python quality gates
        run: |
          pytest -q tests/
          PYTHONPATH=scanner-api pytest -q scanner-api/tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend quality gates
        run: |
          npm run lint
          npm run typecheck
          npm run test:frontend
          node tests/frontend/durableScanModel.test.mjs
          node tests/frontend/scanRunPersistence.test.mjs
          npm run build

      - name: Remove temporary patch machinery and push
        run: |
          rm -f .github/patches/roadmap-phases-1-4.part*.b64
          rm -f .github/workflows/apply-roadmap-phases.yml
          git add -A
          git commit -m 'Apply roadmap phases 1-4 patches'
          git push origin HEAD:agent/apply-roadmap-phases-1-4
