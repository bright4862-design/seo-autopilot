name: Apply page cap and storage recovery

on:
  push:
    branches:
      - agent/fix-page-cap-and-browser-storage

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fix-page-cap-and-browser-storage

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply guarded source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def append_once(path, marker, addition):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if marker in text:
                  return
              p.write_text(text.rstrip() + '\n\n' + addition.rstrip() + '\n', encoding='utf-8')

          # Python scanner: a new deploy-identifiable revision and one invariant helper
          # used both after concurrent crawling and immediately before response assembly.
          replace_once('scanner-api/app/scanner.py',
              'VERSION = "python_scanner_v3_bounded_request"\nRENDER_EVIDENCE_VERSION = "render_evidence_v1"',
              'VERSION = "python_scanner_v4_hard_page_cap"\nSCANNER_BUILD_REVISION = "hard_page_cap_storage_recovery_20260714"\nRENDER_EVIDENCE_VERSION = "render_evidence_v1"')
          replace_once('scanner-api/app/scanner.py',
              'SITEMAP_DISCOVERY_LIMIT = 5000\n\nTRUST_PATHS',
              '''SITEMAP_DISCOVERY_LIMIT = 5000


def enforce_page_budget(pages: list[dict] | None, max_pages: int) -> list[dict]:
    """Return a detached page list that can never exceed the selected mode cap."""
    limit = max(0, int(max_pages or 0))
    return list(pages or [])[:limit]


TRUST_PATHS''')
