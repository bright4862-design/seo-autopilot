          test_content = '''import json
from pathlib import Path

from app.finding_consolidation import FINDING_CONSOLIDATION_VERSION
from app.indexability_postprocess import group_indexability_quality_findings
from app.main import health
from app.scanner import create_finding, group_findings


def _finding(rule: str, path: str, title: str = "Issue") -> dict:
    return create_finding(
        rule=rule,
        category="indexability",
        priority="medium",
        title=title,
        page_url=path,
        current_value="evidence",
        explanation="specific evidence",
        recommendation="specific fix",
        difficulty="developer",
    )


def test_sitemap_redirects_consolidate_across_template_families():
    findings = [
        _finding("sitemap_redirect", "/products/chair-old"),
        _finding("sitemap_redirect", "/blog/old-guide"),
        _finding("sitemap_redirect", "/locations/paris-old"),
    ]

    grouped = group_findings(findings)

    assert len(grouped) == 1
    card = grouped[0]
    assert card["rule"] == "sitemap_redirect"
    assert card["title"] == "Replace redirecting URLs in the sitemap"
    assert card["page_scope"] == "cross_family"
    assert card["page_template_family"] == "mixed"
    assert card["family_count"] == 3
    assert card["family_breakdown"] == {
        "guide_article": 1,
        "location_landing": 1,
        "product_page": 1,
    }
    assert card["representative_pages_by_family"]["product_page"] == ["/products/chair-old"]
    assert card["affected_pages"] == [
        "/products/chair-old",
        "/blog/old-guide",
        "/locations/paris-old",
    ]
    assert "final indexable canonical URL" in card["recommendation"]
    assert card["finding_consolidation_version"] == FINDING_CONSOLIDATION_VERSION


def test_different_remediation_rules_never_merge():
    paths = ["/products/chair-old", "/blog/old-guide", "/locations/paris-old"]
    findings = [
        *[_finding("sitemap_redirect", path) for path in paths],
        *[_finding("internal_link_redirect", path) for path in paths],
    ]

    grouped = group_findings(findings)

    assert len(grouped) == 2
    assert {card["rule"] for card in grouped} == {"sitemap_redirect", "internal_link_redirect"}
    assert all(card["page_count"] == 3 for card in grouped)


def test_sitemap_canonicalized_urls_consolidate_across_families():
    findings = [
        _finding("sitemap_canonicalized_url", "/products/chair-old"),
        _finding("sitemap_canonicalized_url", "/blog/old-guide"),
        _finding("sitemap_canonicalized_url", "/locations/paris-old"),
    ]

    grouped = group_indexability_quality_findings(findings)

    assert len(grouped) == 1
    card = grouped[0]
    assert card["title"] == "Replace canonicalized URLs in the sitemap"
    assert card["page_scope"] == "cross_family"
    assert card["family_count"] == 3
    assert "final indexable canonical URL" in card["recommendation"]
    assert card["finding_consolidation_version"] == FINDING_CONSOLIDATION_VERSION


def test_two_urls_do_not_cross_the_grouping_threshold():
    findings = [
        _finding("sitemap_redirect", "/products/chair-old"),
        _finding("sitemap_redirect", "/blog/old-guide"),
    ]

    grouped = group_findings(findings)

    assert len(grouped) == 2
    assert all(card["page_count"] if "page_count" in card else 1 for card in grouped)


def test_future_ikea_control_uses_localized_storefront():
    repo_root = Path(__file__).resolve().parents[2]
    records = [
        json.loads(line)
        for line in (repo_root / "data/beta-acceptance-manifest.jsonl").read_text(encoding="utf-8").splitlines()
        if line.strip()
    ]
    ikea = next(record for record in records if record["site"] == "ikea-fr")

    assert ikea["url"] == "https://www.ikea.com/fr/fr/"
    assert ikea["expected_archetype"] == "ecommerce_specialty_retail"


def test_health_exposes_consolidation_marker():
    assert health()["finding_consolidation_version"] == FINDING_CONSOLIDATION_VERSION
'''
