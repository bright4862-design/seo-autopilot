name: Patch cap coverage archetype
on:
  push:
    branches: [agent/cap-coverage-archetype-reliability]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cap-coverage-archetype-reliability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reliability patch
        run: |
          python - <<'PY'
          from pathlib import Path

          scanner = Path('scanner-api/app/scanner.py')
          text = scanner.read_text()
          old = '        workers = [asyncio.create_task(worker()) for _ in range(max(1, concurrency))]\n        await asyncio.gather(*workers)\n        canonical_target_evidence = await validate_canonical_targets('
          new = '        workers = [asyncio.create_task(worker()) for _ in range(max(1, concurrency))]\n        await asyncio.gather(*workers)\n        # Enforce the selected scan budget again after all concurrent sources finish.\n        # Downstream validation and review must never receive more pages than the mode allows.\n        if len(pages) > max_pages:\n            pages = pages[:max_pages]\n        canonical_target_evidence = await validate_canonical_targets('
          if old not in text:
              raise SystemExit('scanner insertion point not found')
          scanner.write_text(text.replace(old, new, 1))

          review = Path('scanner-api/app/review.py')
          text = review.read_text()
          old = '    scores.sort(key=lambda item: item[1], reverse=True)\n    primary = scores[0][0] if scores and scores[0][1] > 0 else "general"\n'
          new = '''    scores.sort(key=lambda item: item[1], reverse=True)\n    # Require structural evidence before choosing ecommerce. Incidental commerce\n    # words in titles or docs must not override a SaaS or general site's structure.\n    path_text = " ".join(clean_path(page_evidence_url(page)).lower() for page in pages[:220])\n    ecommerce_paths = sum(\n        count_includes(path_text, pattern)\n        for pattern in ("/products/", "/product/", "/collections/", "/collection/", "/cart", "/checkout")\n    )\n    saas_paths = sum(\n        count_includes(path_text, pattern)\n        for pattern in ("/pricing", "/features", "/use-cases", "/solutions", "/login", "/signup", "/docs", "/api")\n    )\n    adjusted_scores = []\n    for key, score in scores:\n        if key == "ecommerce_specialty_retail" and ecommerce_paths < 2:\n            score = min(score, 1.0)\n        if key == "saas_app_membership" and saas_paths >= 2:\n            score += 12\n        adjusted_scores.append((key, score))\n    scores = sorted(adjusted_scores, key=lambda item: item[1], reverse=True)\n    primary = scores[0][0] if scores and scores[0][1] > 0 else "general"\n'''
          if old not in text:
              raise SystemExit('archetype insertion point not found')
          text = text.replace(old, new, 1)

          old = 'def evidence_is_incomplete(site_fingerprint: dict[str, Any]) -> bool:\n    received = int_or_zero(site_fingerprint.get("pages_received"))\n    reported = max(\n        int_or_zero(site_fingerprint.get("pages_crawled")),\n        int_or_zero(site_fingerprint.get("pages_found")),\n    )\n    sampled = int_or_zero(site_fingerprint.get("sampled_pages_sent_to_ai"))\n    return reported > 0 and (received == 0 or sampled == 0)\n'
          new = '''def evidence_is_incomplete(site_fingerprint: dict[str, Any]) -> bool:\n    received = int_or_zero(site_fingerprint.get("pages_received"))\n    crawled = int_or_zero(site_fingerprint.get("pages_crawled"))\n    found = int_or_zero(site_fingerprint.get("pages_found"))\n    reported = max(crawled, found)\n    sampled = int_or_zero(site_fingerprint.get("sampled_pages_sent_to_ai"))\n    if reported > 0 and (received == 0 or sampled == 0):\n        return True\n    # A very small sample of a large discovered site is useful but not complete.\n    if found >= 100 and received < 20 and received / max(found, 1) < 0.10:\n        return True\n    return False\n'''
          if old not in text:
              raise SystemExit('coverage function not found')
          review.write_text(text.replace(old, new, 1))

          tests = Path('scanner-api/tests/test_review_calibration.py')
          t = tests.read_text()
          addition = '''\n\ndef test_severe_undercoverage_is_incomplete_and_score_limited():\n    from app.review import evidence_is_incomplete\n    fingerprint = {\n        "pages_found": 900,\n        "pages_crawled": 7,\n        "pages_received": 7,\n        "sampled_pages_sent_to_ai": 7,\n        "blocked_access_pages": 0,\n        "blocked_or_429_pages": 0,\n    }\n    assert evidence_is_incomplete(fingerprint) is True\n    assert compute_health_score([], fingerprint) == 55\n\n\ndef test_incidental_commerce_keywords_do_not_override_saas_structure():\n    body = {\n        "website_url": "https://signal.example",\n        "pages_found": 706,\n        "pages_crawled": 3,\n        "pages": [\n            {"url": "https://signal.example/pricing", "status_code": 200, "title": "Pricing", "h1": "Pricing", "meta_description": "Plans", "page_template_family": "standard"},\n            {"url": "https://signal.example/features", "status_code": 200, "title": "Features", "h1": "Features", "meta_description": "Product features", "page_template_family": "standard"},\n            {"url": "https://signal.example/docs/api", "status_code": 200, "title": "API docs", "h1": "API", "meta_description": "Developer docs with checkout examples", "page_template_family": "guide_article"},\n        ],\n    }\n    result = run_review(body)\n    assert result["site_fingerprint"]["primary_archetype"] == "saas_app_membership"\n    assert result["site_fingerprint"]["business_model"] == "saas_or_member_app"\n'''
          if 'test_severe_undercoverage_is_incomplete_and_score_limited' not in t:
              tests.write_text(t + addition)
          PY
      - name: Run focused and full tests
        run: |
          python -m py_compile scanner-api/app/scanner.py scanner-api/app/review.py
          pip install -r scanner-api/requirements.txt
          PYTHONPATH=scanner-api pytest -q scanner-api/tests/test_review_calibration.py
          PYTHONPATH=scanner-api pytest -q scanner-api/tests
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/patch-cap-coverage-archetype.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scanner-api/app/scanner.py scanner-api/app/review.py scanner-api/tests/test_review_calibration.py .github/workflows/patch-cap-coverage-archetype.yml
          git commit -m 'Enforce crawl cap and coverage reliability'
          git push origin HEAD:agent/cap-coverage-archetype-reliability