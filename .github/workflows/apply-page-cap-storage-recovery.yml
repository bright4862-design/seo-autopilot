test("normal scans require Python and do not silently save Deno fallback", () => {
  assert.match(scannerForm, /require_python_scanner: true/);
  assert.match(scannerForm, /allow_deno_fallback: false/);
  assert.match(advanced, /did not save a fallback result/);
  assert.match(advanced, /python_scanner_failure_code/);
  assert.match(advanced, /release_gate_eligible: false/);
});

test("page caps are enforced by Base44 and the frontend persistence boundary", () => {
  assert.match(advanced, /const cappedPages = sourcePages\.slice\(0, maxPages\)/);
  assert.match(advanced, /pages_crawled: pagesCrawled/);
  assert.match(scannerForm, /scanData = enforceScanPageCap\(scanData, safeScanBudget\.max_pages\)/);
  assert.match(scannerForm, /Math\.min\(pageLimit, pages\.length \|\| reportedPagesCrawled\)/);
  assert.match(scanModel, /pages_crawled: Math\.min\(modeLimit/);
});

test("durable persistence completes before optional browser caching", () => {
  const durableIndex = scannerForm.indexOf("await completeScanRun(scanRunHandle, durableRecord)");
  const cacheIndex = scannerForm.indexOf("saveScanForDashboard(durableRecord, scanId)");
  assert.ok(durableIndex >= 0 && cacheIndex > durableIndex);
  assert.doesNotMatch(scannerForm, /throw new Error\("The scan finished, but FixList could not save the summary/);
  assert.match(scannerForm, /durable scan history remains authoritative/);
  assert.match(fixList, /getScanRunWithFixList\(requestedScanId\)/);
});

test("browser storage uses one canonical record plus compact indexes", () => {
