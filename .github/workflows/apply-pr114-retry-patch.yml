name: Apply PR114 retry patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .pr114-patch/READY
      - .github/workflows/apply-pr114-retry-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'large-site-durable-worker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: large-site-durable-worker
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .pr114-patch/chunk* | base64 -d > /tmp/pr114.tar.gz
          echo "13f472e4b3b7a6ceb9b57a3c0a04ae67f90187f634cc26201de8bf9f75874d96  /tmp/pr114.tar.gz" | sha256sum -c -
          tar -xzf /tmp/pr114.tar.gz -C .
          python -m py_compile scanner-api/app/main.py scanner-api/app/scan_job.py
          node --check base44/functions/startStandardScanJob/cloudTasks.js
          node --check tests/frontend/durableScanJobDispatch.test.mjs
          node --check tests/frontend/asyncStandardScanJob.test.mjs

      - name: Install frontend dependencies
        run: npm ci

      - name: Run focused frontend contracts
        run: node --test tests/frontend/durableScanJobDispatch.test.mjs tests/frontend/asyncStandardScanJob.test.mjs

      - name: Install scanner dependencies
        run: python -m pip install -r scanner-api/requirements.txt

      - name: Run focused durable-worker contracts
        run: PYTHONPATH=scanner-api pytest -q scanner-api/tests/test_attempt_binding.py scanner-api/tests/test_durable_completion_service.py scanner-api/tests/test_scan_job_worker.py

      - name: Run frontend quality gates
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Run scanner regression gates
        run: |
          PYTHONPATH=scanner-api pytest -q tests/test_advanced_scan_regressions.py
          PYTHONPATH=scanner-api pytest -q scanner-api/tests

      - name: Commit exact retry fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            base44/functions/startStandardScanJob/cloudTasks.js \
            base44/functions/startStandardScanJob/entry.ts \
            base44/functions/durableScanWorkerControl/index.ts \
            base44/functions/persistDurableScanAuthority/index.ts \
            base44/functions/persistDurableScanAuthority/authoritySnapshot.js \
            scanner-api/app/main.py \
            scanner-api/app/scan_job.py \
            scanner-api/tests/test_attempt_binding.py \
            scanner-api/tests/test_durable_completion_service.py \
            tests/frontend/durableScanJobDispatch.test.mjs \
            tests/frontend/asyncStandardScanJob.test.mjs
          git commit -m "fix: bind durable scan retries to attempt count"
          git push origin HEAD:large-site-durable-worker
