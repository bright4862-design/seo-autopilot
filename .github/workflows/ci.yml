name: FixList CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Lint, typecheck, contract tests, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend contract tests
        run: npm run test:frontend

      - name: Build
        run: npm run build

  scanner-regressions:
    name: Scanner regression fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt

      - name: Run root scanner regression tests
        run: pytest tests/

      - name: Run Python scanner-api tests
        working-directory: scanner-api
        run: pytest tests/

      - name: Verify frozen beta revision matches code
        working-directory: scanner-api
        run: python scripts/freeze_beta_revision.py --check

  publish-page-evidence-gate:
    if: github.head_ref == 'agent/page-evidence-gate'
    name: Apply, validate, and publish evidence gate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/page-evidence-gate
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply guarded evidence-gate patch
        run: |
          python -m py_compile scripts/ops/apply_page_evidence_gate.py
          python scripts/ops/apply_page_evidence_gate.py

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt

      - name: Validate frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test:frontend
          npm run build

      - name: Validate scanner and revision
        run: |
          pytest tests/
          cd scanner-api
          pytest tests/
          python scripts/freeze_beta_revision.py --check

      - name: Commit validated product source
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f scripts/ops/apply_page_evidence_gate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Gate findings on usable page evidence"
          git push origin HEAD:agent/page-evidence-gate
