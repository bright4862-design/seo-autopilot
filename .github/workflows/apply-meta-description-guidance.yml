name: Apply meta-description guidance patch

on:
  push:
    branches: [fix/unify-meta-description-guidance]
    paths:
      - scripts/apply_meta_description_guidance_patch.py
      - .github/workflows/apply-meta-description-guidance.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/unify-meta-description-guidance
          fetch-depth: 0

      - name: Apply guarded patch
        run: python scripts/apply_meta_description_guidance_patch.py

      - name: Remove temporary patch machinery
        run: rm scripts/apply_meta_description_guidance_patch.py .github/workflows/apply-meta-description-guidance.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend contract tests
        run: npm run test:frontend

      - name: Build
        run: npm run build

      - name: Commit direct source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/scan/ScanWebsiteForm.jsx src/pages/FixList.jsx src/lib/scanStorageRecovery.js tests/frontend/metaDescriptionGuidance.test.mjs scripts/apply_meta_description_guidance_patch.py .github/workflows/apply-meta-description-guidance.yml
          git commit -m "Unify meta-description guidance and preserve evidence"
          git push origin HEAD:fix/unify-meta-description-guidance
