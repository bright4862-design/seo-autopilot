name: Blocked crawl evidence contract gate

on:
  push:
    branches: [agent/blocked-crawl-evidence-contract]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Apply blocked crawl contract patch
        run: python .github/scripts/apply_blocked_crawl_contract.py

      - name: Install backend dependencies
        run: pip install -r scanner-api/requirements.txt

      - name: Run blocked crawl presentation regressions
        working-directory: scanner-api
        run: pytest tests/test_review_presentation_contract.py -q --tb=short

      - name: Run full backend suite
        working-directory: scanner-api
        run: pytest tests -q

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend contract tests
        run: npm run test:frontend

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Run frontend production build
        run: npm run build

      - name: Commit verified product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scanner-api/app/review.py \
            scanner-api/tests/test_review_presentation_contract.py \
            src/lib/reviewContract.js \
            src/components/scan/ScanWebsiteForm.jsx \
            tests/frontend/review_contract.test.mjs
          git commit -m "Preserve provisional blocked-crawl evidence"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
