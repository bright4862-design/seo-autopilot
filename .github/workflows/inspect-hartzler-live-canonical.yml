name: Apply Hartzler absolute single-label canonical v2

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.ref == 'agent/hartzler-live-canonical-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Confirm exact live Hartzler evidence
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          final_url=$(curl -sS -L --max-redirs 10 \
            -A 'FixListPythonScanner' \
            -o "$body" \
            -w '%{url_effective}' \
            'https://hartzlerdairy.com/chocolate-milk')
          test "$final_url" = 'https://www.hartzlerdairy.com/chocolate-milk/'
          python3 - "$body" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          tags = re.findall(r'<link\b[^>]*\brel\s*=\s*(?:["\'])?canonical(?:["\'])?[^>]*>', text, flags=re.I)
          hrefs = []
          for tag in tags:
              match = re.search(r'\bhref\s*=\s*(["\'])(.*?)\1|\bhref\s*=\s*([^\s>]+)', tag, flags=re.I|re.S)
              if match:
                  hrefs.append(match.group(2) if match.group(1) else match.group(3))
          print({'canonical_tags': tags, 'raw_hrefs': hrefs})
          if hrefs != ['http://chocolate-milk']:
              raise SystemExit(f'unexpected live canonical hrefs: {hrefs!r}')
          PY
          rm -f "$body"

      - name: Apply scoped v2 patch
        run: python .github/scripts/apply_hartzler_absolute_single_label_v2.py

      - name: Install Python dependencies
        run: python -m pip install -r scanner-api/requirements.txt

      - name: Run focused canonical regressions
        env:
          PYTHONPATH: scanner-api
        run: pytest -q scanner-api/tests/test_canonical_origin_alias_equivalence.py

      - name: Run scanner regression suite
        env:
          PYTHONPATH: scanner-api
        run: pytest -q scanner-api/tests

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend contract tests
        run: npm run test:frontend

      - name: Build production frontend
        run: npm run build

      - name: Verify frozen v2 markers
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'canonical_href_resolution_v2_absolute_single_label_same_path' scanner-api/app/extract.py data/beta-crawler-revision.json
          grep -n 'd69d625dbeaee154' data/beta-crawler-revision.json src/lib/scanRunModel.js
          ! grep -R '6fe5526e10adf27d' -n src scanner-api/tests tests data

      - name: Commit direct patch and remove temporary inspection tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/scripts/apply_hartzler_absolute_single_label_v2.py \
            .github/workflows/inspect-hartzler-live-canonical.yml
          git add \
            data/beta-crawler-revision.json \
            docs/releases/hartzler-absolute-single-label-canonical-v2.md \
            scanner-api/app/extract.py \
            scanner-api/tests/test_canonical_origin_alias_equivalence.py \
            scanner-api/tests/test_observability.py \
            src/lib/scanRunModel.js \
            tests/frontend/releaseAuthorityGate.test.mjs \
            tests/frontend/scanRunPersistence.test.mjs
          git status --short
          git commit -m 'Fix Hartzler absolute single-label canonical'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
