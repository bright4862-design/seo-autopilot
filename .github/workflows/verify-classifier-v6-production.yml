name: Verify classifier v6 production

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-cloud-run:
    name: Verify Cloud Run release markers
    runs-on: ubuntu-latest
    steps:
      - name: Fetch production health and revision
        shell: bash
        run: |
          set -euo pipefail
          base="https://seo-autopilot-4545-919035207432.europe-west1.run.app"
          curl --fail --silent --show-error --location \
            --retry 12 --retry-all-errors --retry-delay 10 --max-time 30 \
            "$base/health" | tee health.json
          echo
          curl --fail --silent --show-error --location \
            --retry 12 --retry-all-errors --retry-delay 10 --max-time 30 \
            "$base/revision" | tee revision.json
          echo

      - name: Assert classifier v6 markers
        shell: python
        run: |
          import json
          from pathlib import Path

          health = json.loads(Path("health.json").read_text(encoding="utf-8"))
          revision = json.loads(Path("revision.json").read_text(encoding="utf-8"))
          components = revision.get("component_versions") or {}
          print(json.dumps({"health": health, "revision": revision}, indent=2, sort_keys=True))

          expected_health = {
              "archetype_classifier_version": "archetype_classifier_v6_saas_business_identity",
              "beta_revision_fingerprint": "fa1bfae405d970fa",
              "review_version": "python_review_v2_structural_marketplace",
              "review_evidence_calibration_version": "review_evidence_calibration_v5_utility_redirect",
              "scanner_build_revision": "hard_page_cap_response_v1",
              "version": "python_scanner_v3_bounded_request",
          }
          expected_components = {
              "archetype_classifier_version": "archetype_classifier_v6_saas_business_identity",
              "review_version": "python_review_v2_structural_marketplace",
              "review_evidence_calibration_version": "review_evidence_calibration_v5_utility_redirect",
              "scanner_version": "python_scanner_v3_bounded_request",
              "orphan_asset_evidence_version": "orphan_asset_evidence_v1",
          }

          failures = []
          for key, value in expected_health.items():
              if health.get(key) != value:
                  failures.append(f"health.{key}: expected {value!r}, got {health.get(key)!r}")
          if revision.get("fingerprint") != "fa1bfae405d970fa":
              failures.append(
                  "revision.fingerprint: expected 'fa1bfae405d970fa', "
                  f"got {revision.get('fingerprint')!r}"
              )
          for key, value in expected_components.items():
              if components.get(key) != value:
                  failures.append(
                      f"revision.component_versions.{key}: expected {value!r}, "
                      f"got {components.get(key)!r}"
                  )
          if failures:
              raise SystemExit("Production markers are not ready:\n" + "\n".join(failures))

  verify-base44:
    name: Verify published Base44 bundle markers
    runs-on: ubuntu-latest
    steps:
      - name: Inspect published JavaScript bundle
        shell: python
        run: |
          import re
          import urllib.request
          from urllib.parse import urljoin

          base = "https://rich-rank-pilot-flow.base44.app/"
          headers = {"User-Agent": "Mozilla/5.0 SEO-Pilot-Release-Check/1.0"}

          def fetch(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=45) as response:
                  return response.read().decode("utf-8", errors="replace")

          html = fetch(base + "?release=7451383")
          candidates = []
          for attribute in ("src", "href"):
              candidates.extend(re.findall(rf'{attribute}=["\']([^"\']+\.js(?:\?[^"\']*)?)["\']', html))
          urls = list(dict.fromkeys(urljoin(base, value) for value in candidates))
          print("Published JS assets:")
          for url in urls:
              print(url)

          combined = html
          for url in urls:
              try:
                  combined += "\n" + fetch(url)
              except Exception as exc:
                  print(f"Could not fetch {url}: {exc}")

          required = [
              "archetype_classifier_v6_saas_business_identity",
              "fa1bfae405d970fa",
          ]
          missing = [marker for marker in required if marker not in combined]
          if missing:
              raise SystemExit(
                  "Published Base44 bundle is not on classifier v6; missing: "
                  + ", ".join(missing)
              )
          print("Published Base44 bundle contains classifier v6 and the candidate fingerprint.")
