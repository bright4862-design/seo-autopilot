name: FixList Apply Bay Report Quality Candidate

on:
  push:
    branches:
      - fix/canary-report-quality-20260909

permissions:
  contents: write

jobs:
  apply-exact-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply exact tested candidate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE='3211860dcb7b9a04a1e556d47d14a9a920afad87'
          EXPECTED_PATCH_SHA='00952efba9f048e8c643ec8aab04f5528f4987a1b8405092f2852b47bd38c4d9'
          EXPECTED_TREE='f49bcc800caf34e87a43bb586f7c63d4c400c0c5'
          EXPECTED_FINGERPRINT='ce7d7ecc4f508332'
          BRANCH='fix/canary-report-quality-20260909'
          PATCH_B64='.fixlist-bootstrap/bay-report-quality.patch.gz.b64'
          SELF='.github/workflows/fixlist-apply-bay-report-quality.yml'

          test "$GITHUB_REF_NAME" = "$BRANCH"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          mapfile -t BOOTSTRAP_FILES < <(git diff --name-only "$EXPECTED_BASE"..HEAD)
          test "${#BOOTSTRAP_FILES[@]}" = '2'
          printf '%s\n' "${BOOTSTRAP_FILES[@]}" | grep -Fxq "$PATCH_B64"
          printf '%s\n' "${BOOTSTRAP_FILES[@]}" | grep -Fxq "$SELF"
          test -f "$PATCH_B64"
          test -f "$SELF"

          base64 -d "$PATCH_B64" | gzip -dc > /tmp/bay-report-quality.patch
          echo "$EXPECTED_PATCH_SHA  /tmp/bay-report-quality.patch" | sha256sum -c -
          git apply --check /tmp/bay-report-quality.patch
          git apply /tmp/bay-report-quality.patch

          node -e "const r=require('./data/beta-crawler-revision.json'); if(r.fingerprint !== '$EXPECTED_FINGERPRINT' || r.status !== 'candidate' || r.git_commit !== '' || r.acceptance_report !== '') process.exit(1)"
          node scripts/generate_release_contracts.mjs --check
          git diff --check

          rm -f "$PATCH_B64" "$SELF"
          git add -A
          git diff --cached --check

          git config user.name 'FixList Release Agent'
          git config user.email '300628670+bright4862-design@users.noreply.github.com'
          git commit -m 'Fix Bay report quality regressions'

          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git diff --name-only "$EXPECTED_BASE"..HEAD | wc -l | tr -d ' ')" = '67'
          ! git diff --name-only "$EXPECTED_BASE"..HEAD | grep -q '^\.fixlist-bootstrap/'
          ! git diff --name-only "$EXPECTED_BASE"..HEAD | grep -q '^\.github/workflows/fixlist-apply-bay-report-quality.yml$'

          git push origin HEAD:"refs/heads/$BRANCH"
          echo "BAY_REPORT_QUALITY_CANDIDATE_PUBLISHED=$(git rev-parse HEAD)"
          echo "BAY_REPORT_QUALITY_TREE=$(git rev-parse HEAD^{tree})"
          echo "BAY_REPORT_QUALITY_FINGERPRINT=$EXPECTED_FINGERPRINT"
