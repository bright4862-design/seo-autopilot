name: FixList IAM Bootstrap Agent

# One-purpose bootstrap for Agent Runtime diagnostics.
# This workflow is intentionally hard-coded: it can only grant Logs Viewer to
# the existing keyless GitHub operator and then read the failed Reasoning Engine
# startup logs. It does not accept arbitrary principals, roles, projects, or
# mutation commands.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fixlist-iam-bootstrap.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: fixlist-iam-bootstrap
  cancel-in-progress: false

env:
  GCP_PROJECT: seo-autopilot-501517
  GCP_WIF_PROVIDER: projects/919035207432/locations/global/workloadIdentityPools/github/providers/github-actions
  GCP_OPERATOR_SERVICE_ACCOUNT: fixlist-github-operator@seo-autopilot-501517.iam.gserviceaccount.com
  FAILED_REASONING_ENGINE_ID: '6830333357511933952'

jobs:
  bootstrap-and-diagnose:
    if: github.repository == 'bright4862-design/seo-autopilot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_OPERATOR_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Grant exact Logs Viewer role
        shell: bash
        run: |
          set -euo pipefail
          MEMBER="serviceAccount:${GCP_OPERATOR_SERVICE_ACCOUNT}"
          ROLE='roles/logging.viewer'

          echo "Applying one exact IAM binding:"
          echo "  project=${GCP_PROJECT}"
          echo "  member=${MEMBER}"
          echo "  role=${ROLE}"

          gcloud projects add-iam-policy-binding "$GCP_PROJECT" \
            --member="$MEMBER" \
            --role="$ROLE" \
            --condition=None \
            --quiet

      - name: Verify exact binding
        shell: bash
        run: |
          set -euo pipefail
          MEMBER="serviceAccount:${GCP_OPERATOR_SERVICE_ACCOUNT}"
          ROLE='roles/logging.viewer'
          FOUND="$(gcloud projects get-iam-policy "$GCP_PROJECT" \
            --flatten='bindings[].members' \
            --filter="bindings.role=${ROLE} AND bindings.members=${MEMBER}" \
            --format='value(bindings.role)' | head -n 1)"
          if [[ "$FOUND" != "$ROLE" ]]; then
            echo "Exact Logs Viewer binding was not verified." >&2
            exit 3
          fi
          echo "Verified: ${MEMBER} has ${ROLE}."

      - name: Read failed Agent Runtime startup logs
        shell: bash
        run: |
          set -euo pipefail
          ENGINE_ID="$FAILED_REASONING_ENGINE_ID"
          FILTER="resource.type=\"aiplatform.googleapis.com/ReasoningEngine\" AND resource.labels.reasoning_engine_id=\"${ENGINE_ID}\""

          for attempt in 1 2 3 4 5; do
            if gcloud logging read "$FILTER" \
              --project="$GCP_PROJECT" \
              --freshness=2h \
              --limit=200 \
              --order=asc \
              --format='table(timestamp,severity,logName,textPayload,jsonPayload.message)'; then
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "Logs Viewer grant verified, but log read still failed after retries." >&2
              exit 4
            fi
            sleep 5
          done
