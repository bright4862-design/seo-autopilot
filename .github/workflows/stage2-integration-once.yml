name: Stage 2 Integration One Shot

on:
  push:
    branches:
      - agent/full-blueprint-stage2-coverage-b06-20260919

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-blueprint-stage2-coverage-b06-20260919
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt
      - name: Apply shared-interface patch
        run: python scripts/stage2_integration_patch.py
      - name: Run focused integration regressions
        run: |
          python -m pytest -q \
            scanner-api/tests/test_stage2_run_scan_integration.py \
            scanner-api/tests/test_stage2_shared_probe_orchestration.py \
            scanner-api/tests/test_active_soft404_orchestration.py \
            scanner-api/tests/test_redirect_meaning_stage2.py \
            scanner-api/tests/test_stage2_coverage_integrity.py \
            scanner-api/tests/test_stage2_url_variant_exact_identity.py
      - name: Run root regressions
        run: python -m pytest -q tests/
      - name: Run scanner-api regressions
        working-directory: scanner-api
        run: python -m pytest -q tests/
      - name: Verify syntax and diff
        run: |
          python -m compileall -q scanner-api/app scanner-api/tests/test_stage2_run_scan_integration.py
          git diff --check
      - name: Remove temporary integration machinery
        run: |
          rm scripts/stage2_integration_patch.py
          rm .github/workflows/stage2-integration-once.yml
      - name: Commit verified Stage 2 shared wiring
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner-api/app/scanner.py scanner-api/tests/test_stage2_run_scan_integration.py
          git rm --cached scripts/stage2_integration_patch.py .github/workflows/stage2-integration-once.yml
          git diff --cached --check
          git commit -m "feat(scanner): wire shared Stage 2 probes into run_scan"
          git push origin HEAD:agent/full-blueprint-stage2-coverage-b06-20260919
