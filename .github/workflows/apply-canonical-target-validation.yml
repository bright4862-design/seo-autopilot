name: Apply canonical target validation

on:
  push:
    branches:
      - agent/canonical-target-validation

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/canonical-target-validation
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply product patch
        run: python scripts/apply_canonical_target_validation_patch.py

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scanner-api/requirements.txt

      - name: Run focused canonical and indexability regressions
        working-directory: scanner-api
        run: |
          python -m pytest \
            tests/test_canonical_target_validation.py \
            tests/test_indexability_extraction.py \
            tests/test_robots_policy.py \
            tests/test_sitemap_indexability_conflicts.py

      - name: Run full backend suite
        working-directory: scanner-api
        run: python -m pytest

      - name: Check patch cleanliness
        run: git diff --check

      - name: Commit validated product files
        run: |
          rm -f scripts/apply_canonical_target_validation_patch.py
          rm -f .github/workflows/apply-canonical-target-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner-api/app/scanner.py scanner-api/app/canonical_validation.py scanner-api/tests/test_canonical_target_validation.py
          git add -u scripts/apply_canonical_target_validation_patch.py .github/workflows/apply-canonical-target-validation.yml
          git commit -m "Add canonical target validation"
          git push origin HEAD:agent/canonical-target-validation
