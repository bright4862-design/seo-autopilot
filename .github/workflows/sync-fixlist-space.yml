name: Deploy FixList AI to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "hf-space/**"
      - ".github/workflows/sync-fixlist-space.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixlist-hugging-face-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate redesigned Space bundle
        run: |
          set -euo pipefail
          test -f hf-space/Dockerfile
          test -f hf-space/app.py
          test -f hf-space/app_redesign.py
          test -f hf-space/requirements.txt
          grep -Fq 'CMD ["python", "app_redesign.py"]' hf-space/Dockerfile
          grep -Fq 'SYSTEM STATUS' hf-space/app_redesign.py
          grep -Fq 'Start a new scan' hf-space/app_redesign.py
          grep -Fq 'Run website scan' hf-space/app_redesign.py

      - name: Configure Hugging Face credentials
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          python -m pip install --upgrade "huggingface_hub>=0.30"
          hf auth login --token "$HF_TOKEN" --add-to-git-credential

      - name: Force-publish hf-space as the Space root
        run: |
          set -euo pipefail
          export GIT_LFS_SKIP_SMUDGE=1

          rm -rf /tmp/fixlist-space-publish
          mkdir -p /tmp/fixlist-space-publish
          rsync -a --delete hf-space/ /tmp/fixlist-space-publish/
          cd /tmp/fixlist-space-publish

          printf '%s\n' "${GITHUB_SHA}" > GITHUB_DEPLOYMENT_SHA
          git init
          git checkout -b main
          git config user.name "FixList AI Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Deploy redesigned FixList AI from GitHub ${GITHUB_SHA}"
          git remote add origin https://huggingface.co/spaces/milo2455555/fixlist-ai
          git push --force origin main

      - name: Re-clone and verify the exact remote files
        run: |
          set -euo pipefail
          export GIT_LFS_SKIP_SMUDGE=1

          rm -rf /tmp/fixlist-space-verify
          git clone --depth 1 \
            https://huggingface.co/spaces/milo2455555/fixlist-ai \
            /tmp/fixlist-space-verify
          cd /tmp/fixlist-space-verify

          grep -Fq 'CMD ["python", "app_redesign.py"]' Dockerfile
          grep -Fq 'SYSTEM STATUS' app_redesign.py
          grep -Fq 'Start a new scan' app_redesign.py
          grep -Fq 'Run website scan' app_redesign.py
          test "$(cat GITHUB_DEPLOYMENT_SHA)" = "${GITHUB_SHA}"

          echo "Verified Hugging Face Space commit: $(git rev-parse HEAD)"
          echo "Verified GitHub deployment SHA: $(cat GITHUB_DEPLOYMENT_SHA)"
