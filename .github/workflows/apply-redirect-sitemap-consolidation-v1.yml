## Scope

This candidate consolidates repeated findings across page families only when they share the exact same redirect or sitemap remediation rule.

Included rules:

- `sitemap_redirect`
- `internal_link_redirect`
- `redirect_chain`
- `redirect_destination_failed`
- `redirect_destination_blocked`
- `redirect_destination_noindex`
- `sitemap_indexability_conflict`
- `sitemap_canonicalized_url`

Each consolidated card preserves every affected URL, a count by template family, up to three representative examples per family, the exact rule-specific title, and rule-specific remediation copy. Findings with different rules remain separate.

## Release identity

- Consolidation marker: `finding_consolidation_v1_redirect_sitemap_families`
- Candidate fingerprint: `349d0700e5fae0cd`
- Frozen v8 production fingerprint remains historical evidence: `430813f2b15afa8f`

## Acceptance-control correction

The global IKEA root was an invalid ecommerce control because it routed to the corporate/editorial branch. Future IKEA ecommerce validation uses `https://www.ikea.com/fr/fr/` with expected archetype `ecommerce_specialty_retail`.

## Non-goals

- no classifier-weight changes
- no market-scope confidence change in this milestone; issue #77 tracks that separately
- no scoring-model or threshold changes
- no crawl-cap changes
- no Cloud Run, Base44, or secret configuration changes

## Required gate

The candidate requires focused regressions, the full normal CI suite, deployment under its new fingerprint, and a focused production comparison before it can replace the frozen baseline.
'''
