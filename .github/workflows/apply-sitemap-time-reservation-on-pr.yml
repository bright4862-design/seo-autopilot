name: Apply sitemap time reservation patch

on:
  pull_request:
    branches:
      - agent/evidence-quality-release-gate
    types:
      - opened
      - reopened

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Harden applicator locators
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/apply_sitemap_time_reservation.py")
          text = path.read_text(encoding="utf-8")

          old_assertion = '    assert captured["sitemap_deadline"] < result["crawl_timing"]["crawl_started_at"] or captured["sitemap_deadline"] > 0'
          new_assertion = '    assert captured["sitemap_deadline"] > 0\n    assert result["crawl_timing"]["crawl_started_at"]'
          if text.count(old_assertion) != 1:
              raise SystemExit(f"expected one timing assertion locator, found {text.count(old_assertion)}")
          text = text.replace(old_assertion, new_assertion, 1)

          old_import = "from .review import REVIEW_VERSION, run_review"
          new_import = "from .review import ARCHETYPE_CLASSIFIER_VERSION, REVIEW_VERSION, run_review"
          if text.count(old_import) != 2:
              raise SystemExit(f"expected two main review import locators, found {text.count(old_import)}")
          text = text.replace(old_import, new_import)

          old_beta_import_block = '''    ''' + "'''" + '''    from .robots_policy import ROBOTS_POLICY_VERSION
              from .sampling import SAMPLING_VERSION''' + "'''" + ''',
              ''' + "'''" + '''    from .robots_policy import ROBOTS_POLICY_VERSION
              from .sampling import SAMPLING_VERSION
              from .scan_timing import SITEMAP_TIME_RESERVATION_VERSION''' + "'''" + ''','''
          new_beta_import_block = '''    ''' + "'''" + '''    from .sampling import SAMPLING_VERSION''' + "'''" + ''',
              ''' + "'''" + '''    from .sampling import SAMPLING_VERSION
              from .scan_timing import SITEMAP_TIME_RESERVATION_VERSION''' + "'''" + ''','''
          if text.count(old_beta_import_block) != 1:
              raise SystemExit(f"expected one beta import block, found {text.count(old_beta_import_block)}")
          text = text.replace(old_beta_import_block, new_beta_import_block, 1)

          old_beta_output_block = '''    ''' + "'''" + '''        "sampling_version": SAMPLING_VERSION,
              "render_evidence_version": RENDER_EVIDENCE_VERSION,''' + "'''" + ''',
              ''' + "'''" + '''        "sampling_version": SAMPLING_VERSION,
              "sitemap_time_reservation_version": SITEMAP_TIME_RESERVATION_VERSION,
              "render_evidence_version": RENDER_EVIDENCE_VERSION,''' + "'''" + ''','''
          new_beta_output_block = '''    ''' + "'''" + '''        "sampling_version": SAMPLING_VERSION,
              "render_followup_version": RENDER_FOLLOWUP_VERSION,''' + "'''" + ''',
              ''' + "'''" + '''        "sampling_version": SAMPLING_VERSION,
              "sitemap_time_reservation_version": SITEMAP_TIME_RESERVATION_VERSION,
              "render_followup_version": RENDER_FOLLOWUP_VERSION,''' + "'''" + ''','''
          if text.count(old_beta_output_block) != 1:
              raise SystemExit(f"expected one beta output block, found {text.count(old_beta_output_block)}")
          path.write_text(text.replace(old_beta_output_block, new_beta_output_block, 1), encoding="utf-8")
          PY

      - name: Apply scoped patch
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/apply_sitemap_time_reservation.py 2>&1 | tee sitemap-time-apply-output.txt

      - name: Upload applicator failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-time-apply-output
          path: sitemap-time-apply-output.txt
          if-no-files-found: ignore

      - name: Install Python dependencies
        run: python -m pip install -r scanner-api/requirements.txt

      - name: Test sitemap time reservation
        shell: bash
        env:
          PYTHONPATH: scanner-api
        run: |
          set -o pipefail
          pytest -q scanner-api/tests/test_sitemap_time_reservation.py 2>&1 | tee sitemap-time-test-output.txt

      - name: Upload focused test failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-time-test-output
          path: sitemap-time-test-output.txt
          if-no-files-found: ignore

      - name: Run scanner API regression suite
        shell: bash
        env:
          PYTHONPATH: scanner-api
        run: |
          set -o pipefail
          pytest -q scanner-api/tests 2>&1 | tee scanner-regression-output.txt

      - name: Upload scanner regression failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-regression-output
          path: scanner-regression-output.txt
          if-no-files-found: ignore

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend contract tests
        run: npm run test:frontend

      - name: Build production frontend
        run: npm run build

      - name: Commit direct patch and remove temporary applicators
        shell: bash
        run: |
          set -o pipefail
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -f \
              .github/scripts/apply_sitemap_time_reservation.py \
              .github/workflows/apply-sitemap-time-reservation-on-pr.yml
            git add \
              scanner-api/app/scan_timing.py \
              scanner-api/app/sitemap.py \
              scanner-api/app/scanner.py \
              scanner-api/app/main.py \
              scanner-api/app/beta_revision.py \
              scanner-api/tests/test_sitemap_time_reservation.py \
              scanner-api/tests/test_observability.py \
              base44/entities/ScanRun.jsonc \
              src/lib/scanRunModel.js \
              src/components/scan/ScanWebsiteForm.jsx \
              tests/frontend/sitemapTimingDiagnostics.test.mjs \
              tests/frontend/releaseAuthorityGate.test.mjs \
              tests/frontend/scanRunPersistence.test.mjs \
              data/beta-crawler-revision.json \
              docs/releases/sitemap-time-reservation-v1.md
            git status --short
            git commit -m "Reserve crawl time before sitemap expansion"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          } 2>&1 | tee sitemap-time-commit-output.txt

      - name: Upload commit failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-time-commit-output
          path: sitemap-time-commit-output.txt
          if-no-files-found: ignore
