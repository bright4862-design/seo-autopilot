name: FixList Keyless Gateway CI

on:
  push:
    branches:
      - agent/fixlist-keyless-recovery
    paths:
      - '.github/workflows/fixlist-keyless-gateway-ci.yml'
      - 'ops/fixlist-dispatch-gateway/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gateway dependencies
        working-directory: ops/fixlist-dispatch-gateway
        run: python -m pip install -r requirements.txt

      - name: Run gateway contract tests
        working-directory: ops/fixlist-dispatch-gateway
        run: python -m unittest -v test_gateway.py

      - name: Compile Python source
        working-directory: ops/fixlist-dispatch-gateway
        run: python -m py_compile main.py test_gateway.py

      - name: Build gateway container
        working-directory: ops/fixlist-dispatch-gateway
        run: docker build -t fixlist-dispatch-gateway:recovery .
