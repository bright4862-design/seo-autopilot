name: FixList CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-retry-patch:
    name: Apply and verify attempt-bound retry patch
    if: github.event_name == 'pull_request' && github.head_ref == 'large-site-durable-worker'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: large-site-durable-worker
          fetch-depth: 0

      - name: Reconstruct exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat .pr114-patch/chunk* | base64 -d > /tmp/pr114.tar.gz
          echo "13f472e4b3b7a6ceb9b57a3c0a04ae67f90187f634cc26201de8bf9f75874d96  /tmp/pr114.tar.gz" | sha256sum -c -
          tar -xzf /tmp/pr114.tar.gz -C .

      - name: Detect target changes
        id: detect
        shell: bash
        run: |
          if git diff --quiet -- \
            base44/functions/startStandardScanJob/cloudTasks.js \
            base44/functions/startStandardScanJob/entry.ts \
            base44/functions/durableScanWorkerControl/index.ts \
            base44/functions/persistDurableScanAuthority/index.ts \
            base44/functions/persistDurableScanAuthority/authoritySnapshot.js \
            scanner-api/app/main.py \
            scanner-api/app/scan_job.py \
            scanner-api/tests/test_attempt_binding.py \
            scanner-api/tests/test_durable_completion_service.py \
            tests/frontend/durableScanJobDispatch.test.mjs \
            tests/frontend/asyncStandardScanJob.test.mjs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt

      - name: Syntax and focused retry contracts
        run: |
          python -m py_compile scanner-api/app/main.py scanner-api/app/scan_job.py
          node --check base44/functions/startStandardScanJob/cloudTasks.js
          node --check tests/frontend/durableScanJobDispatch.test.mjs
          node --check tests/frontend/asyncStandardScanJob.test.mjs
          node --test tests/frontend/durableScanJobDispatch.test.mjs tests/frontend/asyncStandardScanJob.test.mjs
          PYTHONPATH=scanner-api pytest -q scanner-api/tests/test_attempt_binding.py scanner-api/tests/test_durable_completion_service.py scanner-api/tests/test_scan_job_worker.py

      - name: Full frontend gates
        run: |
          npm run lint
          npm run typecheck
          npm run test:frontend
          npm run build

      - name: Full scanner gates
        run: |
          pytest tests/
          (cd scanner-api && pytest tests/)
          (cd scanner-api && python scripts/freeze_beta_revision.py --check)
          docker build --tag fixlist-scanner:pr114-retry .

      - name: Commit exact retry fix
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            base44/functions/startStandardScanJob/cloudTasks.js \
            base44/functions/startStandardScanJob/entry.ts \
            base44/functions/durableScanWorkerControl/index.ts \
            base44/functions/persistDurableScanAuthority/index.ts \
            base44/functions/persistDurableScanAuthority/authoritySnapshot.js \
            scanner-api/app/main.py \
            scanner-api/app/scan_job.py \
            scanner-api/tests/test_attempt_binding.py \
            scanner-api/tests/test_durable_completion_service.py \
            tests/frontend/durableScanJobDispatch.test.mjs \
            tests/frontend/asyncStandardScanJob.test.mjs
          git commit -m "fix: bind durable scan retries to attempt count"
          git push origin HEAD:large-site-durable-worker

  build:
    name: Lint, typecheck, contract tests, and build
    needs: apply-retry-patch
    if: needs.apply-retry-patch.outputs.changed == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend contract tests
        run: npm run test:frontend

      - name: Build
        run: npm run build

  scanner-regressions:
    name: Scanner regression fixtures
    needs: apply-retry-patch
    if: needs.apply-retry-patch.outputs.changed == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt

      - name: Run root scanner regression tests
        run: pytest tests/

      - name: Run Python scanner-api tests
        working-directory: scanner-api
        run: pytest tests/

      - name: Verify frozen beta revision matches code
        working-directory: scanner-api
        run: python scripts/freeze_beta_revision.py --check

      - name: Build production scanner image
        run: docker build --tag fixlist-scanner:ci .
