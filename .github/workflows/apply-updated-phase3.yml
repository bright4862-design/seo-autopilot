name: Apply updated Phase 3 design

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-test-clean:
    if: github.head_ref == 'agent/apply-updated-phase3-design'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/apply-updated-phase3-design
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Reconstruct and verify patch
        run: |
          : > /tmp/updated-phase3.patch.gz
          for part in .github/patches/updated-phase3.part*.b64; do
            base64 --decode "$part" >> /tmp/updated-phase3.patch.gz
          done
          gzip --decompress --stdout /tmp/updated-phase3.patch.gz > /tmp/updated-phase3.patch
          echo '0d57fc90888f22e0c1d4ef171a2516503092ef603305ecc38267ffa7b0ae3b1a  /tmp/updated-phase3.patch' | sha256sum --check
          grep -q 'Subject: \[PATCH 5/5\] Redesign dashboard, FixList, and billing (Phase 3)' /tmp/updated-phase3.patch

      - name: Apply updated Phase 3
        run: git am --3way /tmp/updated-phase3.patch

      - name: Normalize Tailwind indentation
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('tailwind.config.js')
          text = path.read_text()
          text = ''.join(re.sub(r'^ +(?=\t)', '', line) for line in text.splitlines(keepends=True))
          path.write_text(text)
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend contract tests
        run: npm run test:frontend

      - name: Production build
        run: npm run build

      - name: Prepare final product tree
        run: |
          rm -f .github/patches/updated-phase3.part*.b64
          rm -f .github/patches/.phase3-staged
          rm -f .github/patches/.phase3-ready
          rm -f .github/patches/.phase3-pr-ready
          rm -f .github/workflows/apply-updated-phase3.yml
          git add -A
          git commit -m 'Clean updated Phase 3 product tree'

      - name: Capture final diff hygiene
        id: diffcheck
        run: |
          set +e
          git diff --check origin/main...HEAD > /tmp/diff-check.txt 2>&1
          status=$?
          cat /tmp/diff-check.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diff hygiene diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updated-phase3-diff-hygiene
          path: /tmp/diff-check.txt
          if-no-files-found: error

      - name: Enforce final diff hygiene
        run: exit "${{ steps.diffcheck.outputs.status }}"

      - name: Push verified product branch
        run: git push origin HEAD:agent/apply-updated-phase3-design
