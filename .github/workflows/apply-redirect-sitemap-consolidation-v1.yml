The original production matrix submitted `https://www.ikea.com`, which routed to IKEA's global corporate/editorial branch rather than a country storefront. In the preserved evidence, 147 of 150 pages were under `/global/en/`, 50 routes were articles, and there were zero product-route or product-schema signals. There were no blocked or HTTP 429 pages.

