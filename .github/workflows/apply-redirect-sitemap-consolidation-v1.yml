          post = post[:function_start] + '''def group_indexability_quality_findings(findings: list[dict]) -> list[dict]:
    groups: dict[tuple[str, str], list[dict]] = {}
    for finding in findings:
        rule = str(finding.get("rule") or "")
        family = str(finding.get("page_template_family") or "standard")
        family_key = "cross_family" if is_cross_family_rule(rule) else family
        groups.setdefault((rule, family_key), []).append(finding)

    output: list[dict] = []
    severity = {"critical": 4, "high": 3, "medium": 2, "low": 1}
    for (rule, family_key), members in groups.items():
        affected = _unique(
            page
            for member in members
            for page in (member.get("affected_pages") or [member.get("page_url")])
        )[:150]
        if len(affected) < GROUP_MIN_AFFECTED:
            output.extend(members)
            continue

        sample = dict(members[0])
        pages_by_family: dict[str, list[str]] = {}
        for member in members:
            member_family = str(member.get("page_template_family") or "standard")
            for page in (member.get("affected_pages") or [member.get("page_url")]):
                cleaned = str(page or "").strip()
                if cleaned and cleaned not in pages_by_family.setdefault(member_family, []):
                    pages_by_family[member_family].append(cleaned)
        family_breakdown = {name: len(values) for name, values in pages_by_family.items()}
        representative_pages_by_family = {name: values[:3] for name, values in pages_by_family.items()}
        family_count = len(pages_by_family)
        cross_family = is_cross_family_rule(rule) and family_count > 1
        group_key = f"indexability-quality|{rule}|{family_key}|{','.join(sorted(pages_by_family))}"
        group_id = "finding_" + hashlib.sha1(group_key.encode("utf-8")).hexdigest()[:12]
        highest_priority = max(
            (str(member.get("priority") or "low") for member in members),
            key=lambda value: severity.get(value, 0),
        )
        title = QUALITY_GROUP_TITLES.get(rule, str(sample.get("title") or "Fix repeated indexability issue"))
        specific_copy = consolidation_copy(rule)
        explanation = specific_copy.get(
            "explanation",
