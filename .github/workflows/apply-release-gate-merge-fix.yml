name: Apply merged release gate fix

on:
  push:
    branches:
      - agent/fix-merged-release-gate

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-merged-release-gate
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply guarded patch
        run: python scripts/apply_release_gate_merge_fix.py

      - name: Remove temporary applicator files
        run: rm scripts/apply_release_gate_merge_fix.py .github/workflows/apply-release-gate-merge-fix.yml

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test:frontend
          npm run build
          git diff --check

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix merged release gate eligibility"
          git push origin HEAD:agent/fix-merged-release-gate
