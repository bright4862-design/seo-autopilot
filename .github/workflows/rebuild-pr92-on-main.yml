name: Rebuild Patch 3 on main

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

permissions:
  contents: write

jobs:
  rebuild-and-test:
    if: github.event.pull_request.head.ref == 'agent/persist-grouped-recommendation-evidence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore tested Patch 3 files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/evidence-quality-release-gate
          git checkout 61cc4739d063bc3a928bc667dc2e82eee4a9768f -- \
            base44/entities/FixItem.jsonc \
            data/beta-crawler-revision.json \
            docs/releases/grouped-recommendation-evidence-v1.md \
            scanner-api/app/beta_revision.py \
            scanner-api/app/review.py \
            scanner-api/tests/test_grouped_metadata_evidence.py \
            scanner-api/tests/test_metadata_title_evidence_v9.py \
            scanner-api/tests/test_observability.py \
            src/lib/scanRunModel.js \
            tests/frontend/metaDescriptionGuidance.test.mjs \
            tests/frontend/releaseAuthorityGate.test.mjs \
            tests/frontend/scanRunPersistence.test.mjs

      - name: Install Python dependencies
        run: python -m pip install -r scanner-api/requirements.txt

      - name: Run focused grouped-evidence tests
        env:
          PYTHONPATH: scanner-api
        run: pytest -q scanner-api/tests/test_grouped_metadata_evidence.py scanner-api/tests/test_metadata_title_evidence_v9.py

      - name: Run scanner regression suite
        env:
          PYTHONPATH: scanner-api
        run: pytest -q scanner-api/tests

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend contract tests
        run: npm run test:frontend

      - name: Build production frontend
        run: npm run build

      - name: Commit direct Patch 3 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rebuild-pr92-on-main.yml
          git add \
            base44/entities/FixItem.jsonc \
            data/beta-crawler-revision.json \
            docs/releases/grouped-recommendation-evidence-v1.md \
            scanner-api/app/beta_revision.py \
            scanner-api/app/review.py \
            scanner-api/tests/test_grouped_metadata_evidence.py \
            scanner-api/tests/test_metadata_title_evidence_v9.py \
            scanner-api/tests/test_observability.py \
            src/lib/scanRunModel.js \
            tests/frontend/metaDescriptionGuidance.test.mjs \
            tests/frontend/releaseAuthorityGate.test.mjs \
            tests/frontend/scanRunPersistence.test.mjs
          git commit -m "Persist grouped recommendation evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
