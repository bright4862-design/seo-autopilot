name: Apply v9 review corrections

on:
  push:
    branches:
      - agent/metadata-title-evidence-v9
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/metadata-title-evidence-v9
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt

      - name: Apply scanner ownership and determinism patch
        run: python .github/scripts/apply-claude-review-v9.py

      - name: Run focused v9 regressions
        working-directory: scanner-api
        run: pytest tests/test_metadata_title_evidence_v9.py -q

      - name: Run complete scanner API suite
        working-directory: scanner-api
        run: pytest tests/ -q

      - name: Run root scanner regressions
        run: pytest tests/ -q

      - name: Run frontend contracts
        run: npm run test:frontend

      - name: Lint, typecheck and build
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Verify candidate release fingerprint
        working-directory: scanner-api
        run: python scripts/freeze_beta_revision.py --check

      - name: Commit direct scanner correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add scanner-api/app/scanner.py
          git diff --cached --stat
          git commit -m "Address independent v9 review findings"
          git push origin HEAD:agent/metadata-title-evidence-v9
