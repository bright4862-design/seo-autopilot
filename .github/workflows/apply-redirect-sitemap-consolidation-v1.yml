            tests/test_sitemap_indexability_conflicts.py \
            tests/test_redirect_evidence.py \
            tests/test_beta_revision.py

      - name: Verify no scoring constants changed
        run: |
          git diff -- scanner-api/app/review.py scanner-api/app/review_calibration.py
          test -z "$(git diff --name-only -- scanner-api/app/review.py scanner-api/app/review_calibration.py)"

      - name: Remove patch workflow and commit direct source
        run: |
          rm .github/workflows/apply-redirect-sitemap-consolidation-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add cross-family redirect and sitemap consolidation"
          git push origin HEAD:feature/redirect-sitemap-consolidation-v1
