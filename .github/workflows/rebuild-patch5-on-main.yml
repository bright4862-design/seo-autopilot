name: Rebuild Patch 5 on main

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

permissions:
  contents: write

jobs:
  rebuild-and-test:
    if: github.event.pull_request.head.ref == 'agent/sitemap-time-reservation-rebased'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore tested Patch 5 files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/sitemap-time-reservation
          git checkout 377458f562e0e51c3d2f83d50fbbcd2f3f9e2db5 -- \
            base44/entities/ScanRun.jsonc \
            data/beta-crawler-revision.json \
            docs/releases/sitemap-time-reservation-v1.md \
            scanner-api/app/beta_revision.py \
            scanner-api/app/main.py \
            scanner-api/app/scan_timing.py \
            scanner-api/app/scanner.py \
            scanner-api/app/sitemap.py \
            scanner-api/tests/test_observability.py \
            scanner-api/tests/test_sitemap_time_reservation.py \
            src/components/scan/ScanWebsiteForm.jsx \
            src/lib/scanRunModel.js \
            tests/frontend/releaseAuthorityGate.test.mjs \
            tests/frontend/scanRunPersistence.test.mjs \
            tests/frontend/sitemapTimingDiagnostics.test.mjs

      - name: Install Python dependencies
        run: python -m pip install -r scanner-api/requirements.txt

      - name: Run focused sitemap timing tests
        env:
          PYTHONPATH: scanner-api
        run: pytest -q scanner-api/tests/test_sitemap_time_reservation.py

      - name: Run scanner regression suite
        env:
          PYTHONPATH: scanner-api
        run: pytest -q scanner-api/tests

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend contract tests
        run: npm run test:frontend

      - name: Build production frontend
        run: npm run build

      - name: Commit direct Patch 5 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rebuild-patch5-on-main.yml
          git add \
            base44/entities/ScanRun.jsonc \
            data/beta-crawler-revision.json \
            docs/releases/sitemap-time-reservation-v1.md \
            scanner-api/app/beta_revision.py \
            scanner-api/app/main.py \
            scanner-api/app/scan_timing.py \
            scanner-api/app/scanner.py \
            scanner-api/app/sitemap.py \
            scanner-api/tests/test_observability.py \
            scanner-api/tests/test_sitemap_time_reservation.py \
            src/components/scan/ScanWebsiteForm.jsx \
            src/lib/scanRunModel.js \
            tests/frontend/releaseAuthorityGate.test.mjs \
            tests/frontend/scanRunPersistence.test.mjs \
            tests/frontend/sitemapTimingDiagnostics.test.mjs
          git commit -m "Reserve crawl time before sitemap expansion"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
