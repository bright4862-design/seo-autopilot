name: Materialize worker promotion command

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.ref == 'release/promote-staged-worker-command'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Render exact pinned cloud operator into normal file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/fixlist-cloud-operator.yml')
          payload_path = Path('.tmp/release/promote-staged-worker-job.yml')
          out = Path('.tmp/release/materialized-fixlist-cloud-operator.yml.txt')
          text = workflow.read_text()
          payload = payload_path.read_text().rstrip() + '\n'
          marker = '\n  readonly-diagnostic:\n'
          if text.count(marker) != 1:
              raise SystemExit('readonly-diagnostic marker must occur exactly once')
          if 'promote-staged-worker-on-owner-comment:' in text:
              raise SystemExit('promotion job already exists')
          rendered = text.replace(marker, '\n' + payload + marker, 1)
          out.write_text(rendered)
          PY
      - name: Push rendered normal file only
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp/release/materialized-fixlist-cloud-operator.yml.txt
          if git diff --cached --quiet; then
            echo 'Rendered file already current.'
            exit 0
          fi
          git commit -m 'Render SHA-bound worker promotion workflow'
          git push origin "HEAD:$HEAD_REF"
