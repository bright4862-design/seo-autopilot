name: Patch review presentation contract

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-review-contract.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner-api/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Apply patch
        run: python .github/scripts/patch_review_contract.py

      - name: Install backend dependencies
        run: python -m pip install -r scanner-api/requirements.txt

      - name: Run backend suite
        env:
          PYTHONPATH: scanner-api
        run: pytest -q scanner-api/tests

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend contract regressions
        run: node --test tests/frontend/reviewContract.test.mjs

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/scan/ScanWebsiteForm.jsx src/lib/reviewContract.js tests/frontend/reviewContract.test.mjs scanner-api/app/review.py scanner-api/tests/test_review_presentation_contract.py
          git commit -m "Preserve Python review presentation contract"
          git push origin main

      - name: Remove temporary patch files
        run: |
          rm .github/scripts/patch_review_contract.py .github/workflows/patch-review-contract.yml
          git add -u .github/scripts/patch_review_contract.py .github/workflows/patch-review-contract.yml
          git commit -m "Remove temporary review contract workflow"
          git push origin main
