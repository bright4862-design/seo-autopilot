name: FixList CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck, contract tests, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend contract tests
        run: npm run test:frontend

      - name: Build
        run: npm run build

  scanner-regressions:
    name: Scanner regression fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt

      - name: Run root scanner regression tests
        run: pytest tests/

      - name: Run Python scanner-api tests
        working-directory: scanner-api
        run: pytest tests/

      - name: Verify frozen beta revision matches code
        working-directory: scanner-api
        run: python scripts/freeze_beta_revision.py --check
