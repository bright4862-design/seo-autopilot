name: Verify URL family interleaving

on:
  push:
    paths:
      - .github/workflows/verify-url-family-interleaving.yml

permissions:
  contents: write

jobs:
  test-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: scanner-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full backend suite
        working-directory: scanner-api
        run: pytest tests -q

      - name: Remove verification workflow
        run: |
          rm .github/workflows/verify-url-family-interleaving.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-url-family-interleaving.yml
          git commit -m "Verify URL-level sitemap family interleaving"
          git push origin main
