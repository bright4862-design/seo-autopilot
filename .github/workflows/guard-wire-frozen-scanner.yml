name: Guard frozen scanner wiring

on:
  push:
    branches:
      - agent/wire-frozen-scanner
    paths:
      - .github/workflows/guard-wire-frozen-scanner.yml
      - tools/patch_wire_frozen_scanner.py
      - data/wire-frozen-scanner-trigger

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/wire-frozen-scanner
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply focused production wiring patch
        run: python tools/patch_wire_frozen_scanner.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend release contract
        run: |
          npm run lint
          npm run typecheck
          npm run test:frontend
          npm run build

      - name: Remove temporary guard files
        run: |
          rm -f .github/workflows/guard-wire-frozen-scanner.yml
          rm -f tools/patch_wire_frozen_scanner.py
          rm -f data/wire-frozen-scanner-trigger

      - name: Commit validated patch
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CrawlStatus.jsx tests/frontend/crawlStatusPipeline.test.mjs .github/workflows/guard-wire-frozen-scanner.yml tools/patch_wire_frozen_scanner.py data/wire-frozen-scanner-trigger
          git commit -m "Wire frozen scanner into dashboard"
          git push origin HEAD:agent/wire-frozen-scanner
