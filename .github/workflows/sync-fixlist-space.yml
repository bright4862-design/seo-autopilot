name: Deploy FixList AI to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "hf-space/**"
      - ".github/workflows/sync-fixlist-space.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixlist-hugging-face-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Space bundle
        run: |
          test -f hf-space/Dockerfile
          test -f hf-space/app.py
          test -f hf-space/app_redesign.py
          test -f hf-space/requirements.txt
          grep -q 'CMD \["python", "app_redesign.py"\]' hf-space/Dockerfile

      - name: Mirror hf-space into Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          export GIT_LFS_SKIP_SMUDGE=1

          git clone --depth 1 \
            "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/milo2455555/fixlist-ai" \
            /tmp/fixlist-ai-space

          rsync -a --delete --exclude='.git/' hf-space/ /tmp/fixlist-ai-space/

          cd /tmp/fixlist-ai-space
          git config user.name "FixList AI Deploy"
          git config user.email "actions@users.noreply.github.com"
          printf '%s\n' "${GITHUB_SHA}" > GITHUB_DEPLOYMENT_SHA
          git add -A

          if git diff --cached --quiet; then
            echo "Hugging Face Space is already current."
          else
            git commit -m "Deploy FixList AI from GitHub ${GITHUB_SHA}"
            git push origin HEAD:main
          fi

      - name: Show deployed Space revision
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git ls-remote \
            "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/milo2455555/fixlist-ai" \
            refs/heads/main
