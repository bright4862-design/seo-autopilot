name: Stage2IntegrationRun
on: [push]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/agent/full-blueprint-stage2-coverage-b06-20260919'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest pytest-asyncio
      - run: pip install -r scanner-api/requirements.txt
      - run: python scripts/stage2_integration_patch.py
      - run: python -m pytest -q scanner-api/tests/test_stage2_run_scan_integration.py scanner-api/tests/test_stage2_shared_probe_orchestration.py scanner-api/tests/test_active_soft404_orchestration.py scanner-api/tests/test_redirect_meaning_stage2.py scanner-api/tests/test_stage2_coverage_integrity.py scanner-api/tests/test_stage2_url_variant_exact_identity.py
      - run: python -m pytest -q tests/
      - run: cd scanner-api && python -m pytest -q tests/
      - run: python -m compileall -q scanner-api/app scanner-api/tests/test_stage2_run_scan_integration.py
      - run: git diff --check
      - name: Commit verified integration slice
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm scripts/stage2_integration_patch.py
          rm .github/workflows/stage2-integration-once.yml
          rm .github/workflows/stage2-integration-run.yml
          git add scanner-api/app/scanner.py scanner-api/tests/test_stage2_run_scan_integration.py
          git rm --cached scripts/stage2_integration_patch.py .github/workflows/stage2-integration-once.yml .github/workflows/stage2-integration-run.yml
          git diff --cached --check
          git commit -m 'feat(scanner): wire shared Stage 2 probes into run_scan'
          git push origin HEAD:agent/full-blueprint-stage2-coverage-b06-20260919
