name: Apply redirect sitemap consolidation v1

on:
  push:
    branches:
      - feature/redirect-sitemap-consolidation-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/redirect-sitemap-consolidation-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r scanner-api/requirements.txt

      - name: Apply guarded product and release changes
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(path: str, old: str, new: str) -> None:
              target = ROOT / path
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          consolidation_module = '''from __future__ import annotations

FINDING_CONSOLIDATION_VERSION = "finding_consolidation_v1_redirect_sitemap_families"

# Exact-rule only: different remediation rules must never be merged together.
CROSS_FAMILY_REDIRECT_SITEMAP_RULES = frozenset({
    "sitemap_redirect",
    "internal_link_redirect",
    "redirect_chain",
    "redirect_destination_failed",
    "redirect_destination_blocked",
    "redirect_destination_noindex",
    "sitemap_indexability_conflict",
    "sitemap_canonicalized_url",
})

_RULE_COPY = {
    "sitemap_redirect": {
        "explanation": "Several XML sitemap entries redirect before reaching their final destination. This is one sitemap-maintenance issue even when the URLs belong to different page families.",
        "recommendation": "Replace each redirecting sitemap entry with its final indexable canonical URL, then regenerate and resubmit the sitemap.",
    },
    "internal_link_redirect": {
        "explanation": "Several internal links point to URLs that redirect before reaching their destination. Consolidating them keeps navigation and crawl paths direct across every affected page family.",
        "recommendation": "Update each internal link to point directly to the final destination URL and verify representative links from every affected page family.",
    },
    "redirect_chain": {
        "explanation": "Several URLs pass through repeated redirect hops. The same routing problem affects multiple page families and should be fixed as one redirect-rule cleanup.",
        "recommendation": "Point each source URL directly to its final destination and remove unnecessary intermediate redirect hops.",
    },
    "redirect_destination_failed": {
        "explanation": "Several redirects end on unavailable pages. These failures span multiple page families but share the same destination-health remediation.",
        "recommendation": "Restore a valid final destination or update each redirect to the closest relevant live page, then verify the final response is successful.",
    },
    "redirect_destination_blocked": {
        "explanation": "Several redirects end on robots-blocked destinations. This is one crawl-access pattern across the affected page families.",
        "recommendation": "Confirm that each destination is intended, allow crawler access where appropriate, and redirect directly to a crawlable final URL.",
    },
    "redirect_destination_noindex": {
        "explanation": "Several redirects end on pages that are explicitly noindexed. This sends conflicting destination signals across multiple page families.",
        "recommendation": "Redirect to indexable final destinations or revise the destination noindex policy when those pages should consolidate search signals.",
    },
    "sitemap_indexability_conflict": {
        "explanation": "Several sitemap entries are explicitly noindexed or blocked by robots.txt. The URLs span multiple page families but share one sitemap-indexability conflict.",
        "recommendation": "Remove non-indexable URLs from the sitemap, or make them crawlable and indexable when they are intended search landing pages.",
    },
    "sitemap_canonicalized_url": {
        "explanation": "Several sitemap entries canonicalize to different preferred URLs. This is one sitemap-maintenance problem across multiple page families.",
        "recommendation": "Replace each canonicalized sitemap entry with its final indexable canonical URL and keep only preferred URLs in XML sitemaps.",
    },
}


def is_cross_family_rule(rule: str) -> bool:
    return str(rule or "") in CROSS_FAMILY_REDIRECT_SITEMAP_RULES


def consolidation_copy(rule: str) -> dict[str, str]:
    return dict(_RULE_COPY.get(str(rule or ""), {}))
'''
          (ROOT / "scanner-api/app/finding_consolidation.py").write_text(consolidation_module, encoding="utf-8")

