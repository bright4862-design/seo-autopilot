name: FixList CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Lint, typecheck, contract tests, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend contract tests
        run: npm run test:frontend

      - name: Build
        run: npm run build

  scanner-regressions:
    name: Scanner regression fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt

      - name: Run root scanner regression tests
        run: pytest tests/

      - name: Run Python scanner-api tests
        working-directory: scanner-api
        run: pytest tests/

      - name: Verify frozen beta revision matches code
        working-directory: scanner-api
        run: python scripts/freeze_beta_revision.py --check

  publish-fixlist-url-evidence:
    if: github.head_ref == 'feature/fixlist-full-url-evidence'
    name: Validate and publish URL evidence patch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/fixlist-full-url-evidence
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply guarded source patch
        run: |
          python -m py_compile scripts/ops/apply_fixlist_full_url_evidence.py
          python scripts/ops/apply_fixlist_full_url_evidence.py
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/frontend/fixListEvidenceUx.test.mjs')
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace(
              '  assert.match(fixListSource, /\\\\/cdn-cgi\\\\//);',
              '  assert.ok(fixListSource.includes("cdn-cgi"));',
          )
          test_path.write_text(test_text, encoding='utf-8')

          fixlist_path = Path('src/pages/FixList.jsx')
          source = fixlist_path.read_text(encoding='utf-8')
          source = source.replace(
              '<AffectedPage key={`${page}-${index}`} page={page} websiteUrl={item.websiteUrl} index={index} />',
              '<AffectedPage key={`${page}-${index}`} page={toAbsolutePageUrl(page, item.websiteUrl)} />',
          )
          start = source.index('function AffectedPage({ page, websiteUrl, index }) {')
          end = source.index('\n\nfunction normalizeAffectedPageList', start)
          replacement = '''function AffectedPage({ page }) {
  const label = formatPageLabel(page);
  const path = formatPagePath(page);
  const showPath = cleanString(path) !== cleanString(label);

  return (
    <div className="flex items-start gap-2 rounded-md border border-hairline-soft px-2.5 py-2 text-[13px] tabular-nums">
      <div className="min-w-0 flex-1">
        <p className="truncate font-medium text-ink">{label}</p>
        {showPath ? <p className="break-all text-ink-faint">{path}</p> : null}
      </div>
      {isFullUrl(page) ? (
        <a href={page} target="_blank" rel="noreferrer" className="shrink-0 p-1 text-ink-faint transition-colors hover:text-ink" aria-label="Open page">
          <ExternalLink className="h-3.5 w-3.5" />
        </a>
      ) : null}
    </div>
  );
}'''
          source = source[:start] + replacement + source[end:]
          fixlist_path.write_text(source, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate product source
        run: |
          npm run lint
          npm run typecheck
          npm run test:frontend
          npm run build

      - name: Commit validated product source
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f \
            .github/workflows/apply-fixlist-full-url-evidence.yml \
            .github/workflows/apply-fixlist-full-url-evidence-v2.yml \
            scripts/ops/apply_fixlist_full_url_evidence.py \
            docs/.fixlist-full-url-evidence-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show all affected URLs and clarify FixList steps"
          git push origin HEAD:feature/fixlist-full-url-evidence
