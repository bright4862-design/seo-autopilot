name: Verify focused v8 production

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Cloud Run and Base44 markers
        shell: python
        run: |
          import json, re, urllib.request
          from pathlib import Path

          expected = {
              "archetype_classifier_version": "archetype_classifier_v8_platform_product_routes",
              "representative_page_version": "business_representative_page_v3_sitewide_archetype_ranking",
              "page_level_asset_evidence_version": "page_level_asset_evidence_v3_markdown",
              "beta_revision_fingerprint": "430813f2b15afa8f",
              "version": "python_scanner_v3_bounded_request",
              "scanner_build_revision": "hard_page_cap_response_v1",
              "review_version": "python_review_v2_structural_marketplace",
          }
          health_url = "https://seo-autopilot-4545-919035207432.europe-west1.run.app/health"
          app_url = "https://rich-rank-pilot-flow.base44.app/"

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "SEO-Pilot-Production-Verification/1.0"})
              with urllib.request.urlopen(req, timeout=45) as response:
                  return response.read().decode("utf-8", errors="replace")

          health = json.loads(fetch(health_url))
          html = fetch(app_url)
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+\.js)["\']', html)
          bundle_path = next((src for src in scripts if "index-" in src), scripts[-1] if scripts else "")
          if bundle_path.startswith("/"):
              bundle_url = app_url.rstrip("/") + bundle_path
          elif bundle_path.startswith("http"):
              bundle_url = bundle_path
          else:
              bundle_url = app_url + bundle_path
          bundle = fetch(bundle_url) if bundle_path else ""

          health_checks = {key: health.get(key) == value for key, value in expected.items()}
          bundle_checks = {
              "classifier": expected["archetype_classifier_version"] in bundle,
              "representative": expected["representative_page_version"] in bundle,
              "page_asset": expected["page_level_asset_evidence_version"] in bundle,
              "fingerprint": expected["beta_revision_fingerprint"] in bundle,
          }
          passed = all(health_checks.values()) and all(bundle_checks.values())
          report = {
              "passed": passed,
              "expected": expected,
              "health_actual": {key: health.get(key) for key in expected},
              "health_checks": health_checks,
              "bundle_path": bundle_path,
              "bundle_checks": bundle_checks,
          }
          Path("docs/releases/focused-v8-production-verification.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          Path(".verification-status").write_text("0" if passed else "1")
      - name: Remove verifier and commit report
        shell: bash
        run: |
          status=$(cat .verification-status)
          rm .verification-status
          rm .github/workflows/verify-focused-v8-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record focused v8 production verification"
          git push origin HEAD:${{ github.head_ref }}
          exit "$status"
