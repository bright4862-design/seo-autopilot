name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: >
      github.actor == 'bright4862-design' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
            checks: read
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(python:*),Bash(python3:*),Bash(pytest:*),Bash(pip:*),Bash(git:*),Bash(docker:*)"
            --append-system-prompt "You are the release engineer for FixList Standard 150. Treat repository evidence as authoritative. Work only on the issue or pull request where you were invoked. Never print or expose credentials. Do not merge a pull request, modify main, deploy or publish Base44, deploy GCP resources, shift production traffic, run customer scans, enable Grok, enable Premium 5000, change Stripe, or alter schema/RLS unless the repository owner explicitly authorizes that exact action in a new comment. Base44 function deploys are live changes, not drafts. Stop on identity drift, failed tests, missing credentials, or ambiguous production state. Prefer minimal fixes with structural tests. Report exact SHAs, changed files, commands actually run, test totals, blockers, and rollback steps."
