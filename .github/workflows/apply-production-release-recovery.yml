name: Apply production release recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-test-clean:
    if: github.head_ref == 'agent/restore-python-and-isolate-scans'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/restore-python-and-isolate-scans
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Apply recovery patch
        run: python .github/patches/apply-production-release-recovery.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt

      - name: Compile Python
        run: python -m compileall -q scanner-api/app scanner-api/tests

      - name: Run focused recovery regressions
        working-directory: scanner-api
        run: pytest tests/test_production_release_recovery.py -q

      - name: Create product commit
        run: |
          git add base44/functions/runAdvancedScan/entry.ts \
            scanner-api/app/main.py scanner-api/app/review.py scanner-api/app/scanner.py scanner-api/app/sitemap.py \
            scanner-api/tests/test_production_release_recovery.py \
            src/components/scan/ScanWebsiteForm.jsx src/pages/FixList.jsx \
            tests/frontend/production-release-recovery.test.mjs
          git commit -m 'Restore Python scans and isolate results by scan ID'
          echo "PRODUCT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record updated frozen beta revision
        working-directory: scanner-api
        run: |
          python scripts/freeze_beta_revision.py \
            --git-commit "$PRODUCT_COMMIT" \
            --acceptance-report docs/beta-acceptance.md \
            --recorded-at '2026-07-14T16:45:00+02:00' \
            --note 'Release-recovery baseline: bounded Python request, Python-required production scans, scan-ID isolation, and marketplace archetype regression.'
          git add ../data/beta-crawler-revision.json
          git commit -m 'Record release recovery beta revision'

      - name: Run root scanner regressions
        run: pytest tests/

      - name: Run full scanner API suite
        working-directory: scanner-api
        run: pytest tests/

      - name: Verify frozen beta revision
        working-directory: scanner-api
        run: python scripts/freeze_beta_revision.py --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend contract tests
        run: npm run test:frontend

      - name: Production build
        run: npm run build

      - name: Remove temporary patch machinery
        run: |
          rm -f .github/patches/apply-production-release-recovery.py
          rm -f .github/workflows/apply-production-release-recovery.yml
          git add -A
          git commit -m 'Remove temporary release recovery machinery'

      - name: Verify final scope and hygiene
        run: |
          git diff --check origin/main...HEAD
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          test -z "$(echo "$changed" | grep '^\.github/' || true)"
          echo "$changed" | grep -qx 'base44/functions/runAdvancedScan/entry.ts'
          echo "$changed" | grep -qx 'data/beta-crawler-revision.json'
          echo "$changed" | grep -qx 'scanner-api/app/main.py'
          echo "$changed" | grep -qx 'scanner-api/app/review.py'
          echo "$changed" | grep -qx 'scanner-api/app/scanner.py'
          echo "$changed" | grep -qx 'scanner-api/app/sitemap.py'
          echo "$changed" | grep -qx 'scanner-api/tests/test_production_release_recovery.py'
          echo "$changed" | grep -qx 'src/components/scan/ScanWebsiteForm.jsx'
          echo "$changed" | grep -qx 'src/pages/FixList.jsx'
          echo "$changed" | grep -qx 'tests/frontend/production-release-recovery.test.mjs'
          test "$(echo "$changed" | wc -l | tr -d ' ')" = '10'

      - name: Push verified product branch
        run: git push origin HEAD:agent/restore-python-and-isolate-scans
