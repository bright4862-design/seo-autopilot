name: Deploy FixList AI to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "hf-space/**"
      - ".github/workflows/deploy-huggingface.yml"
  workflow_dispatch:

concurrency:
  group: deploy-fixlist-ai-hugging-face
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Space bundle
        run: |
          test -f hf-space/app.py
          test -f hf-space/app_redesign.py
          test -f hf-space/Dockerfile
          test -f hf-space/requirements.txt

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Exchange GitHub OIDC token
        env:
          HF_OIDC_RESOURCE: spaces/milo2455555/fixlist-ai
        run: |
          HF_TOKEN="$("$HOME/.hf-cli/venv/bin/python" - <<'PY'
          from huggingface_hub import get_token

          token = get_token()
          if not token:
              raise SystemExit("Hugging Face OIDC did not return a token.")
          print(token)
          PY
          )"
          echo "::add-mask::$HF_TOKEN"
          echo "HF_TOKEN=$HF_TOKEN" >> "$GITHUB_ENV"

      - name: Verify Hugging Face authentication
        run: hf auth whoami

      - name: Deploy Docker Space
        shell: bash
        run: |
          set -Eeuo pipefail

          if hf upload milo2455555/fixlist-ai ./hf-space . \
            --repo-type space \
            --delete "*" \
            --commit-message "Deploy ${GITHUB_SHA::7} from GitHub"; then
            exit 0
          fi

          echo "::warning::Hugging Face CLI could not resolve the private Space; retrying through authenticated Git."
          HF_GIT_AUTH="$(printf 'hf_token:%s' "$HF_TOKEN" | base64 -w0)"
          echo "::add-mask::$HF_GIT_AUTH"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://huggingface.co/.extraheader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $HF_GIT_AUTH"

          DEPLOY_DIR="$(mktemp -d)"
          git clone --depth 1 https://huggingface.co/spaces/milo2455555/fixlist-ai "$DEPLOY_DIR"
          rsync -a --delete --exclude=.git/ ./hf-space/ "$DEPLOY_DIR/"

          git -C "$DEPLOY_DIR" config user.name "FixList AI Deploy"
          git -C "$DEPLOY_DIR" config user.email "actions@users.noreply.github.com"
          git -C "$DEPLOY_DIR" add -A

          if git -C "$DEPLOY_DIR" diff --cached --quiet; then
            echo "Hugging Face Space is already up to date."
            exit 0
          fi

          git -C "$DEPLOY_DIR" commit -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git -C "$DEPLOY_DIR" push origin HEAD:main
