name: Launch redirect sitemap consolidation v1

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  launch:
    if: github.head_ref == 'feature/redirect-sitemap-consolidation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/redirect-sitemap-consolidation-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r scanner-api/requirements.txt

      - name: Extract and run guarded patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-redirect-sitemap-consolidation-v1.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Run focused consolidation and revision tests"
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit('guarded workflow extraction anchors drifted')
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = script.splitlines()
          normalized = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply_candidate.py').write_text(normalized, encoding='utf-8')
          PY
          python /tmp/apply_candidate.py

      - name: Run focused consolidation and revision tests
        working-directory: scanner-api
        run: |
          pytest -q \
            tests/test_redirect_sitemap_consolidation.py \
            tests/test_sitemap_indexability_conflicts.py \
            tests/test_redirect_evidence.py \
            tests/test_beta_revision.py

      - name: Verify score calibration is unchanged
        run: |
          test -z "$(git diff --name-only -- scanner-api/app/review.py scanner-api/app/review_calibration.py)"

      - name: Commit direct source and remove temporary harness
        run: |
          rm -f \
            .github/workflows/apply-redirect-sitemap-consolidation-v1.yml \
            .github/workflows/launch-redirect-sitemap-consolidation-v1.yml \
            docs/releases/.redirect-sitemap-consolidation-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add cross-family redirect and sitemap consolidation"
          git push origin HEAD:feature/redirect-sitemap-consolidation-v1
