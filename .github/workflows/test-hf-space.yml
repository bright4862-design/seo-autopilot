name: Test FixList AI Space

on:
  pull_request:
    paths:
      - "hf-space/**"
      - ".github/workflows/test-hf-space.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hf-space
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hf-space/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt pytest

      - name: Compile application
        run: python -m py_compile app.py

      - name: Run tests
        id: pytest
        continue-on-error: true
        run: pytest -q --tb=short > pytest.log 2>&1

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixlist-space-pytest
          path: hf-space/pytest.log
          if-no-files-found: error
          retention-days: 3

      - name: Report test result
        if: always()
        env:
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          cat pytest.log
          test "$PYTEST_OUTCOME" = "success"
