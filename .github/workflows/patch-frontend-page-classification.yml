name: Patch frontend page classification

on:
  push:
    paths:
      - ".github/scripts/patch_frontend_page_classification.py"
      - ".github/workflows/patch-frontend-page-classification.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply targeted frontend patch
        run: python .github/scripts/patch_frontend_page_classification.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify path-classification cases
        run: |
          node <<'NODE'
          const LOW_VALUE_PAGE_PATTERNS = ["/actualites", "/news", "/blog", "/archive", "/archives", "/tag/", "/tags/", "/author/", "/feed", "/rss", "?tag=", "&tag="];
          const LEGAL_PAGE_RE = /(mentions-legales|mentions_legales|politique-de-confidentialite|privacy-policy|privacy_policy|conditions-generales|conditions-generales-de-vente|legal-notice|terms-of-service|terms-and-conditions|terms-of-use|privacy|impressum)|(?:^|\/)(?:cgu|cgv|legal|terms|mentions|privacite)(?:\/|$)/i;
          const ROUTE_BOUNDARY_RE = /\/(?:login|signin|sign-in|register|signup|sign-up|account|mon-compte|dashboard|cart|panier|checkout|billing|admin|wp-admin)(?=[/?#\s]|$)/i;
          const isLegalPagePath = (url = "") => LEGAL_PAGE_RE.test(String(url || "").toLowerCase().split("?")[0].split("#")[0]);
          const isLowValuePage = (url = "") => {
            const value = String(url || "").toLowerCase();
            const path = value.split("#")[0];
            if (isLegalPagePath(path)) return false;
            if (/\/(20\d{2})([-/]\d{1,2}|\/|$)/.test(path)) return true;
            if (/\/page\/\d+(?:\/|$)/.test(path.split("?")[0])) return true;
            if (/[?&]page=\d+/.test(path)) return true;
            return LOW_VALUE_PAGE_PATTERNS.some((pattern) => path.includes(pattern));
          };
          const cases = [
            ["/fr/page/cgu", false],
            ["/fr/page/mentions-legales", false],
            ["/blog/page/3", true],
            ["/page/2", true],
            ["/tag/x", true],
            ["/fr/annonce/domaine-de-locguenole-a-kervignac-56/voir", false],
          ];
          for (const [value, expected] of cases) {
            const actual = isLowValuePage(value);
            if (actual !== expected) throw new Error(`${value}: expected ${expected}, got ${actual}`);
          }
          if (!ROUTE_BOUNDARY_RE.test("/cart")) throw new Error("/cart must be a route boundary");
          if (ROUTE_BOUNDARY_RE.test("/fr/carte-invitation-anniversaire")) throw new Error("/carte must not match /cart");
          console.log("Frontend classification logic checks passed.");
          NODE

      - name: Commit patched frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/scan/ScanWebsiteForm.jsx
          git diff --cached --quiet || git commit -m "Preserve backend page classification in frontend"

      - name: Remove temporary patch files
        run: |
          rm -f .github/scripts/patch_frontend_page_classification.py
          rm -f .github/workflows/patch-frontend-page-classification.yml
          git add -A
          git diff --cached --quiet || git commit -m "Verify frontend page classification patch"
          git push
