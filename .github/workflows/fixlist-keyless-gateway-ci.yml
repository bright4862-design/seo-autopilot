name: FixList Keyless Gateway CI

on:
  pull_request:
    paths:
      - 'dispatch-gateway/**'
      - 'base44/functions/startStandardScanJob/cloudTasks.js'
      - 'tests/frontend/dispatchGatewayContract.test.mjs'
      - 'scripts/deploy_dispatch_gateway.sh'
      - 'scripts/bootstrap-fixlist-dispatch-gateway-iam.sh'
      - '.github/workflows/fixlist-cloud-operator.yml'
      - '.github/workflows/fixlist-keyless-gateway-ci.yml'
  push:
    branches:
      - agent/fixlist-keyless-gateway-main
    paths:
      - 'dispatch-gateway/**'
      - 'base44/functions/startStandardScanJob/cloudTasks.js'
      - 'tests/frontend/dispatchGatewayContract.test.mjs'
      - 'scripts/deploy_dispatch_gateway.sh'
      - 'scripts/bootstrap-fixlist-dispatch-gateway-iam.sh'
      - '.github/workflows/fixlist-cloud-operator.yml'
      - '.github/workflows/fixlist-keyless-gateway-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate shell and Base44 syntax
        run: |
          set -euo pipefail
          bash -n scripts/deploy_dispatch_gateway.sh
          bash -n scripts/bootstrap-fixlist-dispatch-gateway-iam.sh
          node --check base44/functions/startStandardScanJob/cloudTasks.js

      - name: Install canonical gateway dependencies
        working-directory: dispatch-gateway
        run: python -m pip install -r requirements.txt

      - name: Run Base44 to gateway contract tests
        run: node --test tests/frontend/dispatchGatewayContract.test.mjs

      - name: Compile canonical gateway source
        run: python -m py_compile dispatch-gateway/main.py

      - name: Build canonical gateway container
        working-directory: dispatch-gateway
        run: docker build -t fixlist-dispatch-gateway:${{ github.sha }} .
