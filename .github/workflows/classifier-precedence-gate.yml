name: Classifier precedence contract gate

on:
  push:
    branches: [agent/unify-page-classifier-precedence]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Preserve established classifier ordering
        run: python .github/scripts/adjust_classifier_patch_order.py

      - name: Apply classifier patch
        run: python .github/scripts/apply_classifier_precedence_patch.py

      - name: Install backend dependencies
        run: pip install -r scanner-api/requirements.txt

      - name: Run classifier and presentation regressions
        working-directory: scanner-api
        run: pytest tests/test_page_classification.py tests/test_review_presentation_contract.py -q

      - name: Run full backend suite
        working-directory: scanner-api
        run: pytest tests -q

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend contract tests
        run: npm run test:frontend

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Commit verified product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scanner-api/app/extract.py \
            scanner-api/app/review.py \
            scanner-api/tests/test_page_classification.py \
            scanner-api/tests/test_review_presentation_contract.py
          git commit -m "Make page classification evidence-aware"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
