name: Diagnose v9 PR merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 81
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Capture frontend contract output
        id: frontend
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:frontend 2>&1 | tee frontend-contracts.log
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt
      - name: Capture scanner test output
        id: scanner
        continue-on-error: true
        working-directory: scanner-api
        run: |
          set -o pipefail
          pytest tests/ -q --tb=short 2>&1 | tee ../scanner-tests.log
      - name: Capture merge metadata
        run: |
          git rev-parse HEAD > merge-sha.txt
          git log -1 --pretty=fuller >> merge-sha.txt
          cat data/beta-crawler-revision.json > beta-crawler-revision.snapshot.json
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: v9-pr-merge-diagnostics-${{ github.run_id }}
          path: |
            frontend-contracts.log
            scanner-tests.log
            merge-sha.txt
            beta-crawler-revision.snapshot.json
          retention-days: 7
      - name: Fail when either suite failed
        if: steps.frontend.outcome == 'failure' || steps.scanner.outcome == 'failure'
        run: exit 1
