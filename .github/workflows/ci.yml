name: FixList CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-release-gate-patch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/fix-merged-release-gate'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-merged-release-gate
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply guarded patch
        run: python scripts/apply_release_gate_merge_fix.py

      - name: Restore normal workflow and remove applicator files
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm scripts/apply_release_gate_merge_fix.py .github/workflows/apply-release-gate-merge-fix.yml

      - name: Install dependencies
        run: npm ci

      - name: Validate patched frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test:frontend
          npm run build
          git diff --check

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix merged release gate eligibility"
          git push origin HEAD:agent/fix-merged-release-gate

  build:
    name: Lint, typecheck, contract tests, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend contract tests
        run: npm run test:frontend

      - name: Build
        run: npm run build

  scanner-regressions:
    name: Scanner regression fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt

      - name: Run root scanner regression tests
        run: pytest tests/

      - name: Run Python scanner-api tests
        working-directory: scanner-api
        run: pytest tests/

      - name: Verify frozen beta revision matches code
        working-directory: scanner-api
        run: python scripts/freeze_beta_revision.py --check
