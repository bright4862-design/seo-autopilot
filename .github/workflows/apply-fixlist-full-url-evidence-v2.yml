name: Apply FixList full URL evidence v2

on:
  push:
    branches:
      - feature/fixlist-full-url-evidence
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'feature/fixlist-full-url-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fixlist-full-url-evidence
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Apply source patch
        run: |
          python -m py_compile scripts/ops/apply_fixlist_full_url_evidence.py
          python scripts/ops/apply_fixlist_full_url_evidence.py
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/frontend/fixListEvidenceUx.test.mjs')
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace(
              '  assert.match(fixListSource, /\\\\/cdn-cgi\\\\//);',
              '  assert.ok(fixListSource.includes("cdn-cgi"));',
          )
          test_path.write_text(test_text, encoding='utf-8')

          fixlist_path = Path('src/pages/FixList.jsx')
          source = fixlist_path.read_text(encoding='utf-8')
          source = source.replace(
              '<AffectedPage key={`${page}-${index}`} page={page} websiteUrl={item.websiteUrl} index={index} />',
              '<AffectedPage key={`${page}-${index}`} page={toAbsolutePageUrl(page, item.websiteUrl)} />',
          )
          start = source.index('function AffectedPage({ page, websiteUrl, index }) {')
          end = source.index('\n\nfunction normalizeAffectedPageList', start)
          replacement = '''function AffectedPage({ page }) {
  const label = formatPageLabel(page);
  const path = formatPagePath(page);
  const showPath = cleanString(path) !== cleanString(label);

  return (
    <div className="flex items-start gap-2 rounded-md border border-hairline-soft px-2.5 py-2 text-[13px] tabular-nums">
      <div className="min-w-0 flex-1">
        <p className="truncate font-medium text-ink">{label}</p>
        {showPath ? <p className="break-all text-ink-faint">{path}</p> : null}
      </div>
      {isFullUrl(page) ? (
        <a href={page} target="_blank" rel="noreferrer" className="shrink-0 p-1 text-ink-faint transition-colors hover:text-ink" aria-label="Open page">
          <ExternalLink className="h-3.5 w-3.5" />
        </a>
      ) : null}
    </div>
  );
}'''
          source = source[:start] + replacement + source[end:]
          fixlist_path.write_text(source, encoding='utf-8')
          PY

      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test:frontend
          npm run build

      - name: Commit product source
        run: |
          rm -f \
            .github/workflows/apply-fixlist-full-url-evidence.yml \
            .github/workflows/apply-fixlist-full-url-evidence-v2.yml \
            scripts/ops/apply_fixlist_full_url_evidence.py \
            docs/.fixlist-full-url-evidence-trigger
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show all affected URLs and clarify FixList steps"
          git push origin HEAD:feature/fixlist-full-url-evidence
