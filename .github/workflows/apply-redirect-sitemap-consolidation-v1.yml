''' + scanner[grouping_end:]

          group_start = scanner.index("def group_findings(findings: list[dict]) -> list[dict]:\n")
          group_end = scanner.index("\n\ndef _unique_nonempty", group_start)
          scanner = scanner[:group_start] + '''def group_findings(findings: list[dict]) -> list[dict]:
    direct: list[dict] = []
    groups: dict[str, list[dict]] = {}
    for finding in findings:
        key = grouping_key(finding)
        if not key:
            direct.append(finding)
            continue
        groups.setdefault(key, []).append(finding)

    for key, members in groups.items():
        affected = _unique_nonempty([p for f in members for p in (f.get("affected_pages") or [f.get("page_url")])])[:150]
        # Only collapse when multiple pages share the exact same remediation rule.
        if len(affected) < GROUP_MIN_AFFECTED:
            direct.extend(members)
            continue

        sample = members[0]
        rule = str(sample.get("rule") or "")
        pages_by_family: dict[str, list[str]] = {}
        for page in affected:
            family_name = classify_template(page)
            pages_by_family.setdefault(family_name, []).append(page)
        family_breakdown = {family_name: len(values) for family_name, values in pages_by_family.items()}
        representative_pages_by_family = {
            family_name: values[:3] for family_name, values in pages_by_family.items()
        }
        family_count = len(pages_by_family)
        cross_family = is_cross_family_rule(rule) and family_count > 1
        family = "mixed" if cross_family else classify_template(sample.get("page_url") or affected[0])
        blocked = key.startswith("failure|rate_limited_page") or rule == "rate_limited_page"
        if blocked:
            title = "Check pages blocked by rate limiting"
            explanation = "Several similar pages returned HTTP 429 or rate limiting. Treat this as one crawler-access problem."
            recommendation = "Ask your web person to check server, CDN, firewall, and rate-limit logs. Confirm Googlebot and normal users can access the affected URLs."
        else:
            title = group_template_title(rule, family)
            specific_copy = consolidation_copy(rule)
            explanation = specific_copy.get(
                "explanation",
                "Several similar pages have the same template-level issue. Fix the shared template or pattern instead of creating one task per page.",
            )
            recommendation = specific_copy.get(
                "recommendation",
                "Fix one representative page/template first, then roll out the same rule across the affected group.",
            )
        group_id = stable_id(f"group|{key}")
        grouped = dict(sample)
        grouped.update({
            "id": group_id,
            "fix_id": group_id,
            "page_url": "",
            "title": title,
            "issue_title": title,
            "plain_english_explanation": explanation,
            "plain_english_summary": explanation,
            "why_it_matters": explanation,
            "recommended_value": recommendation,
            "recommendation": recommendation,
            "ai_recommendation": recommendation,
            "current_value": (
                f"{len(affected)} affected URLs across {family_count} page families."
                if is_cross_family_rule(rule)
                else sample.get("current_value", "")
            ),
            "priority": "high" if blocked else ("medium" if sample.get("priority") == "high" else sample.get("priority")),
            "difficulty": "developer" if blocked else sample.get("difficulty"),
            "requires_developer": blocked or sample.get("requires_developer", False),
            "who_can_do_this": "your_web_person" if (blocked or sample.get("requires_developer")) else sample.get("who_can_do_this"),
            "affected_pages": affected,
            "page_count": len(affected),
            "page_template_family": family,
            "page_scope": "cross_family" if cross_family else "template",
            "family_count": family_count,
            "family_breakdown": dict(sorted(family_breakdown.items())),
            "representative_pages_by_family": dict(sorted(representative_pages_by_family.items())),
            "finding_consolidation_version": FINDING_CONSOLIDATION_VERSION,
            "source_pages": _unique_nonempty([p for f in members for p in (f.get("source_pages") or [])]),
            "link_text_samples": _unique_nonempty([t for f in members for t in (f.get("link_text_samples") or [])]),
        })
        direct.append(grouped)
    return direct
''' + scanner[group_end:]
          scanner_path.write_text(scanner, encoding="utf-8")

          post_path = ROOT / "scanner-api/app/indexability_postprocess.py"
