name: FixList Cloud Operator

# Keyless GCP operations for the durable Standard 150 release.
# This exact workflow path is pinned by the Google WIF provider condition.
# Protected key-sync trigger: 2026-08-13T13:20Z
# Read-only reconciler diagnostic trigger: 2026-08-17T16:12Z
# Read-only reconciler diagnostic rerun: 2026-08-17T16:38Z

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Allowlisted Google Cloud operation"
        required: true
        type: choice
        options:
          - status
          - verify-iam
          - verify-worker-routes
          - deploy-dispatch-gateway
          - deploy-admission-coordinator
          - build-worker-candidate
          - promote-worker
          - rollback-worker
          - pause-queue
          - resume-queue
          - activate-beta
          - sync-base44-signing-key
      revision:
        description: "Exact Cloud Run revision for promote/rollback/activate. Prefilled for the currently verified Standard 150 worker candidate."
        required: false
        default: "fixlist-standard150-worker-00011-v7m"
        type: string
      confirm:
        description: "Mutations require exact confirmation. Prefilled for the currently verified Standard 150 worker candidate."
        required: true
        default: "fixlist-standard150-worker-00011-v7m"
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fixlist-cloud-operator.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: fixlist-cloud-operator
  cancel-in-progress: false

env:
  GCP_PROJECT: seo-autopilot-501517
  GCP_REGION: europe-west1
  GCP_WIF_PROVIDER: projects/919035207432/locations/global/workloadIdentityPools/github/providers/github-actions
  GCP_OPERATOR_SERVICE_ACCOUNT: fixlist-github-operator@seo-autopilot-501517.iam.gserviceaccount.com
  CLOUD_RUN_SERVICE: fixlist-standard150-worker
  CLOUD_TASKS_QUEUE: fixlist-standard150
  TASKS_INVOKER_SERVICE_ACCOUNT: fixlist-standard150-invoker@seo-autopilot-501517.iam.gserviceaccount.com
  GATEWAY_SERVICE: fixlist-dispatch-gateway
  GATEWAY_RUNTIME_SERVICE_ACCOUNT: fixlist-base44-dispatcher@seo-autopilot-501517.iam.gserviceaccount.com
  RELEASE_OPERATOR_SERVICE_ACCOUNT: fixlist-release-operator@seo-autopilot-501517.iam.gserviceaccount.com
  CLOUD_TASKS_DRAIN_QUEUE: fixlist-standard150-drain
  ADMISSION_COORDINATOR_SERVICE: fixlist-scan-admission-coordinator
  ADMISSION_COORDINATOR_RUNTIME_SA: fixlist-admission-coordinator@seo-autopilot-501517.iam.gserviceaccount.com
  FIRESTORE_DATABASE: fixlist-admission

jobs:
  operate:
    if: github.event_name == 'workflow_dispatch'
    name: ${{ inputs.operation }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse to run outside main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "The Cloud Operator runs only from refs/heads/main. Got: ${{ github.ref }}" >&2
          exit 2

      - name: Checkout exact dispatched commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate canonical gateway before deployment
        if: inputs.operation == 'deploy-dispatch-gateway'
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/deploy_dispatch_gateway.sh
          node --check base44/functions/startStandardScanJob/cloudTasks.js
          python -m pip install -r dispatch-gateway/requirements.txt
          (cd dispatch-gateway && python -m unittest -v test_gateway.py)
          python -m py_compile dispatch-gateway/main.py dispatch-gateway/test_gateway.py
          node --test tests/frontend/dispatchGatewayContract.test.mjs

      - name: Validate admission coordinator before deployment
        if: inputs.operation == 'deploy-admission-coordinator'
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/deploy_admission_coordinator.sh
          python -m pip install -r admission-coordinator/requirements.txt pytest
          PYTHONPATH=admission-coordinator python -m pytest -q admission-coordinator

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_OPERATOR_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Validate worker candidate build path
        if: inputs.operation == 'build-worker-candidate'
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-worker-candidate.sh
          bash -n scripts/lib/release-source-guard.sh

      - name: Run allowlisted worker operation
        if: inputs.operation != 'deploy-dispatch-gateway' && inputs.operation != 'deploy-admission-coordinator' && inputs.operation != 'build-worker-candidate'
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRM: ${{ inputs.confirm }}
          TARGET_REVISION: ${{ inputs.revision }}
        shell: bash
        run: bash ./scripts/fixlist-cloud-operator.sh

      - name: Build isolated Standard 150 worker candidate
        if: inputs.operation == 'build-worker-candidate'
        env:
          CONFIRM: ${{ inputs.confirm }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: ./scripts/build-worker-candidate.sh

      - name: Deploy canonical dispatch gateway
        if: inputs.operation == 'deploy-dispatch-gateway'
        env:
          CONFIRM: ${{ inputs.confirm }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: ./scripts/deploy_dispatch_gateway.sh

      - name: Deploy admission coordinator
        if: inputs.operation == 'deploy-admission-coordinator'
        env:
          CONFIRM: ${{ inputs.confirm }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: ./scripts/deploy_admission_coordinator.sh

  readonly-diagnostic:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[cloud-readonly-diagnostic]')
    name: Read-only release diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_OPERATOR_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Inspect FixList release surface without mutation
        shell: bash
        run: |
          set +e
          echo '=== AUTH ==='
          gcloud auth list --filter=status:ACTIVE --format='value(account)'

          echo '=== WORKER ==='
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT" --region="$GCP_REGION" --format='yaml(metadata.name,status.url,status.latestReadyRevisionName,status.latestCreatedRevisionName,status.traffic,spec.template.spec.serviceAccountName,spec.template.spec.timeoutSeconds)'
          echo "worker_exit=$?"

          echo '=== GATEWAY ==='
          gcloud run services describe "$GATEWAY_SERVICE" --project="$GCP_PROJECT" --region="$GCP_REGION" --format='yaml(metadata.name,status.url,status.latestReadyRevisionName,status.latestCreatedRevisionName,status.traffic,spec.template.spec.serviceAccountName)'
          echo "gateway_exit=$?"

          echo '=== QUEUE ==='
          gcloud tasks queues describe "$CLOUD_TASKS_QUEUE" --project="$GCP_PROJECT" --location="$GCP_REGION" --format='yaml(name,state,rateLimits,retryConfig)'
          echo "queue_exit=$?"

          echo '=== DRAIN QUEUE ==='
          gcloud tasks queues describe "$CLOUD_TASKS_DRAIN_QUEUE" --project="$GCP_PROJECT" --location="$GCP_REGION" --format='yaml(name,state,rateLimits,retryConfig)'
          echo "drain_queue_exit=$?"

          echo '=== RECONCILER ==='
          gcloud scheduler jobs describe fixlist-standard150-reconcile \
            --project="$GCP_PROJECT" --location="$GCP_REGION" \
            --format='yaml(name,state,schedule,httpTarget.uri,httpTarget.httpMethod,httpTarget.oidcToken.serviceAccountEmail,httpTarget.oidcToken.audience)'
          echo "reconciler_exit=$?"

          echo '=== SIGNING SECRET ACCESS CHECK ==='
          TMP_DIR="$(mktemp -d)"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT" --region="$GCP_REGION" --format=json > "$TMP_DIR/worker.json"
          read -r SECRET_NAME SECRET_VERSION < <(python3 - "$TMP_DIR/worker.json" <<'PY'
          import json, sys
          value=json.load(open(sys.argv[1]))
          envs=value.get('spec',{}).get('template',{}).get('spec',{}).get('containers',[{}])[0].get('env',[])
          for item in envs:
              if item.get('name')=='SCAN_EVIDENCE_SIGNING_KEY':
                  ref=item.get('valueFrom',{}).get('secretKeyRef',{})
                  print(ref.get('name',''), ref.get('key',''))
                  break
          PY
          )
          # Payload goes to /dev/null: this check proves the operator CAN read the
          # secret, and nothing downstream consumes the value. Writing it to the
          # runner filesystem would put plaintext on disk for no benefit.
          if [ -n "$SECRET_NAME" ] && [ -n "$SECRET_VERSION" ] && gcloud secrets versions access "$SECRET_VERSION" --secret="$SECRET_NAME" --project="$GCP_PROJECT" > /dev/null 2>"$TMP_DIR/secret.err"; then
            # Report reachability ONLY. Neither the byte length nor a digest of
            # the signing key may reach a workflow log: Actions logs persist and
            # are readable by anyone with repository access, GitHub's secret
            # masking does not cover values derived at runtime, and a stable
            # fingerprint of the HMAC key is a permanent offline oracle over the
            # value the entire authority-seal model rests on.
            echo 'secret_access=YES'
          else
            echo 'secret_access=NO'
            sed -n '1,4p' "$TMP_DIR/secret.err"
          fi
          rm -rf "$TMP_DIR"

          echo '=== GATEWAY HEALTH ==='
          GATEWAY_URL="$(gcloud run services describe "$GATEWAY_SERVICE" --project="$GCP_PROJECT" --region="$GCP_REGION" --format='value(status.url)' 2>/dev/null)"
          if [ -n "$GATEWAY_URL" ]; then
            curl --silent --show-error --max-time 20 "$GATEWAY_URL/health" || true
            echo
          fi

          echo 'READONLY_DIAGNOSTIC_COMPLETE'

  sync-base44-signing-key:
    # Reading the signing key and transmitting it to an external service is a
    # mutation, not a diagnostic. A commit-message trigger let any push to main
    # carrying a magic string cause it. It is now workflow_dispatch-only and
    # requires the same exact confirmation the promote/rollback path uses, so
    # the operator states intent per invocation.
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.operation == 'sync-base44-signing-key'
      && github.event.inputs.confirm == 'SYNC-SIGNING-KEY'
    name: Synchronize Base44 signing key
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_OPERATOR_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Run protected GCP-to-Base44 key synchronization
        shell: bash
        run: bash scripts/sync-base44-signing-key.sh

  capacity-verify-once:
    # One-shot binary verification for the 2026-08-17 Standard 150 capacity repair.
    # Remove after the resulting push run is inspected.
    if: github.event_name == 'push'
    name: Verify Standard 150 bounded concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_OPERATOR_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Require three-way queue capacity and horizontal worker scaling
        shell: bash
        run: |
          set -euo pipefail
          Q="$(mktemp)"; W="$(mktemp)"; trap 'rm -f "$Q" "$W"' EXIT
          gcloud tasks queues describe "$CLOUD_TASKS_QUEUE" --location="$GCP_REGION" --project="$GCP_PROJECT" --format=json > "$Q"
          gcloud run services describe "$CLOUD_RUN_SERVICE" --region="$GCP_REGION" --project="$GCP_PROJECT" --format=json > "$W"
          python3 - "$Q" "$W" <<'PY2'
          import json,sys
          q=json.load(open(sys.argv[1])); w=json.load(open(sys.argv[2]))
          rate=q.get('rateLimits') or {}
          assert str(q.get('state') or '') == 'RUNNING', q.get('state')
          assert int(rate.get('maxConcurrentDispatches') or 0) == 3, rate
          assert float(rate.get('maxDispatchesPerSecond') or 0) == 3.0, rate
          template=(w.get('spec') or {}).get('template') or {}
          spec=template.get('spec') or {}
          assert int(spec.get('containerConcurrency') or 0) == 1, spec.get('containerConcurrency')
          max_scale=((template.get('metadata') or {}).get('annotations') or {}).get('autoscaling.knative.dev/maxScale')
          assert max_scale is None or int(max_scale) >= 3, max_scale
          traffic=(w.get('status') or {}).get('traffic') or []
          assert any(str(t.get('revisionName') or '') == 'fixlist-standard150-worker-00011-v7m' and int(t.get('percent') or 0) == 100 for t in traffic), traffic
          print('STANDARD150_CAPACITY_VERIFIED concurrency=3 worker_request_concurrency=1')
          PY2

  # queued-watchdog candidate retry after shallow-main source-guard fix
  build-queued-watchdog-candidate-once:
    # Single-use zero-traffic build for the queued-admission watchdog fix.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[build-worker-candidate]')
    name: Build queued-watchdog worker candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate queued watchdog fix
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r scanner-api/requirements.txt pytest
          python -m pytest -q scanner-api/tests/test_queue_safe_worker_lifecycle.py
          node --test tests/frontend/attemptBoundRetrySafety.test.mjs tests/frontend/drainQueuePolicyContract.test.mjs
          bash -n scripts/build-worker-candidate.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_OPERATOR_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Build exact-SHA zero-traffic candidate
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          CONFIRM: ${{ github.sha }}
        run: bash scripts/build-worker-candidate.sh
