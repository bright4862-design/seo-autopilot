name: FixList Cloud Operator

# Keyless GCP operations for the durable Standard 150 release.
#
# Authentication is Workload Identity Federation: no service-account key
# exists. The WIF provider MUST pin the immutable repository/owner IDs,
# refs/heads/main, and this exact workflow_ref -- see
# docs/fixlist-cloud-operator.md. The guard below is defense in depth.
#
# The provider resource name and operator service-account email are identifiers,
# not credentials, so they are pinned here instead of being stored as GitHub
# secrets. The only credential is the short-lived token minted by WIF per run.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Allowlisted Google Cloud operation"
        required: true
        type: choice
        options:
          - status
          - verify-iam
          - verify-worker-routes
          - promote-worker
          - rollback-worker
          - pause-queue
          - resume-queue
          - activate-beta
      revision:
        description: "Exact Cloud Run revision for promote/rollback/activate (e.g. fixlist-standard150-worker-00003-abc)"
        required: false
        type: string
      confirm:
        description: "Mutations require confirmation. PAUSE / RESUME for the queue; the exact revision name for promote, rollback, and activate."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: fixlist-cloud-operator
  cancel-in-progress: false

env:
  GCP_PROJECT: seo-autopilot-501517
  GCP_REGION: europe-west1
  GCP_WIF_PROVIDER: projects/919035207432/locations/global/workloadIdentityPools/github/providers/github-actions
  GCP_OPERATOR_SERVICE_ACCOUNT: fixlist-github-operator@seo-autopilot-501517.iam.gserviceaccount.com
  CLOUD_RUN_SERVICE: fixlist-standard150-worker
  CLOUD_TASKS_QUEUE: fixlist-standard150
  TASKS_INVOKER_SERVICE_ACCOUNT: fixlist-standard150-invoker@seo-autopilot-501517.iam.gserviceaccount.com

jobs:
  operate:
    name: ${{ inputs.operation }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Refuse to run outside main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "The Cloud Operator runs only from refs/heads/main. Got: ${{ github.ref }}" >&2
          exit 2

      # workflow_dispatch records the exact commit in github.sha. Checking out
      # that SHA prevents main moving between authorization and execution from
      # swapping the operator script underneath an approved run.
      - name: Checkout exact dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_OPERATOR_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Run allowlisted operation
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRM: ${{ inputs.confirm }}
          TARGET_REVISION: ${{ inputs.revision }}
        shell: bash
        run: ./scripts/fixlist-cloud-operator.sh
