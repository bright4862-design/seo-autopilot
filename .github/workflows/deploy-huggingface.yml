name: Deploy FixList AI to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "hf-space/**"
      - ".github/workflows/deploy-huggingface.yml"
  workflow_dispatch:

concurrency:
  group: deploy-fixlist-ai-hugging-face
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Space bundle
        run: |
          test -f hf-space/app.py
          test -f hf-space/app_redesign.py
          test -f hf-space/Dockerfile
          test -f hf-space/requirements.txt

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Exchange GitHub OIDC token
        env:
          HF_OIDC_RESOURCE: spaces/milo2455555/fixlist-ai
        run: |
          HF_TOKEN="$("$HOME/.hf-cli/venv/bin/python" - <<'PY'
          from huggingface_hub import get_token

          token = get_token()
          if not token:
              raise SystemExit("Hugging Face OIDC did not return a token.")
          print(token)
          PY
          )"
          echo "::add-mask::$HF_TOKEN"
          echo "HF_TOKEN=$HF_TOKEN" >> "$GITHUB_ENV"

      - name: Verify Hugging Face authentication
        run: hf auth whoami

      - name: Deploy Docker Space
        run: |
          hf upload milo2455555/fixlist-ai ./hf-space . \
            --repo-type space \
            --delete "*" \
            --commit-message "Deploy ${GITHUB_SHA::7} from GitHub"
