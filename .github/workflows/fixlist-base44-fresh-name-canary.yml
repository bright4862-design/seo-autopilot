name: FixList Base44 Fresh-Name Runtime Canary

# One-shot diagnostic for the Base44 stale-runtime incident. Each run derives
# an unpredictable never-used function name, proves the stored package and live
# route both carry the exact dispatch SHA, and deliberately leaves that unique
# name in place as evidence. No customer route is deleted, reused, or changed.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Exact current main SHA. Must equal the canary source SHA."
        required: true
        type: string
      action_confirm:
        description: "Exact one-shot canary confirmation from the release runbook."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fixlist-base44-hosted-controls-v2
  cancel-in-progress: false

jobs:
  fresh-name-runtime-canary:
    if: >-
      github.actor == 'bright4862-design' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    environment: fixlist-production-owner
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact clean main source
        shell: /bin/bash {0}
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git rev-parse origin/main)" = "$SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          /bin/bash -n scripts/authenticate-base44-owner-session.sh
          /bin/bash -n scripts/lib/base44-pinned-cli.sh

      - name: Resolve exact canary confirmation
        id: confirm
        shell: /bin/bash {0}
        env:
          INPUT_CONFIRM: ${{ inputs.confirm }}
          INPUT_ACTION_CONFIRM: ${{ inputs.action_confirm }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$INPUT_CONFIRM" = "$source_sha"
          test "$INPUT_ACTION_CONFIRM" = "DEPLOY-FRESH-BASE44-RUNTIME-CANARY"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Set up pinned Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.5'

      - name: Authenticate Base44 owner with ephemeral device code
        shell: /bin/bash {0}
        env:
          BASE44_EXPECTED_OWNER: ${{ secrets.BASE44_EXPECTED_OWNER }}
        run: /bin/bash scripts/authenticate-base44-owner-session.sh

      - name: Deploy never-used canary name and prove exact runtime source
        shell: /bin/bash {0}
        env:
          SOURCE_SHA: ${{ github.sha }}
          BASE44_EXPECTED_OWNER: ${{ secrets.BASE44_EXPECTED_OWNER }}
          CANARY_PREFIX: fixlistRuntimeActivationProbe
          BASE44_APP_ID: 6a498732ec779dfaaeab0e53
          BASE44_FUNCTION_ORIGIN: https://base44.app
        run: |
          set -euo pipefail
          source scripts/lib/base44-pinned-cli.sh

          CLI_TMP="$(mktemp -d)"
          WORK_TMP="$(mktemp -d)"
          VERIFY_TMP="$(mktemp -d)"
          cleanup() {
            rm -rf "$CLI_TMP" "$WORK_TMP" "$VERIFY_TMP"
          }
          trap cleanup EXIT

          fixlist_install_base44_cli "$CLI_TMP"
          fixlist_require_base44_owner "$BASE44_EXPECTED_OWNER" "$CLI_TMP/whoami" "$BASE44_APP_ID"

          # Base44's pinned CLI has update semantics for a named deploy and no
          # create-only flag. Make the target unknowable before this serialized
          # run starts, then prove the exact stored source after deployment.
          nonce="$(openssl rand -hex 8)"
          CANARY_NAME="${CANARY_PREFIX}${GITHUB_RUN_ID}${nonce}"
          PROBE_ID="base44-fresh-name-${GITHUB_RUN_ID}-${nonce}"

          if ! [[ "$CANARY_NAME" =~ ^[A-Za-z][A-Za-z0-9]{1,62}$ ]]; then
            echo "Refusing fresh-name canary: generated name is invalid." >&2
            exit 2
          fi

          strip_ansi() { sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g'; }
          inventory="$("$FIXLIST_BASE44_CLI" --app-id "$BASE44_APP_ID" functions list 2>&1 | strip_ansi)"
          if grep -Eq "(^|[[:space:]])${CANARY_NAME}([[:space:]]|$)" <<<"$inventory"; then
            echo "Refusing fresh-name canary: $CANARY_NAME already exists." >&2
            exit 2
          fi

          CANARY_ROOT="$WORK_TMP/base44/functions/$CANARY_NAME"
          mkdir -p "$CANARY_ROOT"
          cat > "$CANARY_ROOT/function.jsonc" <<JSON
          {
            "name": "$CANARY_NAME",
            "entry": "entry.ts"
          }
          JSON
          cat > "$CANARY_ROOT/entry.ts" <<TS
          const source_sha = "${SOURCE_SHA}";
          const probe_id = "${PROBE_ID}";
          Deno.serve(() => Response.json({ ok: true, source_sha, probe_id }));
          TS

          cd "$WORK_TMP"
          "$FIXLIST_BASE44_CLI" --app-id "$BASE44_APP_ID" functions deploy "$CANARY_NAME"

          inventory="$("$FIXLIST_BASE44_CLI" --app-id "$BASE44_APP_ID" functions list 2>&1 | strip_ansi)"
          if ! grep -Eq "(^|[[:space:]])${CANARY_NAME}([[:space:]]|$)" <<<"$inventory"; then
            echo "Refusing fresh-name canary: $CANARY_NAME is missing after deploy." >&2
            exit 1
          fi

          # Read the server-stored package back into a clean workspace. Runtime
          # proof is accepted only if Base44 stored exactly the entry.ts we sent.
          mkdir -p "$VERIFY_TMP/base44"
          cp "$GITHUB_WORKSPACE/base44/config.jsonc" "$VERIFY_TMP/base44/config.jsonc"
          cd "$VERIFY_TMP"
          "$FIXLIST_BASE44_CLI" --app-id "$BASE44_APP_ID" functions pull "$CANARY_NAME"
          pulled_entry="$VERIFY_TMP/base44/functions/$CANARY_NAME/entry.ts"
          if [[ ! -f "$pulled_entry" ]] || ! cmp -s "$CANARY_ROOT/entry.ts" "$pulled_entry"; then
            echo "Refusing fresh-name canary: pulled remote package does not match generated source." >&2
            exit 1
          fi

          probe_url="$BASE44_FUNCTION_ORIGIN/api/apps/$BASE44_APP_ID/functions/$CANARY_NAME"
          verified=""
          for attempt in 1 2 3 4 5 6; do
            body_file="$(mktemp)"
            status="$(curl -sS -o "$body_file" -w '%{http_code}' --max-time 25 "$probe_url" 2>/dev/null || echo 000)"
            if [[ "$status" == "200" ]] && python3 - "$body_file" "$SOURCE_SHA" "$PROBE_ID" <<'PY'
          import json, sys
          body = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_sha, expected_probe = sys.argv[2], sys.argv[3]
          if body.get("ok") is not True:
              raise SystemExit(1)
          if body.get("source_sha") != expected_sha:
              raise SystemExit(1)
          if body.get("probe_id") != expected_probe:
              raise SystemExit(1)
          PY
            then
              verified=1
              rm -f "$body_file"
              break
            fi
            rm -f "$body_file"
            sleep 5
          done

          if [[ -z "$verified" ]]; then
            echo "Fresh-name canary deployed but did not serve the exact dispatch SHA." >&2
            exit 1
          fi

          printf 'BASE44_FRESH_NAME_RUNTIME_VERIFIED\nsource_sha=%s\nprobe_id=%s\ncanary_name=%s\n' \
            "$SOURCE_SHA" "$PROBE_ID" "$CANARY_NAME"

      - name: Remove ephemeral Base44 owner session
        if: ${{ always() }}
        shell: /bin/bash {0}
        run: rm -rf "$HOME/.base44"
