name: Run final correctness patch v3

on:
  push:
    paths:
      - .github/workflows/run-final-correctness-patch-v3.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Apply patches
        id: patch
        continue-on-error: true
        run: |
          set -o pipefail
          { python .github/scripts/fix_literal_replacements.py; python .github/scripts/fix_group_title_boundary.py; python .github/scripts/patch_backend_correctness.py; python .github/scripts/patch_scan_storage.py; python .github/scripts/patch_fixlist_zero_state.py; } 2>&1 | tee /tmp/patch.log
      - name: Backend tests
        id: backend
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pip install -q -r scanner-api/requirements.txt
          (cd scanner-api && pytest -q) 2>&1 | tee /tmp/backend.log
      - name: Frontend checks
        id: frontend
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm ci --silent
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          npm run build 2>&1 | tee /tmp/build.log
      - name: Commit tested patch
        if: steps.patch.outcome == 'success' && steps.backend.outcome == 'success' && steps.frontend.outcome == 'success'
        run: |
          rm -f .github/workflows/run-final-correctness-patch-v3.yml .github/scripts/patch_backend_correctness.py .github/scripts/patch_scan_storage.py .github/scripts/patch_fixlist_zero_state.py .github/scripts/fix_literal_replacements.py .github/scripts/fix_group_title_boundary.py
          rm -f diagnostics/ui-zero-fix.txt diagnostics/final-patch-failure.txt diagnostics/final-patch-failure-v2.txt
          rmdir diagnostics 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix zero-fix UI and Pretto classification"
          git push origin HEAD:main
      - name: Commit diagnostics
        if: steps.patch.outcome != 'success' || steps.backend.outcome == 'failure' || steps.frontend.outcome == 'failure'
        run: |
          mkdir -p diagnostics
          { echo "patch=${{ steps.patch.outcome }} backend=${{ steps.backend.outcome }} frontend=${{ steps.frontend.outcome }}"; cat /tmp/patch.log /tmp/backend.log /tmp/typecheck.log /tmp/build.log 2>/dev/null || true; } > diagnostics/final-patch-failure-v3.txt
          rm -f .github/workflows/run-final-correctness-patch-v3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/final-patch-failure-v3.txt .github/workflows/run-final-correctness-patch-v3.yml
          git commit -m "Capture final patch v3 failure"
          git push origin HEAD:main
