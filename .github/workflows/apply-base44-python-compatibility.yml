name: Apply Base44 Python compatibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-test-clean:
    if: github.head_ref == 'agent/update-base44-python-compatibility'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/update-base44-python-compatibility
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Apply compatibility patch
        run: python .github/patches/apply-base44-python-compatibility.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend contract tests
        run: npm run test:frontend

      - name: Production build
        run: npm run build

      - name: Commit product changes
        run: |
          git add base44/functions/aiReviewScan/entry.ts tests/frontend/base44-python-compatibility.test.mjs
          git commit -m 'Update Base44 Python compatibility markers'

      - name: Remove temporary patch machinery
        run: |
          rm -f .github/patches/apply-base44-python-compatibility.py
          rm -f .github/workflows/apply-base44-python-compatibility.yml
          git add -A
          git commit -m 'Remove temporary Base44 compatibility machinery'

      - name: Verify final scope
        run: |
          git diff --check origin/main...HEAD
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          test -z "$(echo "$changed" | grep '^\.github/' || true)"
          echo "$changed" | grep -qx 'base44/functions/aiReviewScan/entry.ts'
          echo "$changed" | grep -qx 'tests/frontend/base44-python-compatibility.test.mjs'
          test "$(echo "$changed" | wc -l | tr -d ' ')" = '2'

      - name: Push verified branch
        run: git push origin HEAD:agent/update-base44-python-compatibility
