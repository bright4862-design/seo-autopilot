name: Apply Funbooker accuracy patch

on:
  push:
    branches:
      - agent/fix-funbooker-accuracy-regressions
    paths:
      - data/funbooker-accuracy-patch-trigger

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-funbooker-accuracy-regressions
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner-api/requirements.txt

      - name: Install scanner dependencies
        run: python -m pip install -r scanner-api/requirements.txt

      - name: Apply patch
        run: python scripts/apply_funbooker_accuracy_patch.py

      - name: Run focused regressions
        working-directory: scanner-api
        run: python -m pytest tests/test_redirect_evidence.py tests/test_review_calibration.py -q

      - name: Run complete scanner suite
        working-directory: scanner-api
        run: python -m pytest -q

      - name: Remove temporary patch machinery
        run: |
          rm -f scripts/apply_funbooker_accuracy_patch.py
          rm -f .github/workflows/apply-funbooker-accuracy-patch.yml
          rm -f data/funbooker-accuracy-patch-trigger

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner-api/app/review_calibration.py \
                  scanner-api/app/redirect_validation.py \
                  scanner-api/tests/test_review_calibration.py \
                  scanner-api/tests/test_redirect_evidence.py \
                  scripts/apply_funbooker_accuracy_patch.py \
                  .github/workflows/apply-funbooker-accuracy-patch.yml \
                  data/funbooker-accuracy-patch-trigger
          git commit -m "Fix sampled verification and trailing slash redirects"
          git push origin HEAD:agent/fix-funbooker-accuracy-regressions
