name: Apply grouped recommendation evidence patch

on:
  pull_request:
    branches:
      - agent/persist-authoritative-browser-record
    types:
      - opened
      - reopened

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Harden applicator locators
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/apply_grouped_recommendation_evidence.py")
          text = path.read_text(encoding="utf-8")

          old_group_locator = "replace_once(review_path, old_grouping, new_grouping)"
          new_group_locator = '''target = Path(review_path)
          review_text = target.read_text(encoding="utf-8")
          start_marker = "def build_page_pattern_findings(pages: list[dict[str, Any]]) -> list[dict[str, Any]]:"
          end_marker = "\\ndef build_strategic_findings"
          start_index = review_text.index(start_marker)
          end_index = review_text.index(end_marker, start_index)
          target.write_text(
              review_text[:start_index] + new_grouping.rstrip() + "\\n\\n" + review_text[end_index + 1:],
              encoding="utf-8",
          )'''
          if text.count(old_group_locator) != 1:
              raise SystemExit(f"expected one grouping locator, found {text.count(old_group_locator)}")
          text = text.replace(old_group_locator, new_group_locator, 1)

          old_response_locator = '''replace_once(
              review_path,
              ''' + "'''" + '''        "scoring_model": SCORING_MODEL,
              }''' + "'''" + ''',
              ''' + "'''" + '''        "scoring_model": SCORING_MODEL,
                  "grouped_recommendation_evidence_version": GROUPED_RECOMMENDATION_EVIDENCE_VERSION,
              }''' + "'''" + ''',
          )'''
          new_response_locator = '''target = Path(review_path)
          review_text = target.read_text(encoding="utf-8")
          response_anchor = '        "scoring_model": SCORING_MODEL,\\n'
          response_count = review_text.count(response_anchor)
          if response_count < 1:
              raise SystemExit("review response scoring_model anchor not found")
          target.write_text(
              review_text.replace(
                  response_anchor,
                  response_anchor + '        "grouped_recommendation_evidence_version": GROUPED_RECOMMENDATION_EVIDENCE_VERSION,\\n',
              ),
              encoding="utf-8",
          )'''
          if text.count(old_response_locator) != 1:
              raise SystemExit(f"expected one review response locator, found {text.count(old_response_locator)}")
          text = text.replace(old_response_locator, new_response_locator, 1)

          unsafe_recommendation = '        "recommendation": "Output one valid meta name=\\"description\\" element with a non-empty content value.",'
          safe_recommendation = '        "recommendation": \'Output one valid meta name="description" element with a non-empty content value.\','
          if text.count(unsafe_recommendation) != 1:
              raise SystemExit(f"expected one escaped recommendation, found {text.count(unsafe_recommendation)}")
          path.write_text(text.replace(unsafe_recommendation, safe_recommendation, 1), encoding="utf-8")
          PY

      - name: Apply scoped patch
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/apply_grouped_recommendation_evidence.py 2>&1 | tee grouped-evidence-apply-output.txt

      - name: Upload applicator failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: grouped-evidence-apply-output
          path: grouped-evidence-apply-output.txt
          if-no-files-found: error

      - name: Update legacy metadata grouping contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scanner-api/tests/test_metadata_title_evidence_v9.py")
          text = path.read_text(encoding="utf-8")
          old = '''def test_scanner_and_review_emit_separate_absent_empty_and_malformed_rules():
              missing = extracted("<html><head><title>Missing</title></head><body><h1>Page</h1></body></html>", "https://example.com/missing")
              empty = extracted('<html><head><title>Empty</title><meta name="description" content=""></head><body><h1>Page</h1></body></html>', "https://example.com/empty")
              malformed = extracted('<html><head><title>Malformed</title><meta name="description"></head><body><h1>Page</h1></body></html>', "https://example.com/malformed")

              scanner_rules = {item["rule"] for item in build_findings([missing, empty, malformed])}
              review_rules = {item["rule"] for item in build_page_pattern_findings([missing, empty, malformed])}

              assert DESCRIPTION_RULES <= scanner_rules
              assert DESCRIPTION_RULES <= review_rules
          '''
          new = '''def test_scanner_preserves_description_states_and_review_combines_the_family_task():
              missing = extracted("<html><head><title>Missing</title></head><body><h1>Page</h1></body></html>", "https://example.com/missing")
              empty = extracted('<html><head><title>Empty</title><meta name="description" content=""></head><body><h1>Page</h1></body></html>', "https://example.com/empty")
              malformed = extracted('<html><head><title>Malformed</title><meta name="description"></head><body><h1>Page</h1></body></html>', "https://example.com/malformed")

              scanner_rules = {item["rule"] for item in build_findings([missing, empty, malformed])}
              review_fixes = [
                  item for item in build_page_pattern_findings([missing, empty, malformed])
                  if item.get("category") == "meta_description"
              ]

              assert DESCRIPTION_RULES <= scanner_rules
              assert len(review_fixes) == 1
              [review_fix] = review_fixes
              assert review_fix["rule"] == "meta_description_unusable"
              assert review_fix["combined_rules"] == [
                  "missing_meta_description",
                  "empty_meta_description",
                  "malformed_meta_description",
              ]
              assert review_fix["metadata_state_counts"] == {"missing": 1, "empty": 1, "malformed": 1}
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one legacy metadata grouping test, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install Python dependencies
        run: python -m pip install -r scanner-api/requirements.txt

      - name: Test grouped metadata evidence
        shell: bash
        env:
          PYTHONPATH: scanner-api
        run: |
          set -o pipefail
          pytest -q scanner-api/tests/test_grouped_metadata_evidence.py 2>&1 | tee grouped-metadata-test-output.txt

      - name: Upload grouped metadata test failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: grouped-metadata-test-output
          path: grouped-metadata-test-output.txt
          if-no-files-found: error

      - name: Run scanner API regression suite
        shell: bash
        env:
          PYTHONPATH: scanner-api
        run: |
          set -o pipefail
          pytest -q scanner-api/tests 2>&1 | tee scanner-regression-output.txt

      - name: Upload scanner regression failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-regression-output
          path: scanner-regression-output.txt
          if-no-files-found: error

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend contract tests
        run: npm run test:frontend

      - name: Build production frontend
        run: npm run build

      - name: Commit direct patch and remove temporary applicators
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/scripts/apply_grouped_recommendation_evidence.py \
            .github/workflows/inspect-grouped-evidence-on-pr.yml
          git add \
            scanner-api/app/review.py \
            scanner-api/app/beta_revision.py \
            scanner-api/tests/test_grouped_metadata_evidence.py \
            scanner-api/tests/test_metadata_title_evidence_v9.py \
            scanner-api/tests/test_observability.py \
            base44/entities/FixItem.jsonc \
            src/lib/scanRunModel.js \
            tests/frontend/metaDescriptionGuidance.test.mjs \
            tests/frontend/scanRunPersistence.test.mjs \
            tests/frontend/releaseAuthorityGate.test.mjs \
            data/beta-crawler-revision.json \
            docs/releases/grouped-recommendation-evidence-v1.md
          git commit -m "Persist grouped recommendation evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
