name: B25 accelerated paired gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/b25-accelerated-gate.yml"
      - "scripts/b25_capture_pair.py"

permissions:
  contents: read

concurrency:
  group: b25-accelerated-gate-3fa6b7ca
  cancel-in-progress: false

env:
  BASELINE_SHA: 2ad64dc55ccc49d8fba4259f3b17ad6cdea643ad
  CANDIDATE_SHA: 3fa6b7ca7735a4130ac5e1255ec42c7d725c5b40

jobs:
  prepare:
    if: github.head_ref == 'b25/accelerated-gate-20260921'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      roster_sha256: ${{ steps.matrix.outputs.roster_sha256 }}
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build canonical 30-site matrix
        id: matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json, pathlib
          path = pathlib.Path("data/renderer-risk-study-manifest.jsonl")
          raw = path.read_bytes()
          rows = [json.loads(line) for line in raw.decode().splitlines() if line.strip()]
          assert len(rows) == 30, len(rows)
          seen = set()
          include = []
          for index, row in enumerate(rows):
              site = str(row.get("site") or "").strip()
              url = str(row.get("url") or "").strip()
              stratum = str(row.get("stratum") or "").strip()
              assert site and site not in seen
              assert url.startswith(("https://", "http://"))
              assert stratum in {"smb_cms", "saas_js", "ecommerce_marketplace"}
              seen.add(site)
              include.append({
                  "site": site,
                  "url": url,
                  "stratum": stratum,
                  "review_batch": 1 + (index // 10),
              })
          print("matrix=" + json.dumps({"include": include}, separators=(",", ":")))
          print("roster_sha256=" + hashlib.sha256(raw).hexdigest())
          PY

      - name: Record immutable source pair
        run: |
          echo "Baseline:  $BASELINE_SHA"
          echo "Candidate: $CANDIDATE_SHA"
          test "$BASELINE_SHA" = "2ad64dc55ccc49d8fba4259f3b17ad6cdea643ad"
          test "$CANDIDATE_SHA" = "3fa6b7ca7735a4130ac5e1255ec42c7d725c5b40"

  collect:
    name: "B25 pair · ${{ matrix.site }}"
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout control helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control

      - name: Checkout exact baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout frozen candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate

      - name: Verify exact source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "baseline=$BASELINE_SHA"
          echo "candidate=$CANDIDATE_SHA"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            baseline/scanner-api/requirements.txt
            candidate/scanner-api/requirements.txt

      - name: Create isolated source environments
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/b25-baseline-venv"
          python -m venv "$RUNNER_TEMP/b25-candidate-venv"
          "$RUNNER_TEMP/b25-baseline-venv/bin/python" -m pip install --disable-pip-version-check -q -r baseline/scanner-api/requirements.txt
          "$RUNNER_TEMP/b25-candidate-venv/bin/python" -m pip install --disable-pip-version-check -q -r candidate/scanner-api/requirements.txt

      - name: Capture baseline then candidate through local Standard 150 path
        env:
          SITE_ID: ${{ matrix.site }}
          SITE_URL: ${{ matrix.url }}
          SITE_STRATUM: ${{ matrix.stratum }}
          REVIEW_BATCH: ${{ matrix.review_batch }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/b25-pair-$SITE_ID"
          python control/scripts/b25_capture_pair.py             --baseline-checkout "$GITHUB_WORKSPACE/baseline"             --candidate-checkout "$GITHUB_WORKSPACE/candidate"             --baseline-python "$RUNNER_TEMP/b25-baseline-venv/bin/python"             --candidate-python "$RUNNER_TEMP/b25-candidate-venv/bin/python"             --baseline-sha "$BASELINE_SHA"             --candidate-sha "$CANDIDATE_SHA"             --site-id "$SITE_ID"             --url "$SITE_URL"             --stratum "$SITE_STRATUM"             --output-dir "$OUT"
          echo "review_batch=$REVIEW_BATCH" > "$OUT/review-batch.txt"
          echo "roster_sha256=${{ needs.prepare.outputs.roster_sha256 }}" > "$OUT/roster.txt"

      - name: Upload paired evidence immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "b25-pair-${{ matrix.review_batch }}-${{ matrix.site }}"
          path: "${{ runner.temp }}/b25-pair-${{ matrix.site }}/"
          if-no-files-found: error
          retention-days: 14

      - name: Pair summary
        if: always()
        env:
          SITE_ID: ${{ matrix.site }}
          REVIEW_BATCH: ${{ matrix.review_batch }}
        shell: bash
        run: |
          echo "### $SITE_ID · review batch $REVIEW_BATCH" >> "$GITHUB_STEP_SUMMARY"
          echo "- baseline: `$BASELINE_SHA`" >> "$GITHUB_STEP_SUMMARY"
          echo "- candidate: `$CANDIDATE_SHA`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/b25-pair-$SITE_ID/pair-metadata.json" ]; then
            python - "$RUNNER_TEMP/b25-pair-$SITE_ID/pair-metadata.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          row=json.load(open(sys.argv[1]))
          for label in ("baseline","candidate"):
              art=row[label]
              print(f"- {label} fingerprint: `{art.get('release_fingerprint','')}`")
              print(f"- {label} capture status: `{art.get('capture_status','')}`")
              print(f"- {label} artifact SHA-256: `{art.get('artifact_sha256','')}`")
          PY
          fi

  collection-index:
    name: B25 collection index
    if: always() && github.head_ref == 'b25/accelerated-gate-20260921'
    needs: [prepare, collect]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize capture lane
        run: |
          echo "## B25 accelerated capture lane" >> "$GITHUB_STEP_SUMMARY"
          echo "- baseline: `$BASELINE_SHA`" >> "$GITHUB_STEP_SUMMARY"
          echo "- candidate: `$CANDIDATE_SHA`" >> "$GITHUB_STEP_SUMMARY"
          echo "- roster SHA-256: `${{ needs.prepare.outputs.roster_sha256 }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- source policy: no production secrets, no production endpoints, local source execution only" >> "$GITHUB_STEP_SUMMARY"
          echo "- independent semantic adjudication remains a separate gate" >> "$GITHUB_STEP_SUMMARY"