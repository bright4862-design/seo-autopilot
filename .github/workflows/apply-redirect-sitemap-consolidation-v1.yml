        )
        recommendation = specific_copy.get(
            "recommendation",
            "Fix one representative template or routing rule, verify the result, then apply it across every affected URL.",
        )
        sample.update({
            "id": group_id,
            "fix_id": group_id,
            "page_url": "",
            "title": title,
            "issue_title": title,
            "plain_english_explanation": explanation,
            "plain_english_summary": explanation,
            "why_it_matters": explanation,
            "recommended_value": recommendation,
            "recommendation": recommendation,
            "ai_recommendation": recommendation,
            "current_value": f"{len(affected)} affected URLs across {family_count} page families.",
            "priority": highest_priority,
            "affected_pages": affected,
            "page_count": len(affected),
            "page_template_family": "mixed" if cross_family else str(sample.get("page_template_family") or "standard"),
            "page_scope": "cross_family" if cross_family else "template",
            "family_count": family_count,
            "family_breakdown": dict(sorted(family_breakdown.items())),
            "representative_pages_by_family": dict(sorted(representative_pages_by_family.items())),
            "finding_consolidation_version": FINDING_CONSOLIDATION_VERSION,
            "source_pages": _unique(
                page for member in members for page in (member.get("source_pages") or [])
            ),
            "link_text_samples": _unique(
                text for member in members for text in (member.get("link_text_samples") or [])
            ),
        })
        output.append(sample)
    return output
''' + post[function_end:]
          post_path.write_text(post, encoding="utf-8")

