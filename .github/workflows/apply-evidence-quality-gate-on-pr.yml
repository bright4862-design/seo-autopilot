name: Apply evidence quality gate patch

on:
  pull_request:
    branches:
      - agent/persist-grouped-recommendation-evidence
    types:
      - opened
      - reopened

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Harden persistence test fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/apply_evidence_quality_gate.py")
          text = path.read_text(encoding="utf-8")
          old = '''    ...authoritativeRecord,\n    evidence_quality_state: "insufficient_discovery",'''
          new = '''    scan_mode: "advanced",\n    scan_status: "complete",\n    score_is_provisional: false,\n    scanner_version: EXPECTED_SCANNER_VERSION,\n    scanner_build_revision: EXPECTED_SCANNER_BUILD,\n    advanced_scan_backend: "python_scanner_api",\n    deno_fallback_used: false,\n    archetype_classifier_version: EXPECTED_CLASSIFIER_VERSION,\n    ai_review_backend: "python_review_api",\n    python_review_fallback_used: false,\n    review_version: EXPECTED_REVIEW_VERSION,\n    review_evidence_calibration_version: EXPECTED_CALIBRATION_VERSION,\n    beta_revision_fingerprint: EXPECTED_BETA_FINGERPRINT,\n    evidence_quality_state: "insufficient_discovery",'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one authoritative fixture locator, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply scoped patch
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/apply_evidence_quality_gate.py 2>&1 | tee evidence-quality-apply-output.txt

      - name: Upload applicator failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-quality-apply-output
          path: evidence-quality-apply-output.txt
          if-no-files-found: error

      - name: Install Python dependencies
        run: python -m pip install -r scanner-api/requirements.txt

      - name: Test evidence quality gate
        shell: bash
        env:
          PYTHONPATH: scanner-api
        run: |
          set -o pipefail
          pytest -q scanner-api/tests/test_evidence_quality_gate.py 2>&1 | tee evidence-quality-test-output.txt

      - name: Upload focused test failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-quality-test-output
          path: evidence-quality-test-output.txt
          if-no-files-found: error

      - name: Run scanner API regression suite
        shell: bash
        env:
          PYTHONPATH: scanner-api
        run: |
          set -o pipefail
          pytest -q scanner-api/tests 2>&1 | tee scanner-regression-output.txt

      - name: Upload scanner regression failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-regression-output
          path: scanner-regression-output.txt
          if-no-files-found: error

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend contract tests
        run: npm run test:frontend

      - name: Build production frontend
        run: npm run build

      - name: Commit direct patch and remove temporary applicators
        shell: bash
        run: |
          set -o pipefail
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -f \
              .github/scripts/apply_evidence_quality_gate.py \
              .github/workflows/apply-evidence-quality-gate-on-pr.yml
            git add \
              scanner-api/app/evidence_quality.py \
              scanner-api/app/main.py \
              scanner-api/app/beta_revision.py \
              scanner-api/tests/test_evidence_quality_gate.py \
              scanner-api/tests/test_observability.py \
              base44/entities/ScanRun.jsonc \
              src/lib/scanRunModel.js \
              tests/frontend/evidenceQualityGate.test.mjs \
              tests/frontend/releaseAuthorityGate.test.mjs \
              tests/frontend/scanRunPersistence.test.mjs \
              data/beta-crawler-revision.json \
              docs/releases/evidence-quality-gate-v1.md
            git status --short
            git commit -m "Block authority for default-route-dominated crawls"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          } 2>&1 | tee evidence-quality-commit-output.txt

      - name: Upload commit failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-quality-commit-output
          path: evidence-quality-commit-output.txt
          if-no-files-found: error
