name: Apply metadata and title evidence v9

on:
  push:
    branches:
      - agent/metadata-title-evidence-v9
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/metadata-title-evidence-v9
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt

      - name: Apply direct product patch
        run: python .github/scripts/apply_metadata_title_evidence_v9.py

      - name: Run focused metadata and title regressions
        working-directory: scanner-api
        run: pytest tests/test_metadata_title_evidence_v9.py -q

      - name: Run root scanner regressions
        run: pytest tests/ -q

      - name: Run complete scanner API suite
        working-directory: scanner-api
        run: pytest tests/ -q

      - name: Verify candidate release fingerprint
        working-directory: scanner-api
        run: python scripts/freeze_beta_revision.py --check

      - name: Commit transparent direct changes
        run: |
          rm -f .github/scripts/apply_metadata_title_evidence_v9.py
          rm -f .github/workflows/apply-metadata-title-evidence-v9.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Add versioned metadata and title evidence"
          git push origin HEAD:agent/metadata-title-evidence-v9
