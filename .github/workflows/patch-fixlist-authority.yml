name: Patch final FixList authority

on:
  push:
    branches: [agent/final-fixlist-authority]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-fixlist-authority
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply authority patch
        run: python scripts/patch_fixlist_authority.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend contract tests
        run: npm run test:frontend

      - name: Production build
        run: npm run build

      - name: Commit verified product patch
        run: |
          rm .github/workflows/patch-fixlist-authority.yml scripts/patch_fixlist_authority.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/reviewContract.js src/pages/FixList.jsx tests/frontend/reviewContract.test.mjs tests/frontend/fixListAuthority.test.mjs .github/workflows/patch-fixlist-authority.yml scripts/patch_fixlist_authority.py
          git commit -m "Preserve authoritative rate-limit presentation in FixList"
          git push origin HEAD:agent/final-fixlist-authority
