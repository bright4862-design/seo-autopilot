name: Guard indexability quality patch

on:
  push:
    branches:
      - agent/indexability-quality

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/indexability-quality
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scanner-api/requirements.txt

      - name: Apply scanner integration
        run: python scripts/apply_indexability_quality_patch.py

      - name: Run focused indexability regressions
        working-directory: scanner-api
        run: |
          python -m pytest \
            tests/test_indexability_quality.py \
            tests/test_indexability_extraction.py \
            tests/test_canonical_target_validation.py \
            tests/test_redirect_validation.py

      - name: Run full Python scanner suite
        working-directory: scanner-api
        run: python -m pytest

      - name: Publish validated product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner-api/app/scanner.py
          git rm scripts/apply_indexability_quality_patch.py .github/workflows/indexability-quality-guard.yml .github/indexability-quality-trigger
          git commit -m "Add soft-404 and indexability conflict evidence"
          git push origin HEAD:agent/indexability-quality
