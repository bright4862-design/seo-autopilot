name: Assemble reviewed B25 gate record

on:
  push:
    branches:
      - b25/accelerated-gate-20260921
    paths:
      - evidence/.b25-gate-gz/**
      - .github/workflows/b25-assemble-reviewed-gate.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify reviewed gate record
        shell: bash
        run: |
          set -euo pipefail
          cat evidence/.b25-gate-gz/part-00 evidence/.b25-gate-gz/part-01 > /tmp/b25-gate.gz.b64
          base64 -d /tmp/b25-gate.gz.b64 | gzip -d > evidence/b25-3fa6b7ca-gate-reviewed.json
          echo 'b4b43fd352ee6f4f2d3cff33c59402f53ab9727ebcbbe0c80a50a37fa4516193  evidence/b25-3fa6b7ca-gate-reviewed.json' | sha256sum -c -
          set +e
          node scripts/assertBlueprint30SiteGate.mjs evidence/b25-3fa6b7ca-gate-reviewed.json | tee /tmp/b25-gate-result.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 1
          grep -q '"status":"failed"' /tmp/b25-gate-result.txt
      - name: Persist reviewed FAIL record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/b25-3fa6b7ca-gate-reviewed.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist reviewed B25 3fa6b7ca gate FAIL record [skip ci]'
          git push
