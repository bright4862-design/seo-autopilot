name: Run final correctness patch

on:
  push:
    paths:
      - .github/workflows/run-final-correctness-patch.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch scripts
        id: patch
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python .github/scripts/patch_backend_correctness.py
            python .github/scripts/patch_scan_storage.py
            python .github/scripts/patch_fixlist_zero_state.py
          } 2>&1 | tee /tmp/patch.log

      - name: Run backend tests
        id: backend
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pip install -q -r scanner-api/requirements.txt
          (cd scanner-api && pytest -q) 2>&1 | tee /tmp/backend.log

      - name: Run frontend checks
        id: frontend
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm ci --silent
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          npm run build 2>&1 | tee /tmp/build.log

      - name: Commit tested patches
        if: steps.patch.outcome == 'success' && steps.backend.outcome == 'success' && steps.frontend.outcome == 'success'
        run: |
          rm -f .github/workflows/run-final-correctness-patch.yml
          rm -f .github/scripts/patch_backend_correctness.py .github/scripts/patch_scan_storage.py .github/scripts/patch_fixlist_zero_state.py
          rm -f diagnostics/ui-zero-fix.txt
          rmdir diagnostics 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix zero-fix UI and Pretto classification"
          git push origin HEAD:main

      - name: Commit failure diagnostics
        if: steps.patch.outcome != 'success' || steps.backend.outcome == 'failure' || steps.frontend.outcome == 'failure'
        run: |
          mkdir -p diagnostics
          {
            echo "patch=${{ steps.patch.outcome }}"
            echo "backend=${{ steps.backend.outcome }}"
            echo "frontend=${{ steps.frontend.outcome }}"
            echo "--- patch ---"
            cat /tmp/patch.log 2>/dev/null || true
            echo "--- backend ---"
            cat /tmp/backend.log 2>/dev/null || true
            echo "--- typecheck ---"
            cat /tmp/typecheck.log 2>/dev/null || true
            echo "--- build ---"
            cat /tmp/build.log 2>/dev/null || true
          } > diagnostics/final-patch-failure.txt
          rm -f .github/workflows/run-final-correctness-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/final-patch-failure.txt .github/workflows/run-final-correctness-patch.yml
          git commit -m "Capture final patch failure"
          git push origin HEAD:main
