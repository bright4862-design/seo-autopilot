name: Apply roadmap phases 1-4 patch

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/apply-roadmap-phases-1-4

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/apply-roadmap-phases-1-4
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Reconstruct and apply cumulative patch series
        id: apply_patch
        shell: bash
        run: |
          set +e
          : > /tmp/patch-diagnostic.log
          for part in .github/patches/roadmap-phases-1-4.part*.b64; do
            echo "$(basename "$part") bytes=$(wc -c < "$part") sha256=$(sha256sum "$part" | cut -d' ' -f1)" | tee -a /tmp/patch-diagnostic.log
          done
          expected_00='f7b143506212df685c22a93d1a0bfa9931bd20648a6fd80d761c863a05b02b38'
          expected_01='d324f8f7b7d092e1d3918fc6c7f49933159dfeb061a40afa78bfc8306579af01'
          actual_00=$(sha256sum .github/patches/roadmap-phases-1-4.part00.b64 | cut -d' ' -f1)
          actual_01=$(sha256sum .github/patches/roadmap-phases-1-4.part01.b64 | cut -d' ' -f1)
          if [ "$actual_00" != "$expected_00" ] || [ "$actual_01" != "$expected_01" ]; then
            echo "Staged chunk checksum mismatch" | tee -a /tmp/patch-diagnostic.log
            exit 1
          fi
          cat .github/patches/roadmap-phases-1-4.part00.b64 .github/patches/roadmap-phases-1-4.part01.b64 | base64 --decode | gzip --decompress > /tmp/roadmap-phases-1-4.patch 2>/tmp/reconstruct-error.log
          reconstruct_status=$?
          if [ "$reconstruct_status" -ne 0 ]; then
            echo "Patch reconstruction failed with status $reconstruct_status" | tee -a /tmp/patch-diagnostic.log
            cat /tmp/reconstruct-error.log | tee -a /tmp/patch-diagnostic.log
            exit "$reconstruct_status"
          fi
          {
            echo "patch_bytes=$(wc -c < /tmp/roadmap-phases-1-4.patch)"
            echo "patch_sha256=$(sha256sum /tmp/roadmap-phases-1-4.patch | cut -d' ' -f1)"
            grep '^Subject:' /tmp/roadmap-phases-1-4.patch
          } | tee -a /tmp/patch-diagnostic.log
          if [ "$(sha256sum /tmp/roadmap-phases-1-4.patch | cut -d' ' -f1)" != '86d84b79a36ae473998f7da1e992c5242c3ef3a755cc6fc5cc9f7bf1c7ba58dc' ]; then
            echo "Reconstructed patch checksum mismatch" | tee -a /tmp/patch-diagnostic.log
            exit 1
          fi
          git am --3way /tmp/roadmap-phases-1-4.patch > /tmp/git-am.log 2>&1
          apply_status=$?
          cat /tmp/git-am.log | tee -a /tmp/patch-diagnostic.log
          if [ "$apply_status" -ne 0 ]; then
            echo "git_status:" | tee -a /tmp/patch-diagnostic.log
            git status --short | tee -a /tmp/patch-diagnostic.log
            echo "unmerged_files:" | tee -a /tmp/patch-diagnostic.log
            git diff --name-only --diff-filter=U | tee -a /tmp/patch-diagnostic.log
            exit "$apply_status"
          fi

      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-patch-diagnostic
          path: /tmp/patch-diagnostic.log
          if-no-files-found: warn

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r scanner-api/requirements.txt

      - name: Run scanner tests
        run: PYTHONPATH=scanner-api pytest -q scanner-api/tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend quality gates
        run: |
          npm run lint
          npm run typecheck
          node tests/frontend/durableScanModel.test.mjs
          node tests/frontend/scanRunPersistence.test.mjs
          npm run build

      - name: Remove temporary patch machinery and push
        run: |
          rm -f .github/patches/roadmap-phases-1-4.part*.b64
          rm -f .github/workflows/apply-roadmap-phases.yml
          git add -A
          git commit -m 'Apply roadmap phases 1-4 patches'
          git push origin HEAD:agent/apply-roadmap-phases-1-4
