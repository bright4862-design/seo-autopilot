name: Focused acceptance follow-up v8

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  scanner-gates:
    name: Focused and complete scanner gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt
      - name: Apply focused follow-up patch
        run: python .github/scripts/apply_focused_acceptance_followup_v8.py
      - name: Run focused regressions
        working-directory: scanner-api
        run: pytest tests/test_focused_acceptance_followup_v8.py -q
      - name: Run root scanner regressions
        run: pytest tests/
      - name: Run complete scanner-api suite
        working-directory: scanner-api
        run: pytest tests/
      - name: Verify frozen revision
        working-directory: scanner-api
        run: python scripts/freeze_beta_revision.py --check

  frontend-gates:
    name: Frontend marker and build gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply focused follow-up patch
        run: python .github/scripts/apply_focused_acceptance_followup_v8.py
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend contracts
        run: npm run test:frontend
      - name: Production build
        run: npm run build

  publish-tested-source:
    name: Publish tested direct source changes
    needs: [scanner-gates, frontend-gates]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply tested product changes
        run: python .github/scripts/apply_focused_acceptance_followup_v8.py
      - name: Remove one-shot harness
        run: |
          rm .github/scripts/apply_focused_acceptance_followup_v8.py
          rm .github/workflows/focused-acceptance-followup-v8.yml
      - name: Commit tested source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix focused production acceptance blockers"
          git push origin HEAD:${{ github.head_ref }}
