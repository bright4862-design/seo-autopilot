name: FixList CI

on:
  push:
    branches: [main, integration/ext500-lifecycle-ci-v3-20261029]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck, contract tests, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python for actual scanner-to-customer corpus
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner test dependencies
        run: python -m pip install -r scanner-api/requirements.txt

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify generated release contracts are current
        run: node scripts/generate_release_contracts.mjs --check

      - name: Frontend contract tests
        run: npm run test:frontend

      - name: Build
        run: npm run build

  scanner-regressions:
    name: Scanner regression fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node for persisted customer integration
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install customer integration dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt

      - name: Run root scanner regression tests
        run: pytest tests/

      - name: Install gateway test dependencies
        run: pip install -r dispatch-gateway/requirements.txt

      - name: Verify signed comparison gateway
        run: pytest dispatch-gateway/test_gateway.py

      - name: Run Python scanner-api tests
        working-directory: scanner-api
        run: pytest tests/

      - name: Verify labelled stage-one synthetic corpus
        run: |
          python scanner-api/tests/test_stage1_blueprint_corpus.py --output /tmp/stage1-corpus.json
          node scripts/assertCorpusRun.mjs /tmp/stage1-corpus.json

      - name: Verify frozen beta revision matches code
        working-directory: scanner-api
        run: python scripts/freeze_beta_revision.py --check

      - name: Build production scanner image
        run: docker build --tag fixlist-scanner:ci .

  extended500-coordinator-compile:
    name: Extended 500 private coordinator image contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact integration probe source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Confirm checkout identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Build independent disabled-by-default Extended 500 coordinator
        run: docker build -f extended500-admission/Dockerfile -t fixlist-extended500-coordinator-ci:local extended500-admission

      - name: Verify bundled seed bridge, coordinator and Python syntax
        run: |
          docker run --rm --entrypoint python fixlist-extended500-coordinator-ci:local \
            -m py_compile core.py scanrun_seed.py seed_admission_bridge.py service.py
