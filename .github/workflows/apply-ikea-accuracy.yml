name: Apply IKEA accuracy regressions

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-test-clean:
    if: github.head_ref == 'agent/fix-ikea-accuracy-regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-ikea-accuracy-regressions
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Apply IKEA accuracy patch
        run: python .github/patches/apply-ikea-accuracy.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt

      - name: Compile Python
        run: python -m compileall -q scanner-api/app scanner-api/tests

      - name: Run focused IKEA regressions
        working-directory: scanner-api
        run: |
          set -o pipefail
          pytest tests/test_review_calibration.py -q 2>&1 | tee /tmp/ikea-focused.log

      - name: Upload focused failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ikea-focused-failure
          path: /tmp/ikea-focused.log

      - name: Run root scanner regressions
        run: pytest tests/

      - name: Run full scanner API suite
        working-directory: scanner-api
        run: pytest tests/

      - name: Verify frozen beta revision
        working-directory: scanner-api
        run: python scripts/freeze_beta_revision.py --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend contract tests
        run: npm run test:frontend

      - name: Production build
        run: npm run build

      - name: Remove temporary patch machinery
        run: |
          rm -f .github/patches/apply-ikea-accuracy.py
          rm -f .github/workflows/apply-ikea-accuracy.yml
          git add -A
          git commit -m 'Fix IKEA archetype redirect and utility URL accuracy'

      - name: Verify final scope and hygiene
        run: |
          git diff --check origin/main...HEAD
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          test -z "$(echo "$changed" | grep '^\.github/' || true)"
          echo "$changed" | grep -qx 'scanner-api/app/review.py'
          echo "$changed" | grep -qx 'scanner-api/app/review_calibration.py'
          echo "$changed" | grep -qx 'scanner-api/tests/test_review_calibration.py'
          test "$(echo "$changed" | wc -l | tr -d ' ')" = '3'

      - name: Push verified product branch
        run: git push origin HEAD:agent/fix-ikea-accuracy-regressions
