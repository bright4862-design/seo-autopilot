name: Representative evidence v8 guarded patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  scanner:
    name: Representative evidence and scanner gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt
      - name: Apply representative evidence v8 patch
        run: python tools/apply_representative_evidence_v8.py
      - name: Run focused representative evidence tests
        working-directory: scanner-api
        run: pytest -q tests/test_representative_evidence_v8.py tests/test_business_representative_pages.py tests/test_orphan_asset_evidence.py
      - name: Run root scanner regressions
        run: pytest tests/
      - name: Run complete scanner-api suite
        working-directory: scanner-api
        run: pytest tests/
      - name: Verify frozen revision
        working-directory: scanner-api
        run: python scripts/freeze_beta_revision.py --check

  frontend:
    name: Frontend marker and build gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply representative evidence v8 patch
        run: python tools/apply_representative_evidence_v8.py
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend contracts
        run: npm run test:frontend
      - name: Production build
        run: npm run build

  publish:
    name: Publish tested direct source changes
    needs: [scanner, frontend]
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply tested product changes
        run: python tools/apply_representative_evidence_v8.py
      - name: Remove one-shot harness
        run: |
          rm tools/apply_representative_evidence_v8.py
          rm .github/workflows/representative-evidence-v8-ci.yml
      - name: Commit tested source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve representative FixList evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
