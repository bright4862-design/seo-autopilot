name: Agent State

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "agent/**"
      - "scripts/validate_agent_state.py"
      - ".github/workflows/agent-state.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "agent/**"
      - "scripts/validate_agent_state.py"
      - ".github/workflows/agent-state.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate autonomous agent state
        run: python scripts/validate_agent_state.py
