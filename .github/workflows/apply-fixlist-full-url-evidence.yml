name: Apply FixList full URL evidence patch

on:
  push:
    branches:
      - feature/fixlist-full-url-evidence
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-and-validate:
    if: github.event_name == 'push' || github.head_ref == 'feature/fixlist-full-url-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fixlist-full-url-evidence
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Apply guarded source changes
        run: |
          python -m py_compile scripts/ops/apply_fixlist_full_url_evidence.py
          python scripts/ops/apply_fixlist_full_url_evidence.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/frontend/fixListEvidenceUx.test.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '  assert.match(fixListSource, /\\\\/cdn-cgi\\\\//);',
              '  assert.ok(fixListSource.includes("/cdn-cgi/"));',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend contract tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run test:frontend > /tmp/fixlist-contracts.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo '## FixList URL evidence contract failure'
              echo
              echo '```text'
              tail -n 180 /tmp/fixlist-contracts.log
              echo '```'
            } > /tmp/fixlist-contracts-comment.md
            gh pr comment 83 --body-file /tmp/fixlist-contracts-comment.md
          else
            cat /tmp/fixlist-contracts.log
          fi
          exit "$status"

      - name: Production build
        run: npm run build

      - name: Commit validated source
        run: |
          rm -f \
            .github/workflows/apply-fixlist-full-url-evidence.yml \
            scripts/ops/apply_fixlist_full_url_evidence.py \
            docs/.fixlist-full-url-evidence-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show all affected URLs and clarify FixList steps"
          git push origin HEAD:feature/fixlist-full-url-evidence
