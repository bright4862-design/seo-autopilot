name: Apply redirect acceptance fix

on:
  push:
    branches:
      - agent/fix-redirect-acceptance-check
    paths:
      - .github/patches/apply_redirect_acceptance_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-redirect-acceptance-check
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply guarded patch
        run: python .github/patches/apply_redirect_acceptance_fix.py

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scanner-api/requirements.txt

      - name: Run focused acceptance regressions
        working-directory: scanner-api
        run: python -m pytest tests/test_crawler_acceptance.py

      - name: Run full scanner suite
        working-directory: scanner-api
        run: python -m pytest tests/

      - name: Remove temporary patch automation
        run: |
          rm .github/patches/apply_redirect_acceptance_fix.py
          rm .github/workflows/apply-redirect-acceptance-fix.yml

      - name: Commit validated product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner-api/app/crawler_acceptance.py scanner-api/tests/test_crawler_acceptance.py data/final-crawler-validation-trigger .github
          git commit -m "Fix redirect acceptance classification"
          git push origin HEAD:agent/fix-redirect-acceptance-check
