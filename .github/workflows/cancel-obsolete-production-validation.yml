name: Cancel obsolete production validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cancel-obsolete-production-validation.yml

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete run and identify corrected run
        env:
          GH_TOKEN: ${{ github.token }}
          OBSOLETE_SHA: d3f00b0601cbd7eea144553b098763b8d58b4c09
          CORRECTED_SHA: 833774216636d350f66cf6a5ec4d3f88346b31e5
          HANDOFF_ISSUE: "71"
          WORKFLOW_FILE: deployed-production-20-site-validation.yml
        run: |
          set -euo pipefail

          runs_json="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=100")"

          obsolete_ids="$(jq -r --arg sha "$OBSOLETE_SHA" '
            .workflow_runs[]
            | select(.head_sha == $sha)
            | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")
            | .id
          ' <<<"$runs_json")"

          cancelled=""
          if [ -n "$obsolete_ids" ]; then
            while IFS= read -r run_id; do
              [ -z "$run_id" ] && continue
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel"
              cancelled="${cancelled}${run_id} "
            done <<<"$obsolete_ids"
          fi

          sleep 5
          refreshed="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=100")"
          obsolete_json="$(jq -c --arg sha "$OBSOLETE_SHA" '[.workflow_runs[] | select(.head_sha == $sha) | {id,status,conclusion,html_url,created_at,updated_at}]' <<<"$refreshed")"
          corrected_json="$(jq -c --arg sha "$CORRECTED_SHA" '[.workflow_runs[] | select(.head_sha == $sha) | {id,status,conclusion,html_url,created_at,updated_at}]' <<<"$refreshed")"

          cat > /tmp/cancellation-handoff.md <<EOF
          ## Production-validation run coordination

          - Obsolete trigger commit: \`${OBSOLETE_SHA}\`
          - Cancellation requested for run IDs: \`${cancelled:-none-active}\`
          - Obsolete runs after cancellation request: \`${obsolete_json}\`
          - Corrected trigger commit: \`${CORRECTED_SHA}\`
          - Corrected runs: \`${corrected_json}\`

          Only runs whose `head_sha` is \`${CORRECTED_SHA}\` are eligible for Codex validation.
          EOF

          gh issue comment "$HANDOFF_ISSUE" --body-file /tmp/cancellation-handoff.md
