name: Patch scoring rule dedup

on:
  push:
    branches:
      - agent/dedupe-health-score-by-rule

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/dedupe-health-score-by-rule
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanner dependencies
        run: pip install -r scanner-api/requirements.txt

      - name: Apply scoring patch
        run: python .github/scripts/patch_scoring_rule_dedup.py

      - name: Run focused scoring regressions
        run: pytest -q scanner-api/tests/test_review_calibration.py

      - name: Run complete scanner suite
        run: pytest -q scanner-api/tests

      - name: Check patch formatting
        run: git diff --check

      - name: Commit validated patch and remove temporary machinery
        run: |
          rm .github/scripts/patch_scoring_rule_dedup.py
          rm .github/workflows/patch-scoring-rule-dedup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner-api/app/review.py scanner-api/tests/test_review_calibration.py .github/scripts/patch_scoring_rule_dedup.py .github/workflows/patch-scoring-rule-dedup.yml
          git commit -m "Deduplicate health score by rule"
          git push origin HEAD:agent/dedupe-health-score-by-rule
