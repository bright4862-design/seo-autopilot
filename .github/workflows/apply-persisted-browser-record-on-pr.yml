name: Apply persisted browser record patch on PR

on:
  pull_request:
    branches:
      - agent/canonical-origin-alias-equivalence
    types:
      - opened
      - reopened

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply scoped patch
        run: python .github/scripts/apply_persisted_browser_record.py

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test pure persisted-record merge
        run: node --test tests/frontend/persistedBrowserRecord.test.mjs

      - name: Test release authority source contract
        run: node --test tests/frontend/releaseAuthorityGate.test.mjs

      - name: Run remaining frontend tests
        run: npm run test:frontend

      - name: Build production frontend
        run: npm run build

      - name: Commit direct patch and remove temporary applicators
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/scripts/apply_persisted_browser_record.py \
            .github/workflows/apply-persisted-browser-record-on-pr.yml
          git add \
            src/components/scan/ScanWebsiteForm.jsx \
            src/lib/persistedScanRecord.js \
            src/lib/scanRuns.js \
            tests/frontend/persistedBrowserRecord.test.mjs \
            tests/frontend/releaseAuthorityGate.test.mjs
          git commit -m "Persist authoritative scan fields in browser history"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
