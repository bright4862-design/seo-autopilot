)


def is_support_content_path(path: str) -> bool:
    clean = str(path or "").lower().split("?")[0].split("#")[0].rstrip("/") or "/"
    return bool(SUPPORT_CONTENT_PREFIX_RE.match(clean) or SUPPORT_CONTENT_NESTED_RE.match(clean))


