name: Clean repository Python caches

on:
  push:
    branches: [agent/repository-hygiene]

permissions:
  contents: write

jobs:
  clean-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/repository-hygiene
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove tracked Python cache artifacts
        shell: bash
        run: |
          mapfile -t CACHE_FILES < <(git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$' || true)
          if [ "${#CACHE_FILES[@]}" -gt 0 ]; then
            printf 'Removing tracked cache files:\n%s\n' "${CACHE_FILES[*]}"
            git rm -f -- "${CACHE_FILES[@]}"
          fi

      - name: Add Python cache ignore rules
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.gitignore')
          text = path.read_text(encoding='utf-8') if path.exists() else ''
          rules = ['__pycache__/', '*.py[cod]', '.pytest_cache/']
          missing = [rule for rule in rules if rule not in text.splitlines()]
          if missing:
              suffix = '' if not text or text.endswith('\n') else '\n'
              text += suffix + '\n# Python cache and test artifacts\n' + '\n'.join(missing) + '\n'
              path.write_text(text, encoding='utf-8')
          PY

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio
          pip install -r scanner-api/requirements.txt

      - name: Run root scanner regressions
        run: pytest tests/

      - name: Run scanner-api regressions
        working-directory: scanner-api
        run: pytest tests/

      - name: Commit verified cleanup
        run: |
          rm .github/workflows/repository-hygiene.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository hygiene changes were needed."
            exit 0
          fi
          git commit -m "Remove tracked Python cache artifacts"
          git push origin HEAD:agent/repository-hygiene
