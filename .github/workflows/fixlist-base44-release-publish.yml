name: FixList Base44 Release Publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Exact current main SHA. Must equal the release source SHA."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fixlist-base44-hosted-controls-v2
  cancel-in-progress: false

jobs:
  publish-base44-release:
    if: >-
      github.actor == 'bright4862-design' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    environment: fixlist-production-owner
    # Builder-compatible Base44 auth uses an ephemeral device-code owner session
    # on the hosted runner. No refresh/access token is serialized into GitHub
    # secrets, and no self-hosted runner is required.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact clean main source
        shell: /bin/bash {0}
        run: |
          set -euo pipefail
          test "${{ github.actor }}" = "bright4862-design"
          test "${{ github.ref }}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse origin/main)" = "${{ github.sha }}"
          test -z "$(git status --porcelain --untracked-files=all)"
          /bin/bash -n scripts/deploy-base44-beta-site.sh
          /bin/bash -n scripts/authenticate-base44-owner-session.sh
          /bin/bash -n scripts/lib/release-source-guard.sh

      - name: Resolve exact owner confirmation
        id: confirm
        shell: /bin/bash {0}
        env:
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$INPUT_CONFIRM" = "$source_sha"
          echo "confirm=$INPUT_CONFIRM" >> "$GITHUB_OUTPUT"

      - name: Set up pinned Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.5'
          cache: npm

      - name: Authenticate Base44 owner with ephemeral device code
        shell: /bin/bash {0}
        env:
          BASE44_EXPECTED_OWNER: ${{ secrets.BASE44_EXPECTED_OWNER }}
        run: /bin/bash scripts/authenticate-base44-owner-session.sh

      - name: Install exact frontend dependencies
        run: npm ci

      - name: Verify Base44 release package manifest
        run: node scripts/base44_release_manifest.mjs verify

      - name: Publish exact Base44 site and canonical release functions
        shell: /bin/bash {0}
        env:
          SOURCE_SHA: ${{ github.sha }}
          CONFIRM: ${{ steps.confirm.outputs.confirm }}
          BASE44_EXPECTED_OWNER: ${{ secrets.BASE44_EXPECTED_OWNER }}
        run: /bin/bash scripts/deploy-base44-beta-site.sh

      - name: Remove ephemeral Base44 owner session
        if: ${{ always() }}
        shell: /bin/bash {0}
        run: rm -rf "$HOME/.base44"
